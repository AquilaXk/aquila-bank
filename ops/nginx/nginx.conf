worker_processes auto;
pid /tmp/aquila-bank-nginx.pid;

events {
  worker_connections 1024;
}

http {
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  client_max_body_size 1m;
  limit_req_status 429;

  # 짧은 API 요청만 1차 보호하고, SSE는 exact location과 전용 upstream으로 분리합니다.
  limit_req_zone $binary_remote_addr zone=aquila_bank_api_per_ip:10m rate=30r/s;
  # 공개 auth 진입점은 token/bcrypt 비용 전에 더 보수적으로 edge 차단합니다.
  limit_req_zone $binary_remote_addr zone=aquila_bank_auth_per_ip:10m rate=5r/s;

  upstream aquila_bank_frontend {
${NGINX_FRONTEND_SERVER_LINES}
    keepalive 8;
  }

  upstream aquila_bank_backend_api {
${NGINX_BACKEND_API_SERVER_LINES}
    keepalive 16;
  }

  upstream aquila_bank_backend_sse {
    least_conn;
${NGINX_BACKEND_SSE_SERVER_LINES}
    keepalive 32;
  }

  server {
    listen 80 default_server;
    server_name ${NGINX_SERVER_NAME};

    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # ACME challenge는 HTTP 경로가 필요해 redirect 예외로 둡니다.
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type text/plain;
    }

    # 간단한 외부 probe는 HTTP health check로도 유지할 수 있게 둡니다.
    location ^~ /actuator/health {
      proxy_pass http://aquila_bank_backend_api;
      proxy_set_header Host ${NGINX_BACKEND_PROXY_HOST};
      proxy_set_header Connection "";
      proxy_read_timeout 5s;
      proxy_send_timeout 5s;
      access_log off;
    }

    location / {
      return 308 https://$server_name$request_uri;
    }
  }

  server {
    listen 443 ssl http2;
    server_name ${NGINX_SERVER_NAME};

    ssl_certificate ${NGINX_SSL_CERTIFICATE_PATH};
    ssl_certificate_key ${NGINX_SSL_CERTIFICATE_KEY_PATH};
    ssl_session_cache shared:AquilaBankTLS:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # SSE는 backend heartbeat가 10초 간격으로 오더라도 proxy buffering이 켜져 있으면 전달이 밀립니다.
    location = /api/v1/notifications/stream {
      proxy_pass http://aquila_bank_backend_sse;
      proxy_set_header Host ${NGINX_BACKEND_PROXY_HOST};
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      gzip off;
      # SSE failover는 client reconnect + Last-Event-ID replay 계약으로 넘깁니다.
      proxy_next_upstream off;
      proxy_read_timeout 1900s;
      proxy_send_timeout 1900s;
      add_header X-Accel-Buffering no always;
    }

    # 공개 auth는 generic /api/ limit에 섞지 않고 별도 zone으로 먼저 자릅니다.
    location = /api/v1/auth/login {
      proxy_pass http://aquila_bank_backend_api;
      proxy_set_header Host ${NGINX_BACKEND_PROXY_HOST};
      proxy_set_header Connection "";
      limit_req zone=aquila_bank_auth_per_ip burst=10 nodelay;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    location = /api/v1/auth/refresh {
      proxy_pass http://aquila_bank_backend_api;
      proxy_set_header Host ${NGINX_BACKEND_PROXY_HOST};
      proxy_set_header Connection "";
      limit_req zone=aquila_bank_auth_per_ip burst=10 nodelay;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    location = /api/v1/auth/password-recovery/request {
      proxy_pass http://aquila_bank_backend_api;
      proxy_set_header Host ${NGINX_BACKEND_PROXY_HOST};
      proxy_set_header Connection "";
      limit_req zone=aquila_bank_auth_per_ip burst=10 nodelay;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    location /api/ {
      proxy_pass http://aquila_bank_backend_api;
      proxy_set_header Host ${NGINX_BACKEND_PROXY_HOST};
      proxy_set_header Connection "";
      limit_req zone=aquila_bank_api_per_ip burst=60 nodelay;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    location ^~ /actuator/health {
      proxy_pass http://aquila_bank_backend_api;
      proxy_set_header Host ${NGINX_BACKEND_PROXY_HOST};
      proxy_set_header Connection "";
      proxy_read_timeout 5s;
      proxy_send_timeout 5s;
      access_log off;
    }

    location / {
      proxy_pass http://aquila_bank_frontend;
      proxy_set_header Connection "";
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }
  }
}

# Local k6 loadtest runtime config. 저장소 baseline을 유지하되 target은 compose service 이름으로 고정합니다.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/aquila-bank-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: aquila-bank-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - aquila-bank-backend:8080
        labels:
          service: aquila-bank
          environment: local-loadtest

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          service: postgres
          environment: local-loadtest

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          service: prometheus
          environment: local-loadtest

# baseline threshold는 현재 back/README.md와 env 기본값 기준입니다.
# 운영 적용 전 scrape interval, traffic, SSE max session, query volume에 맞게 재조정합니다.
groups:
  - name: aquila-bank-outbox
    interval: 30s
    rules:
      - alert: AquilaOutboxDispatchLagHigh
        expr: max(aquila_outbox_dispatch_lag_seconds) > 120
        for: 10m
        labels:
          severity: warning
          service: aquila-bank
          domain: outbox
          baseline: "true"
        annotations:
          summary: "Aquila Bank outbox dispatch lag is high"
          description: "outbox dispatch lag seconds가 10분 이상 120초를 초과했습니다. backlog와 producer publish path를 같이 확인합니다."
          runbook_path: "back/README.md#outbox-ops-runbook"

      - alert: AquilaOutboxFailedBacklogHigh
        expr: max(aquila_outbox_failed_count) > 10
        for: 10m
        labels:
          severity: warning
          service: aquila-bank
          domain: outbox
          baseline: "true"
        annotations:
          summary: "Aquila Bank outbox failed backlog is high"
          description: "outbox failed count가 10분 이상 10건을 초과했습니다. failed event list와 lastError를 먼저 확인합니다."
          runbook_path: "back/README.md#outbox-ops-runbook"

      - alert: AquilaOutboxProducerTimeoutFailedDetected
        expr: max(aquila_outbox_failed_producer_timeout_count) > 0
        for: 15m
        labels:
          severity: warning
          service: aquila-bank
          domain: outbox
          baseline: "true"
        annotations:
          summary: "Aquila Bank producer timeout failures detected"
          description: "producer timeout 기반 outbox failure가 15분 이상 0건 초과 상태입니다. broker/connection timeout을 먼저 점검합니다."
          runbook_path: "back/README.md#outbox-ops-runbook"

      - alert: AquilaOutboxStaleSendingDetected
        expr: max(aquila_outbox_sending_stale_count) > 0
        for: 5m
        labels:
          severity: critical
          service: aquila-bank
          domain: outbox
          baseline: "true"
        annotations:
          summary: "Aquila Bank stale outbox sending rows detected"
          description: "stale sending row가 5분 이상 남아 있습니다. stale recovery와 dispatch health를 즉시 확인합니다."
          runbook_path: "back/README.md#outbox-ops-runbook"

  - name: aquila-bank-notification
    interval: 30s
    rules:
      - alert: AquilaNotificationConsumerLagHigh
        expr: max(aquila_notification_consumer_lag_count) > 100
        for: 10m
        labels:
          severity: warning
          service: aquila-bank
          domain: notification
          baseline: "true"
        annotations:
          summary: "Aquila Bank notification consumer lag is high"
          description: "notification consumer lagCount가 10분 이상 100건을 초과했습니다. consumer summary와 DLQ 상태를 같이 확인합니다."
          runbook_path: "back/README.md#outbox-ops-runbook"

      - alert: AquilaNotificationConsumerDlqDetected
        expr: max(aquila_notification_consumer_dlq_count) > 0
        for: 5m
        labels:
          severity: critical
          service: aquila-bank
          domain: notification
          baseline: "true"
        annotations:
          summary: "Aquila Bank notification DLQ messages detected"
          description: "notification DLQ count가 5분 이상 0건 초과 상태입니다. poison message preview와 redrive 대상 여부를 확인합니다."
          runbook_path: "back/README.md#outbox-ops-runbook"

      - alert: AquilaNotificationSseSessionPressureHigh
        expr: max(aquila_notification_sse_sessions{principal_type="total"}) > 56
        for: 10m
        labels:
          severity: warning
          service: aquila-bank
          domain: notification
          baseline: "true"
        annotations:
          summary: "Aquila Bank SSE session pressure is high"
          description: "SSE total session이 10분 이상 56을 초과했습니다. 기본 max-total-sessions=64 기준 87.5% 사용률 baseline입니다."
          runbook_path: "back/README.md#prometheus-metrics"

  - name: aquila-bank-auth
    interval: 30s
    rules:
      - alert: AquilaCurrentSessionActiveGateRejectDetected
        expr: sum(rate(aquila_auth_current_session_gate_reject_count_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: aquila-bank
          domain: auth
          baseline: "true"
        annotations:
          summary: "Aquila Bank current session active gate rejects detected"
          description: "민감 mutation에서 current session active gate 차단이 5분 이상 발생했습니다. requestId 기준 structured audit log를 먼저 확인합니다."
          runbook_path: "back/README.md#prometheus-metrics"

      - alert: AquilaRefreshTokenReuseDetected
        expr: sum(rate(aquila_auth_refresh_token_reuse_detected_count_total[5m])) > 0
        for: 1m
        labels:
          severity: critical
          service: aquila-bank
          domain: auth
          baseline: "true"
        annotations:
          summary: "Aquila Bank refresh token reuse detected"
          description: "refresh token reuse 감지가 발생했습니다. requestId 기준 structured audit log와 revokedCount를 즉시 확인합니다."
          runbook_path: "back/README.md#prometheus-metrics"

      - alert: AquilaAuthThrottlingRejectBurstDetected
        expr: sum by (entry_point, scope, store) (increase(aquila_auth_throttling_reject_count_total[10m])) >= 5
        for: 5m
        labels:
          severity: warning
          service: aquila-bank
          domain: auth
          baseline: "true"
        annotations:
          summary: "Aquila Bank auth throttling rejects are increasing"
          description: "login/password recovery throttling reject가 10분 window에서 5건 이상 누적됐습니다. entry_point, scope, store 축과 auth structured log를 같이 확인합니다."
          runbook_path: "back/README.md#prometheus-metrics"

  - name: aquila-bank-postgres
    interval: 30s
    rules:
      - alert: AquilaDbPoolPendingWaitDetected
        expr: max(hikaricp_connections_pending{pool="aquila-bank-pool"}) > 0
        for: 5m
        labels:
          severity: warning
          service: aquila-bank
          domain: postgres
          signal: pool_wait
          baseline: "true"
        annotations:
          summary: "Aquila Bank DB pool wait detected"
          description: "Hikari pending connection이 5분 이상 남아 있습니다. lock wait, slow query, DB CPU를 transaction p95와 함께 확인합니다."
          runbook_path: "back/README.md#prometheus-metrics"

      - alert: AquilaDbPoolActivePressureHigh
        expr: |
          (
            max(hikaricp_connections_active{pool="aquila-bank-pool"})
            /
            clamp_min(max(hikaricp_connections_max{pool="aquila-bank-pool"}), 1)
          ) > 0.9
        for: 10m
        labels:
          severity: warning
          service: aquila-bank
          domain: postgres
          signal: pool_active_pressure
          baseline: "true"
        annotations:
          summary: "Aquila Bank DB pool active pressure is high"
          description: "Hikari active connection이 max pool의 90%를 10분 이상 초과했습니다. t3.micro 기본 pool=4 기준 queueing 전조로 봅니다."
          runbook_path: "back/README.md#prometheus-metrics"

      - alert: AquilaDbQueryTimeoutDetected
        expr: sum(rate(aquila_t3micro_saturation_guard_query_timeouts_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: aquila-bank
          domain: postgres
          signal: query_timeout
          baseline: "true"
        annotations:
          summary: "Aquila Bank DB query timeouts detected"
          description: "query timeout이 5분 window에서 증가했습니다. statement_timeout, lock_timeout, pool wait를 같은 시간대에서 확인합니다."
          runbook_path: "back/README.md#prometheus-metrics"

      - alert: AquilaPostgresLockWaitDetected
        expr: sum by (datname) (pg_stat_activity_lock_waiting_count) > 0
        for: 5m
        labels:
          severity: warning
          service: aquila-bank
          domain: postgres
          signal: lock_wait
          baseline: "true"
        annotations:
          summary: "Aquila Bank PostgreSQL lock wait detected"
          description: "pg_stat_activity wait_event_type=Lock 기반 custom metric이 5분 이상 0건 초과입니다. blocking PID와 긴 transaction을 먼저 확인합니다."
          runbook_path: "back/README.md#prometheus-metrics"

      - alert: AquilaPostgresSlowQueryDetected
        expr: |
          (
            sum by (datname) (rate(pg_stat_statements_seconds_total[5m]))
            /
            clamp_min(sum by (datname) (rate(pg_stat_statements_calls_total[5m])), 0.001)
          ) > 0.75
          and on (datname)
          sum by (datname) (rate(pg_stat_statements_calls_total[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
          service: aquila-bank
          domain: postgres
          signal: slow_query
          baseline: "true"
        annotations:
          summary: "Aquila Bank PostgreSQL slow query signal detected"
          description: "pg_stat_statements 평균 실행 시간이 10분 이상 750ms를 초과했습니다. query text는 alert label로 올리지 않고 exporter/dashboard에서 queryid 기준으로 drill-down합니다."
          runbook_path: "back/README.md#prometheus-metrics"

  - name: aquila-bank-transaction
    interval: 30s
    rules:
      - alert: AquilaTransactionQueryLatencyP95SloHigh
        expr: |
          (
            (
              histogram_quantile(
                0.95,
                sum by (le, query_shape) (
                  rate(aquila_transaction_query_latency_seconds_bucket{outcome="success",query_shape="reference_exact"}[5m])
                )
              ) > 0.08
            )
            or
            (
              histogram_quantile(
                0.95,
                sum by (le, query_shape) (
                  rate(aquila_transaction_query_latency_seconds_bucket{outcome="success",query_shape="first_page"}[5m])
                )
              ) > 0.12
            )
            or
            (
              histogram_quantile(
                0.95,
                sum by (le, query_shape) (
                  rate(aquila_transaction_query_latency_seconds_bucket{outcome="success",query_shape=~"cursor|status_first|status_cursor|direction_first|direction_cursor"}[5m])
                )
              ) > 0.15
            )
            or
            (
              histogram_quantile(
                0.95,
                sum by (le, query_shape) (
                  rate(aquila_transaction_query_latency_seconds_bucket{outcome="success",query_shape=~"amount_first|amount_cursor|mixed_first|mixed_cursor"}[5m])
                )
              ) > 0.18
            )
          )
          and on (query_shape)
          sum by (query_shape) (
            rate(aquila_transaction_query_latency_seconds_count{outcome="success"}[5m])
          ) > 0.1
        for: 5m
        labels:
          severity: warning
          service: aquila-bank
          domain: transaction
          baseline: "true"
          slo: "p95"
        annotations:
          summary: "Aquila Bank transaction query p95 SLO is high"
          description: "transaction query p95 latency가 query_shape별 baseline SLO를 5분 이상 초과했습니다. histogram bucket과 query volume을 같이 확인합니다."
          runbook_path: "back/README.md#prometheus-metrics"

      - alert: AquilaTransactionQueryLatencyHigh
        expr: |
          (
            sum(rate(aquila_transaction_query_latency_seconds_sum{outcome="success"}[5m]))
            /
            clamp_min(sum(rate(aquila_transaction_query_latency_seconds_count{outcome="success"}[5m])), 0.001)
          ) > 0.75
          and
          sum(rate(aquila_transaction_query_latency_seconds_count{outcome="success"}[5m])) > 0.1
        for: 15m
        labels:
          severity: warning
          service: aquila-bank
          domain: transaction
          baseline: "true"
        annotations:
          summary: "Aquila Bank transaction query latency is high"
          description: "transaction query 평균 latency가 15분 이상 750ms를 초과했습니다. baseline 값이므로 실제 traffic 분포에 맞게 재조정합니다."
          runbook_path: "back/README.md#prometheus-metrics"

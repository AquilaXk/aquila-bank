spring:
  application:
    name: aquila-bank
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aquila_bank}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: aquila-bank-pool
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:4}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: 1000
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1700000}
      auto-commit: false
      connection-init-sql: SET statement_timeout TO '${DB_STATEMENT_TIMEOUT_MS:3000}ms'; SET lock_timeout TO '${DB_LOCK_TIMEOUT_MS:1000}ms'; SET idle_in_transaction_session_timeout TO '${DB_IDLE_IN_TX_TIMEOUT_MS:5000}ms'
      data-source-properties:
        reWriteBatchedInserts: true
        ApplicationName: aquila-bank
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true
  jdbc:
    template:
      query-timeout: ${DB_QUERY_TIMEOUT_SECONDS:3}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mvc:
    async:
      request-timeout: 5000ms
  transaction:
    default-timeout: ${DB_TRANSACTION_TIMEOUT_SECONDS:5}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
  tomcat:
    threads:
      max: ${SERVER_THREADS_MAX:16}
      min-spare: 2
    accept-count: 20
    connection-timeout: 3s

management:
  health:
    # Redis는 opt-in throttling store라 기본 memory 경로에서는 actuator DOWN 전파를 막습니다.
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    distribution:
      slo:
        # p95 SLO alert가 쓰는 경계만 고정해 query_shape/outcome별 bucket 수를 제한합니다.
        aquila.transaction.query.latency: 50ms,80ms,120ms,150ms,180ms,350ms,750ms,1s,3s

ops:
  api-admission-control:
    enabled: ${OPS_API_ADMISSION_CONTROL_ENABLED:true}
    retry-after-seconds: ${OPS_API_ADMISSION_CONTROL_RETRY_AFTER_SECONDS:1}
    endpoints:
      - group: transaction-read
        max-concurrency: ${OPS_API_ADMISSION_CONTROL_TRANSACTION_READ_MAX:3}
        path-prefixes:
          - /api/v1/transactions
      - group: account-read
        max-concurrency: ${OPS_API_ADMISSION_CONTROL_ACCOUNT_READ_MAX:4}
        path-prefixes:
          - /api/v1/accounts
      - group: transfer-write
        max-concurrency: ${OPS_API_ADMISSION_CONTROL_TRANSFER_WRITE_MAX:2}
        path-prefixes:
          - /api/v1/transfers
      - group: notification-stream
        max-concurrency: ${OPS_API_ADMISSION_CONTROL_NOTIFICATION_STREAM_MAX:4}
        path-prefixes:
          - /api/v1/notifications/stream
      - group: notification-read
        max-concurrency: ${OPS_API_ADMISSION_CONTROL_NOTIFICATION_READ_MAX:4}
        path-prefixes:
          - /api/v1/notifications
          - /api/v1/notification-preferences
      - group: internal-ops
        max-concurrency: ${OPS_API_ADMISSION_CONTROL_INTERNAL_OPS_MAX:2}
        path-prefixes:
          - /internal/api/v1/accounts
          - /internal/api/v1/ledger
          - /internal/api/v1/outbox
  t3-micro-saturation-guard:
    enabled: ${OPS_T3MICRO_SATURATION_GUARD_ENABLED:true}
    retry-after-seconds: ${OPS_T3MICRO_SATURATION_GUARD_RETRY_AFTER_SECONDS:2}
    protected-path-prefixes:
      - /api/v1/accounts
      - /api/v1/transactions
      - /api/v1/transfers
      - /api/v1/notifications
      - /internal/api/v1/accounts
      - /internal/api/v1/ledger
      - /internal/api/v1/outbox
    pool:
      active-threshold-percent: ${OPS_T3MICRO_SATURATION_GUARD_POOL_ACTIVE_THRESHOLD_PERCENT:90}
      awaiting-threads-threshold: ${OPS_T3MICRO_SATURATION_GUARD_POOL_AWAITING_THREADS_THRESHOLD:1}
    servlet-threads:
      busy-threshold-percent: ${OPS_T3MICRO_SATURATION_GUARD_THREADS_BUSY_THRESHOLD_PERCENT:90}
    query-timeout:
      window-seconds: ${OPS_T3MICRO_SATURATION_GUARD_QUERY_TIMEOUT_WINDOW_SECONDS:10}
      threshold: ${OPS_T3MICRO_SATURATION_GUARD_QUERY_TIMEOUT_THRESHOLD:1}

logging:
  pattern:
    level: '%5p [requestId:%X{requestId:-}]'
  level:
    root: INFO

outbox:
  poller:
    enabled: true
    fixed-delay-ms: ${OUTBOX_POLLER_FIXED_DELAY_MS:1000}
    initial-delay-ms: ${OUTBOX_POLLER_INITIAL_DELAY_MS:3000}
    batch-size: ${OUTBOX_POLLER_BATCH_SIZE:20}
    adaptive-enabled: ${OUTBOX_POLLER_ADAPTIVE_ENABLED:true}
    min-batch-size: ${OUTBOX_POLLER_MIN_BATCH_SIZE:5}
    max-adaptive-delay-ms: ${OUTBOX_POLLER_MAX_ADAPTIVE_DELAY_MS:8000}
    stale-after-seconds: ${OUTBOX_POLLER_STALE_AFTER_SECONDS:30}
    max-retry-delay-seconds: ${OUTBOX_POLLER_MAX_RETRY_DELAY_SECONDS:60}
    max-retry-attempts: ${OUTBOX_POLLER_MAX_RETRY_ATTEMPTS:10}
  cleanup:
    enabled: ${OUTBOX_CLEANUP_ENABLED:true}
    fixed-delay-ms: ${OUTBOX_CLEANUP_FIXED_DELAY_MS:300000}
    initial-delay-ms: ${OUTBOX_CLEANUP_INITIAL_DELAY_MS:60000}
    batch-size: ${OUTBOX_CLEANUP_BATCH_SIZE:500}
    retention-days: ${OUTBOX_CLEANUP_RETENTION_DAYS:30}
  kafka:
    enabled: ${OUTBOX_KAFKA_ENABLED:false}
    bootstrap-servers: ${OUTBOX_KAFKA_BOOTSTRAP_SERVERS:}
    send-timeout-ms: ${OUTBOX_KAFKA_SEND_TIMEOUT_MS:5000}
    topic:
      default-name: ${OUTBOX_KAFKA_TOPIC_DEFAULT:}
      event-type-overrides:
        TransferBooked: ${OUTBOX_KAFKA_TOPIC_TRANSFER_BOOKED:}
        TransferReversed: ${OUTBOX_KAFKA_TOPIC_TRANSFER_REVERSED:}
    serializer:
      key-class: ${OUTBOX_KAFKA_KEY_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
      value-class: ${OUTBOX_KAFKA_VALUE_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
    retry:
      retries: ${OUTBOX_KAFKA_PRODUCER_RETRIES:3}
      retry-backoff-ms: ${OUTBOX_KAFKA_PRODUCER_RETRY_BACKOFF_MS:1000}
      delivery-timeout-ms: ${OUTBOX_KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:30000}
      request-timeout-ms: ${OUTBOX_KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:3000}
    producer:
      client-id: ${OUTBOX_KAFKA_PRODUCER_CLIENT_ID:aquila-bank-outbox-producer}
      acks: ${OUTBOX_KAFKA_PRODUCER_ACKS:all}
      enable-idempotence: ${OUTBOX_KAFKA_PRODUCER_ENABLE_IDEMPOTENCE:true}
      max-in-flight-requests-per-connection: ${OUTBOX_KAFKA_PRODUCER_MAX_IN_FLIGHT:1}
  ops:
    enabled: ${OUTBOX_OPS_ENABLED:false}
    token-header: ${OUTBOX_OPS_TOKEN_HEADER:X-Outbox-Ops-Token}
    token: ${OUTBOX_OPS_TOKEN:}
    failed-list-limit: ${OUTBOX_OPS_FAILED_LIST_LIMIT:20}
    health:
      max-lag-seconds: ${OUTBOX_OPS_HEALTH_MAX_LAG_SECONDS:120}
      max-failed-count: ${OUTBOX_OPS_HEALTH_MAX_FAILED_COUNT:10}
      max-stale-sending-count: ${OUTBOX_OPS_HEALTH_MAX_STALE_SENDING_COUNT:0}

auth:
  password-recovery:
    delivery:
      enabled: ${AUTH_PASSWORD_RECOVERY_DELIVERY_ENABLED:false}
      auth-header-name: ${AUTH_PASSWORD_RECOVERY_DELIVERY_AUTH_HEADER_NAME:Authorization}
      auth-header-value: ${AUTH_PASSWORD_RECOVERY_DELIVERY_AUTH_HEADER_VALUE:}
      idempotency-header-name: ${AUTH_PASSWORD_RECOVERY_DELIVERY_IDEMPOTENCY_HEADER_NAME:Idempotency-Key}
      connect-timeout-ms: ${AUTH_PASSWORD_RECOVERY_DELIVERY_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${AUTH_PASSWORD_RECOVERY_DELIVERY_READ_TIMEOUT_MS:5000}
      email:
        url: ${AUTH_PASSWORD_RECOVERY_DELIVERY_EMAIL_URL:}
      sms:
        url: ${AUTH_PASSWORD_RECOVERY_DELIVERY_SMS_URL:}
      worker:
        enabled: ${AUTH_PASSWORD_RECOVERY_DELIVERY_WORKER_ENABLED:true}
        fixed-delay-ms: ${AUTH_PASSWORD_RECOVERY_DELIVERY_WORKER_FIXED_DELAY_MS:5000}
        initial-delay-ms: ${AUTH_PASSWORD_RECOVERY_DELIVERY_WORKER_INITIAL_DELAY_MS:30000}
        batch-size: ${AUTH_PASSWORD_RECOVERY_DELIVERY_WORKER_BATCH_SIZE:10}
        retry-base-delay-seconds: ${AUTH_PASSWORD_RECOVERY_DELIVERY_WORKER_RETRY_BASE_DELAY_SECONDS:5}
        max-retry-delay-seconds: ${AUTH_PASSWORD_RECOVERY_DELIVERY_WORKER_MAX_RETRY_DELAY_SECONDS:60}
        max-retry-attempts: ${AUTH_PASSWORD_RECOVERY_DELIVERY_WORKER_MAX_RETRY_ATTEMPTS:10}
  refresh-token-session:
    cleanup:
      enabled: ${AUTH_REFRESH_TOKEN_SESSION_CLEANUP_ENABLED:true}
      fixed-delay-ms: ${AUTH_REFRESH_TOKEN_SESSION_CLEANUP_FIXED_DELAY_MS:300000}
      initial-delay-ms: ${AUTH_REFRESH_TOKEN_SESSION_CLEANUP_INITIAL_DELAY_MS:60000}
      batch-size: ${AUTH_REFRESH_TOKEN_SESSION_CLEANUP_BATCH_SIZE:500}
      retention-days: ${AUTH_REFRESH_TOKEN_SESSION_CLEANUP_RETENTION_DAYS:30}
  password-recovery-token:
    cleanup:
      enabled: ${AUTH_PASSWORD_RECOVERY_TOKEN_CLEANUP_ENABLED:true}
      fixed-delay-ms: ${AUTH_PASSWORD_RECOVERY_TOKEN_CLEANUP_FIXED_DELAY_MS:300000}
      initial-delay-ms: ${AUTH_PASSWORD_RECOVERY_TOKEN_CLEANUP_INITIAL_DELAY_MS:60000}
      batch-size: ${AUTH_PASSWORD_RECOVERY_TOKEN_CLEANUP_BATCH_SIZE:500}
      retention-days: ${AUTH_PASSWORD_RECOVERY_TOKEN_CLEANUP_RETENTION_DAYS:7}

ledger:
  transfer-limit:
    single-transfer-limit-minor: ${LEDGER_TRANSFER_LIMIT_SINGLE_TRANSFER_LIMIT_MINOR:10000000}
    daily-transfer-limit-minor: ${LEDGER_TRANSFER_LIMIT_DAILY_TRANSFER_LIMIT_MINOR:50000000}
    business-zone-id: ${LEDGER_TRANSFER_LIMIT_BUSINESS_ZONE_ID:Asia/Seoul}
  command-idempotency:
    cleanup:
      enabled: ${LEDGER_COMMAND_IDEMPOTENCY_CLEANUP_ENABLED:true}
      fixed-delay-ms: ${LEDGER_COMMAND_IDEMPOTENCY_CLEANUP_FIXED_DELAY_MS:300000}
      initial-delay-ms: ${LEDGER_COMMAND_IDEMPOTENCY_CLEANUP_INITIAL_DELAY_MS:60000}
      batch-size: ${LEDGER_COMMAND_IDEMPOTENCY_CLEANUP_BATCH_SIZE:500}
      retention-days: ${LEDGER_COMMAND_IDEMPOTENCY_CLEANUP_RETENTION_DAYS:14}
    ops:
      enabled: ${LEDGER_COMMAND_IDEMPOTENCY_OPS_ENABLED:false}
      stale-after-seconds: ${LEDGER_COMMAND_IDEMPOTENCY_OPS_STALE_AFTER_SECONDS:30}
      list-limit: ${LEDGER_COMMAND_IDEMPOTENCY_OPS_LIST_LIMIT:20}
      recovery-batch-size: ${LEDGER_COMMAND_IDEMPOTENCY_OPS_RECOVERY_BATCH_SIZE:100}
  snapshot-reconciliation:
    enabled: ${LEDGER_SNAPSHOT_RECONCILIATION_ENABLED:false}
    fixed-delay-ms: ${LEDGER_SNAPSHOT_RECONCILIATION_FIXED_DELAY_MS:300000}
    initial-delay-ms: ${LEDGER_SNAPSHOT_RECONCILIATION_INITIAL_DELAY_MS:60000}
    batch-size: ${LEDGER_SNAPSHOT_RECONCILIATION_BATCH_SIZE:100}
    drift-list-limit: ${LEDGER_SNAPSHOT_RECONCILIATION_DRIFT_LIST_LIMIT:50}
    recovery-reason-max-length: ${LEDGER_SNAPSHOT_RECONCILIATION_RECOVERY_REASON_MAX_LENGTH:200}

transaction:
  read-replica:
    enabled: ${TRANSACTION_READ_REPLICA_ENABLED:false}
    url: ${TRANSACTION_READ_REPLICA_URL:}
    username: ${TRANSACTION_READ_REPLICA_USERNAME:}
    password: ${TRANSACTION_READ_REPLICA_PASSWORD:}
    driver-class-name: ${TRANSACTION_READ_REPLICA_DRIVER_CLASS_NAME:org.postgresql.Driver}
    minimum-idle: ${TRANSACTION_READ_REPLICA_POOL_MIN_IDLE:0}
    maximum-pool-size: ${TRANSACTION_READ_REPLICA_POOL_MAX_SIZE:2}
    connection-timeout-ms: ${TRANSACTION_READ_REPLICA_CONNECTION_TIMEOUT_MS:3000}
    validation-timeout-ms: ${TRANSACTION_READ_REPLICA_VALIDATION_TIMEOUT_MS:1000}
    idle-timeout-ms: ${TRANSACTION_READ_REPLICA_IDLE_TIMEOUT_MS:300000}
    max-lifetime-ms: ${TRANSACTION_READ_REPLICA_MAX_LIFETIME_MS:1700000}
    statement-timeout-ms: ${TRANSACTION_READ_REPLICA_STATEMENT_TIMEOUT_MS:${DB_STATEMENT_TIMEOUT_MS:3000}}
    lock-timeout-ms: ${TRANSACTION_READ_REPLICA_LOCK_TIMEOUT_MS:${DB_LOCK_TIMEOUT_MS:1000}}
    idle-in-transaction-timeout-ms: ${TRANSACTION_READ_REPLICA_IDLE_IN_TX_TIMEOUT_MS:${DB_IDLE_IN_TX_TIMEOUT_MS:5000}}
    lag-threshold-ms: ${TRANSACTION_READ_REPLICA_LAG_THRESHOLD_MS:3000}
    probe-cache-ms: ${TRANSACTION_READ_REPLICA_PROBE_CACHE_MS:1000}
    hot-read-window-ms: ${TRANSACTION_READ_REPLICA_HOT_READ_WINDOW_MS:30000}
  read-model:
    cleanup:
      enabled: ${TRANSACTION_READ_MODEL_CLEANUP_ENABLED:false}
      fixed-delay-ms: ${TRANSACTION_READ_MODEL_CLEANUP_FIXED_DELAY_MS:300000}
      initial-delay-ms: ${TRANSACTION_READ_MODEL_CLEANUP_INITIAL_DELAY_MS:60000}
      batch-size: ${TRANSACTION_READ_MODEL_CLEANUP_BATCH_SIZE:500}
      retention-days: ${TRANSACTION_READ_MODEL_CLEANUP_RETENTION_DAYS:365}

notification:
  channel-provider:
    delivery:
      enabled: ${NOTIFICATION_CHANNEL_PROVIDER_DELIVERY_ENABLED:false}
      auth-header-name: ${NOTIFICATION_CHANNEL_PROVIDER_DELIVERY_AUTH_HEADER_NAME:Authorization}
      auth-header-value: ${NOTIFICATION_CHANNEL_PROVIDER_DELIVERY_AUTH_HEADER_VALUE:}
      connect-timeout-ms: ${NOTIFICATION_CHANNEL_PROVIDER_DELIVERY_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${NOTIFICATION_CHANNEL_PROVIDER_DELIVERY_READ_TIMEOUT_MS:5000}
      email:
        url: ${NOTIFICATION_CHANNEL_PROVIDER_DELIVERY_EMAIL_URL:}
      sms:
        url: ${NOTIFICATION_CHANNEL_PROVIDER_DELIVERY_SMS_URL:}
    worker:
      enabled: ${NOTIFICATION_CHANNEL_PROVIDER_WORKER_ENABLED:false}
      fixed-delay-ms: ${NOTIFICATION_CHANNEL_PROVIDER_WORKER_FIXED_DELAY_MS:5000}
      initial-delay-ms: ${NOTIFICATION_CHANNEL_PROVIDER_WORKER_INITIAL_DELAY_MS:30000}
      batch-size: ${NOTIFICATION_CHANNEL_PROVIDER_WORKER_BATCH_SIZE:10}
      retry-base-delay-seconds: ${NOTIFICATION_CHANNEL_PROVIDER_WORKER_RETRY_BASE_DELAY_SECONDS:5}
      max-retry-delay-seconds: ${NOTIFICATION_CHANNEL_PROVIDER_WORKER_MAX_RETRY_DELAY_SECONDS:60}
      max-retry-attempts: ${NOTIFICATION_CHANNEL_PROVIDER_WORKER_MAX_RETRY_ATTEMPTS:10}
    cleanup:
      enabled: ${NOTIFICATION_CHANNEL_PROVIDER_CLEANUP_ENABLED:true}
      fixed-delay-ms: ${NOTIFICATION_CHANNEL_PROVIDER_CLEANUP_FIXED_DELAY_MS:300000}
      initial-delay-ms: ${NOTIFICATION_CHANNEL_PROVIDER_CLEANUP_INITIAL_DELAY_MS:60000}
      batch-size: ${NOTIFICATION_CHANNEL_PROVIDER_CLEANUP_BATCH_SIZE:200}
      retention-days: ${NOTIFICATION_CHANNEL_PROVIDER_CLEANUP_RETENTION_DAYS:30}
    ops:
      enabled: ${NOTIFICATION_CHANNEL_PROVIDER_OPS_ENABLED:false}
      quarantined-list-limit: ${NOTIFICATION_CHANNEL_PROVIDER_OPS_QUARANTINED_LIST_LIMIT:20}
  unread-projection:
    reconcile:
      enabled: ${NOTIFICATION_UNREAD_PROJECTION_RECONCILE_ENABLED:false}
      fixed-delay-ms: ${NOTIFICATION_UNREAD_PROJECTION_RECONCILE_FIXED_DELAY_MS:300000}
      initial-delay-ms: ${NOTIFICATION_UNREAD_PROJECTION_RECONCILE_INITIAL_DELAY_MS:60000}
  sse:
    connection-timeout-ms: ${NOTIFICATION_SSE_CONNECTION_TIMEOUT_MS:1800000}
    heartbeat-interval-ms: ${NOTIFICATION_SSE_HEARTBEAT_INTERVAL_MS:10000}
    reconnect-delay-ms: ${NOTIFICATION_SSE_RECONNECT_DELAY_MS:3000}
    replay-limit: ${NOTIFICATION_SSE_REPLAY_LIMIT:100}
    max-total-sessions: ${NOTIFICATION_SSE_MAX_TOTAL_SESSIONS:64}
    max-user-sessions: ${NOTIFICATION_SSE_MAX_USER_SESSIONS:4}
    max-pending-events-per-session: ${NOTIFICATION_SSE_MAX_PENDING_EVENTS_PER_SESSION:32}
    fanout-channel: ${NOTIFICATION_SSE_FANOUT_CHANNEL:notification_sse_fanout}
    fanout-listen-timeout-ms: ${NOTIFICATION_SSE_FANOUT_LISTEN_TIMEOUT_MS:1000}
    fanout-retry-delay-ms: ${NOTIFICATION_SSE_FANOUT_RETRY_DELAY_MS:2000}
  inbox:
    cleanup:
      enabled: ${NOTIFICATION_INBOX_CLEANUP_ENABLED:true}
      fixed-delay-ms: ${NOTIFICATION_INBOX_CLEANUP_FIXED_DELAY_MS:300000}
      initial-delay-ms: ${NOTIFICATION_INBOX_CLEANUP_INITIAL_DELAY_MS:60000}
      batch-size: ${NOTIFICATION_INBOX_CLEANUP_BATCH_SIZE:500}
      retention-days: ${NOTIFICATION_INBOX_CLEANUP_RETENTION_DAYS:90}
    consumer:
      enabled: ${NOTIFICATION_INBOX_CONSUMER_ENABLED:false}
      auto-startup: ${NOTIFICATION_INBOX_CONSUMER_AUTO_STARTUP:true}
      concurrency: ${NOTIFICATION_INBOX_CONSUMER_CONCURRENCY:1}
      bootstrap-servers: ${NOTIFICATION_INBOX_CONSUMER_BOOTSTRAP_SERVERS:}
      group-id: ${NOTIFICATION_INBOX_CONSUMER_GROUP_ID:aquila-bank-notification-inbox-consumer}
      auto-offset-reset: ${NOTIFICATION_INBOX_CONSUMER_AUTO_OFFSET_RESET:earliest}
      transfer-booked:
        topic: ${NOTIFICATION_INBOX_CONSUMER_TRANSFER_BOOKED_TOPIC:}
      transfer-reversed:
        topic: ${NOTIFICATION_INBOX_CONSUMER_TRANSFER_REVERSED_TOPIC:}
      dlq:
        topic: ${NOTIFICATION_INBOX_CONSUMER_DLQ_TOPIC:}
      ops:
        enabled: ${NOTIFICATION_INBOX_CONSUMER_OPS_ENABLED:false}
        dlq-preview-limit: ${NOTIFICATION_INBOX_CONSUMER_OPS_DLQ_PREVIEW_LIMIT:20}
        summary-cache-seconds: ${NOTIFICATION_INBOX_CONSUMER_OPS_SUMMARY_CACHE_SECONDS:5}
        health:
          max-lag-messages: ${NOTIFICATION_INBOX_CONSUMER_OPS_HEALTH_MAX_LAG_MESSAGES:100}
          max-dlq-count: ${NOTIFICATION_INBOX_CONSUMER_OPS_HEALTH_MAX_DLQ_COUNT:0}

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET}
    issuer: ${SECURITY_JWT_ISSUER:}
    access-token-ttl-seconds: ${SECURITY_JWT_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${SECURITY_JWT_REFRESH_TOKEN_TTL_SECONDS:1209600}
    refresh-device-cookie-name: ${SECURITY_JWT_REFRESH_DEVICE_COOKIE_NAME:ab_refresh_device}
  totp:
    issuer: ${SECURITY_TOTP_ISSUER:Aquila Bank}
    secret-encryption-key: ${SECURITY_TOTP_SECRET_ENCRYPTION_KEY:${SECURITY_JWT_SECRET:}}
    enrollment-ttl-seconds: ${SECURITY_TOTP_ENROLLMENT_TTL_SECONDS:300}
    challenge-ttl-seconds: ${SECURITY_TOTP_CHALLENGE_TTL_SECONDS:300}
    challenge-max-attempts: ${SECURITY_TOTP_CHALLENGE_MAX_ATTEMPTS:5}
  mfa:
    remember-device:
      cookie-name: ${SECURITY_MFA_REMEMBER_DEVICE_COOKIE_NAME:ab_mfa_remember_device}
      ttl-seconds: ${SECURITY_MFA_REMEMBER_DEVICE_TTL_SECONDS:2592000}
  password-recovery:
    ttl-seconds: ${SECURITY_PASSWORD_RECOVERY_TTL_SECONDS:900}
    secret-encryption-key: ${SECURITY_PASSWORD_RECOVERY_SECRET_ENCRYPTION_KEY:${SECURITY_JWT_SECRET:}}
  internal-service-token:
    issuer: ${SECURITY_INTERNAL_SERVICE_TOKEN_ISSUER:}
    audience: ${SECURITY_INTERNAL_SERVICE_TOKEN_AUDIENCE:}
    authorization-header: ${SECURITY_INTERNAL_SERVICE_TOKEN_AUTHORIZATION_HEADER:Authorization}
    clock-skew-seconds: ${SECURITY_INTERNAL_SERVICE_TOKEN_CLOCK_SKEW_SECONDS:30}
    default-ttl-seconds: ${SECURITY_INTERNAL_SERVICE_TOKEN_DEFAULT_TTL_SECONDS:300}
    active-key-id: ${SECURITY_INTERNAL_SERVICE_TOKEN_ACTIVE_KEY_ID:}
    keys: {}
  login-protection:
    max-failures: ${SECURITY_LOGIN_PROTECTION_MAX_FAILURES:5}
    lock-seconds: ${SECURITY_LOGIN_PROTECTION_LOCK_SECONDS:900}
    reset-window-seconds: ${SECURITY_LOGIN_PROTECTION_RESET_WINDOW_SECONDS:900}
  login-throttling:
    max-tracked-ips: ${SECURITY_LOGIN_THROTTLING_MAX_TRACKED_IPS:1024}
    store: ${SECURITY_LOGIN_THROTTLING_STORE:memory}
    ip:
      max-attempts: ${SECURITY_LOGIN_THROTTLING_IP_MAX_ATTEMPTS:20}
      window-seconds: ${SECURITY_LOGIN_THROTTLING_IP_WINDOW_SECONDS:60}
    global:
      max-attempts: ${SECURITY_LOGIN_THROTTLING_GLOBAL_MAX_ATTEMPTS:40}
      window-seconds: ${SECURITY_LOGIN_THROTTLING_GLOBAL_WINDOW_SECONDS:10}
    redis:
      key-prefix: ${SECURITY_LOGIN_THROTTLING_REDIS_KEY_PREFIX:auth:login:throttle:}
  bootstrap-header-auth:
    enabled: ${SECURITY_BOOTSTRAP_HEADER_AUTH_ENABLED:false}
    account-id-header: ${SECURITY_BOOTSTRAP_ACCOUNT_ID_HEADER:X-Account-Id}
    subject-header: ${SECURITY_BOOTSTRAP_SUBJECT_HEADER:X-Subject}
  account-bootstrap-api:
    enabled: ${SECURITY_ACCOUNT_BOOTSTRAP_API_ENABLED:false}
    token-header: ${SECURITY_ACCOUNT_BOOTSTRAP_API_TOKEN_HEADER:X-Bootstrap-Token}
    token: ${SECURITY_ACCOUNT_BOOTSTRAP_API_TOKEN:}
  auth-bootstrap-api:
    enabled: ${SECURITY_AUTH_BOOTSTRAP_API_ENABLED:false}
    token-header: ${SECURITY_AUTH_BOOTSTRAP_API_TOKEN_HEADER:X-Auth-Bootstrap-Token}

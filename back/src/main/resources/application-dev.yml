spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.aquilabank: DEBUG

management:
  endpoint:
    health:
      show-details: always

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:dev-local-jwt-secret-dev-local-jwt-secret}
  internal-service-token:
    issuer: ${SECURITY_INTERNAL_SERVICE_TOKEN_ISSUER:dev-internal-service}
    audience: ${SECURITY_INTERNAL_SERVICE_TOKEN_AUDIENCE:aquila-internal-api}
    active-key-id: ${SECURITY_INTERNAL_SERVICE_TOKEN_ACTIVE_KEY_ID:ops-202604}
    keys:
      ops-202604: ${SECURITY_INTERNAL_SERVICE_TOKEN_KEYS_OPS_202604:dev-internal-service-secret-ops-202604}
      ops-202603: ${SECURITY_INTERNAL_SERVICE_TOKEN_KEYS_OPS_202603:dev-internal-service-secret-ops-202603}
  bootstrap-header-auth:
    enabled: ${SECURITY_BOOTSTRAP_HEADER_AUTH_ENABLED:true}
  account-bootstrap-api:
    enabled: ${SECURITY_ACCOUNT_BOOTSTRAP_API_ENABLED:true}
    token: ${SECURITY_ACCOUNT_BOOTSTRAP_API_TOKEN:dev-bootstrap-api-token}
  auth-bootstrap-api:
    enabled: ${SECURITY_AUTH_BOOTSTRAP_API_ENABLED:true}
    token: ${SECURITY_AUTH_BOOTSTRAP_API_TOKEN:dev-auth-bootstrap-api-token}

outbox:
  kafka:
    bootstrap-servers: ${OUTBOX_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic:
      default-name: ${OUTBOX_KAFKA_TOPIC_DEFAULT:bank.notification.outbox.v1}
      event-type-overrides:
        TransferBooked: ${OUTBOX_KAFKA_TOPIC_TRANSFER_BOOKED:bank.transfer.booked.v1}
        TransferReversed: ${OUTBOX_KAFKA_TOPIC_TRANSFER_REVERSED:bank.transfer.reversed.v1}

notification:
  inbox:
    consumer:
      bootstrap-servers: ${NOTIFICATION_INBOX_CONSUMER_BOOTSTRAP_SERVERS:localhost:9092}
      transfer-booked:
        topic: ${NOTIFICATION_INBOX_CONSUMER_TRANSFER_BOOKED_TOPIC:bank.transfer.booked.v1}
      transfer-reversed:
        topic: ${NOTIFICATION_INBOX_CONSUMER_TRANSFER_REVERSED_TOPIC:bank.transfer.reversed.v1}
      dlq:
        topic: ${NOTIFICATION_INBOX_CONSUMER_DLQ_TOPIC:bank.transfer.booked.dlq.v1}
      ops:
        enabled: ${NOTIFICATION_INBOX_CONSUMER_OPS_ENABLED:true}

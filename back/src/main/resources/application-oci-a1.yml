spring:
  config:
    activate:
      on-profile: oci-a1
  datasource:
    hikari:
      # OCI A1 4 OCPU / 24GB 기준: DB connection은 admission floor보다 조금 크게 둔다.
      maximum-pool-size: ${OCI_A1_DB_POOL_MAX_SIZE:8}
      minimum-idle: ${OCI_A1_DB_POOL_MIN_IDLE:1}
      # OCI A1 live soak에서 60초 안쪽 stale close가 관측되어 pool이 먼저 교체하도록 둔다.
      max-lifetime: ${OCI_A1_DB_MAX_LIFETIME_MS:45000}
      keepalive-time: ${OCI_A1_DB_KEEPALIVE_TIME_MS:30000}
      validation-timeout: ${OCI_A1_DB_VALIDATION_TIMEOUT_MS:1000}
  task:
    execution:
      pool:
        core-size: ${OCI_A1_TASK_EXECUTION_CORE_SIZE:4}
        max-size: ${OCI_A1_TASK_EXECUTION_MAX_SIZE:8}
        queue-capacity: ${OCI_A1_TASK_EXECUTION_QUEUE_CAPACITY:200}

server:
  tomcat:
    threads:
      max: ${OCI_A1_SERVER_THREADS_MAX:32}
      min-spare: ${OCI_A1_SERVER_THREADS_MIN_SPARE:4}
    accept-count: ${OCI_A1_SERVER_ACCEPT_COUNT:64}

transaction:
  read-replica:
    maximum-pool-size: ${OCI_A1_TRANSACTION_READ_REPLICA_POOL_MAX_SIZE:6}
  read:
    per-account:
      # hot account의 first/cursor/deep cursor shape가 burst 중 서로 밀어내지 않도록 account 단위 여유만 둔다.
      max-concurrency: ${OCI_A1_TRANSACTION_READ_PER_ACCOUNT_MAX_CONCURRENCY:3}

oci-a1:
  transaction-read:
    admission:
      # paced-weighted-vu16에서 Hikari pending이 낮아 admission 회복 여지를 둔다.
      max: ${OCI_A1_TRANSACTION_READ_ADMISSION_MAX:8}
      retry-after-seconds: ${OCI_A1_TRANSACTION_READ_ADMISSION_RETRY_AFTER_SECONDS:0}
      min: ${OCI_A1_TRANSACTION_READ_ADMISSION_MIN:6}
      adaptive-max: ${OCI_A1_TRANSACTION_READ_ADMISSION_ADAPTIVE_MAX:12}
      increase-every-successes: ${OCI_A1_TRANSACTION_READ_ADMISSION_INCREASE_EVERY_SUCCESSES:32}
      decrease-on-rejections: ${OCI_A1_TRANSACTION_READ_ADMISSION_DECREASE_ON_REJECTIONS:1}
      rejection-window-size: ${OCI_A1_TRANSACTION_READ_ADMISSION_REJECTION_WINDOW_SIZE:32}
      decrease-rejection-ratio: ${OCI_A1_TRANSACTION_READ_ADMISSION_DECREASE_REJECTION_RATIO:0.45}
      decrease-cooldown-seconds: ${OCI_A1_TRANSACTION_READ_ADMISSION_DECREASE_COOLDOWN_SECONDS:2}
      recovery-step: ${OCI_A1_TRANSACTION_READ_ADMISSION_RECOVERY_STEP:1}
      low-saturation-increase-every-successes: ${OCI_A1_TRANSACTION_READ_ADMISSION_LOW_SATURATION_INCREASE_EVERY_SUCCESSES:16}
      low-saturation-recovery-step: ${OCI_A1_TRANSACTION_READ_ADMISSION_LOW_SATURATION_RECOVERY_STEP:2}
      low-saturation-max-in-flight: ${OCI_A1_TRANSACTION_READ_ADMISSION_LOW_SATURATION_MAX_IN_FLIGHT:1}

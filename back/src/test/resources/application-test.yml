spring:
  flyway:
    # Tests that do not depend on real schema migration can bootstrap faster without Flyway.
    enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/aquila_bank_test
    username: postgres
    password: postgres
    hikari:
      initialization-fail-timeout: 0

management:
  health:
    db:
      # Context-load tests should not fail only because the test database is absent.
      enabled: false

outbox:
  poller:
    # Scheduled dispatch is disabled so tests control retry timing explicitly.
    enabled: false

security:
  jwt:
    secret: test-local-jwt-secret-test-local-jwt-secret
  bootstrap-header-auth:
    enabled: true

spring:
  flyway:
    # 실제 schema migration에 의존하지 않는 테스트는 Flyway 없이 더 빠르게 부팅합니다.
    enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/aquila_bank_test
    username: postgres
    password: postgres
    hikari:
      initialization-fail-timeout: 0

management:
  health:
    db:
      # test DB가 없다는 이유만으로 context-load 테스트가 실패하지 않게 합니다.
      enabled: false

outbox:
  poller:
    # scheduled dispatch는 끄고 테스트가 retry 타이밍을 직접 제어하게 합니다.
    enabled: false
  kafka:
    enabled: false
  ops:
    enabled: false
    token-header: X-Outbox-Ops-Token
    token: ""
    failed-list-limit: 20
    health:
      max-lag-seconds: 120
      max-failed-count: 10
      max-stale-sending-count: 0

notification:
  inbox:
    consumer:
      dlq:
        topic: ""
      ops:
        enabled: false
        dlq-preview-limit: 20
        summary-cache-seconds: 5
        health:
          max-lag-messages: 100
          max-dlq-count: 0

security:
  jwt:
    secret: test-local-jwt-secret-test-local-jwt-secret
    refresh-token-ttl-seconds: 1209600
  login-protection:
    max-failures: 5
    lock-seconds: 900
    reset-window-seconds: 900
  bootstrap-header-auth:
    enabled: true
  account-bootstrap-api:
    enabled: true
    token: test-bootstrap-api-token
  auth-bootstrap-api:
    enabled: true
    token: test-auth-bootstrap-api-token

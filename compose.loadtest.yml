services:
  postgres:
    container_name: ${LOADTEST_POSTGRES_CONTAINER_NAME:-aquila-bank-postgres-loadtest}
    ports: !override
      - "${LOADTEST_DB_PORT:-15432}:5432"
    command:
      [
        "postgres",
        "-c",
        "max_wal_size=${LOADTEST_POSTGRES_MAX_WAL_SIZE:-4GB}",
        "-c",
        "checkpoint_timeout=${LOADTEST_POSTGRES_CHECKPOINT_TIMEOUT:-15min}",
        "-c",
        "checkpoint_completion_target=${LOADTEST_POSTGRES_CHECKPOINT_COMPLETION_TARGET:-0.9}",
        "-c",
        "maintenance_work_mem=${LOADTEST_POSTGRES_MAINTENANCE_WORK_MEM:-16MB}",
        "-c",
        "work_mem=${LOADTEST_POSTGRES_WORK_MEM:-2MB}",
        "-c",
        "max_parallel_workers_per_gather=${LOADTEST_POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER:-0}",
        "-c",
        "max_parallel_maintenance_workers=${LOADTEST_POSTGRES_MAX_PARALLEL_MAINTENANCE_WORKERS:-0}",
        "-c",
        "jit=${LOADTEST_POSTGRES_JIT:-off}",
        "-c",
        "autovacuum=${LOADTEST_POSTGRES_AUTOVACUUM:-off}",
      ]

  aquila-bank-backend:
    image: eclipse-temurin:21-jre
    container_name: ${LOADTEST_BACKEND_CONTAINER_NAME:-aquila-bank-backend-loadtest}
    profiles:
      - loadtest
    restart: unless-stopped
    cpus: "${T3MICRO_BACKEND_CPUS:-2}"
    mem_limit: "${T3MICRO_BACKEND_MEMORY:-1024m}"
    memswap_limit: "${T3MICRO_BACKEND_MEMORY_SWAP:-1024m}"
    pids_limit: ${T3MICRO_BACKEND_PIDS_LIMIT:-384}
    ports:
      - "${LOADTEST_BACKEND_PORT:-18080}:8080"
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      SERVER_COMPRESSION_ENABLED: ${SERVER_COMPRESSION_ENABLED:-true}
      SERVER_COMPRESSION_MIN_RESPONSE_SIZE: ${SERVER_COMPRESSION_MIN_RESPONSE_SIZE:-2KB}
      SERVER_COMPRESSION_MIME_TYPES: ${SERVER_COMPRESSION_MIME_TYPES:-application/json,application/problem+json}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-aquila_bank}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-0}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-4}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-3000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-3000}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-1000}
      DB_QUERY_TIMEOUT_SECONDS: ${DB_QUERY_TIMEOUT_SECONDS:-3}
      DB_TRANSACTION_TIMEOUT_SECONDS: ${DB_TRANSACTION_TIMEOUT_SECONDS:-5}
      SERVER_THREADS_MAX: ${SERVER_THREADS_MAX:-16}
      OUTBOX_KAFKA_ENABLED: ${OUTBOX_KAFKA_ENABLED:-false}
      OUTBOX_KAFKA_BOOTSTRAP_SERVERS: ${OUTBOX_KAFKA_BOOTSTRAP_SERVERS:-}
      OUTBOX_KAFKA_TOPIC_DEFAULT: ${OUTBOX_KAFKA_TOPIC_DEFAULT:-}
      OUTBOX_KAFKA_TOPIC_TRANSFER_BOOKED: ${OUTBOX_KAFKA_TOPIC_TRANSFER_BOOKED:-}
      OUTBOX_KAFKA_TOPIC_TRANSFER_REVERSED: ${OUTBOX_KAFKA_TOPIC_TRANSFER_REVERSED:-}
      OUTBOX_OPS_ENABLED: ${OUTBOX_OPS_ENABLED:-false}
      OUTBOX_OPS_TOKEN: ${OUTBOX_OPS_TOKEN:-}
      SECURITY_INTERNAL_SERVICE_TOKEN_ISSUER: ${SECURITY_INTERNAL_SERVICE_TOKEN_ISSUER:-dev-internal-service}
      SECURITY_INTERNAL_SERVICE_TOKEN_AUDIENCE: ${SECURITY_INTERNAL_SERVICE_TOKEN_AUDIENCE:-aquila-internal-api}
      SECURITY_INTERNAL_SERVICE_TOKEN_ACTIVE_KEY_ID: ${SECURITY_INTERNAL_SERVICE_TOKEN_ACTIVE_KEY_ID:-ops-202604}
      SECURITY_INTERNAL_SERVICE_TOKEN_KEYS_OPS_202604: ${SECURITY_INTERNAL_SERVICE_TOKEN_KEYS_OPS_202604:-dev-internal-service-secret-ops-202604}
      NOTIFICATION_INBOX_CONSUMER_ENABLED: ${NOTIFICATION_INBOX_CONSUMER_ENABLED:-false}
      NOTIFICATION_INBOX_CONSUMER_BOOTSTRAP_SERVERS: ${NOTIFICATION_INBOX_CONSUMER_BOOTSTRAP_SERVERS:-}
      NOTIFICATION_INBOX_CONSUMER_CONCURRENCY: ${NOTIFICATION_INBOX_CONSUMER_CONCURRENCY:-1}
      NOTIFICATION_INBOX_CONSUMER_TRANSFER_BOOKED_TOPIC: ${NOTIFICATION_INBOX_CONSUMER_TRANSFER_BOOKED_TOPIC:-}
      NOTIFICATION_INBOX_CONSUMER_TRANSFER_REVERSED_TOPIC: ${NOTIFICATION_INBOX_CONSUMER_TRANSFER_REVERSED_TOPIC:-}
      NOTIFICATION_INBOX_CONSUMER_DLQ_TOPIC: ${NOTIFICATION_INBOX_CONSUMER_DLQ_TOPIC:-}
      NOTIFICATION_INBOX_CONSUMER_OPS_ENABLED: ${NOTIFICATION_INBOX_CONSUMER_OPS_ENABLED:-false}
      NOTIFICATION_CHANNEL_PROVIDER_OPS_ENABLED: ${NOTIFICATION_CHANNEL_PROVIDER_OPS_ENABLED:-false}
      KAFKA_TOPIC_PROVISIONING_ENABLED: ${KAFKA_TOPIC_PROVISIONING_ENABLED:-false}
      KAFKA_TOPIC_STARTUP_VALIDATION_ENABLED: ${KAFKA_TOPIC_STARTUP_VALIDATION_ENABLED:-false}
      KAFKA_TOPIC_PROVISIONING_PARTITIONS: ${KAFKA_TOPIC_PROVISIONING_PARTITIONS:-1}
      KAFKA_TOPIC_PROVISIONING_REPLICATION_FACTOR: ${KAFKA_TOPIC_PROVISIONING_REPLICATION_FACTOR:-1}
      KAFKA_TOPIC_PROVISIONING_MIN_IN_SYNC_REPLICAS: ${KAFKA_TOPIC_PROVISIONING_MIN_IN_SYNC_REPLICAS:-1}
      SECURITY_BOOTSTRAP_HEADER_AUTH_ENABLED: ${SECURITY_BOOTSTRAP_HEADER_AUTH_ENABLED:-true}
      SECURITY_BOOTSTRAP_ACCOUNT_ID_HEADER: ${SECURITY_BOOTSTRAP_ACCOUNT_ID_HEADER:-X-Account-Id}
      SECURITY_BOOTSTRAP_SUBJECT_HEADER: ${SECURITY_BOOTSTRAP_SUBJECT_HEADER:-X-Subject}
      OPS_API_ADMISSION_CONTROL_ENABLED: ${OPS_API_ADMISSION_CONTROL_ENABLED:-true}
      OPS_API_ADMISSION_CONTROL_TRANSACTION_READ_MAX: ${OPS_API_ADMISSION_CONTROL_TRANSACTION_READ_MAX:-3}
      OPS_T3MICRO_SATURATION_GUARD_ENABLED: ${OPS_T3MICRO_SATURATION_GUARD_ENABLED:-true}
      TRANSACTION_READ_REPLICA_ENABLED: ${TRANSACTION_READ_REPLICA_ENABLED:-false}
      TRANSACTION_READ_REPLICA_URL: ${TRANSACTION_READ_REPLICA_URL:-}
      TRANSACTION_READ_REPLICA_USERNAME: ${TRANSACTION_READ_REPLICA_USERNAME:-}
      TRANSACTION_READ_REPLICA_PASSWORD: ${TRANSACTION_READ_REPLICA_PASSWORD:-}
      TRANSACTION_READ_REPLICA_POOL_MIN_IDLE: ${TRANSACTION_READ_REPLICA_POOL_MIN_IDLE:-0}
      TRANSACTION_READ_REPLICA_POOL_MAX_SIZE: ${TRANSACTION_READ_REPLICA_POOL_MAX_SIZE:-2}
      TRANSACTION_READ_REPLICA_LAG_THRESHOLD_MS: ${TRANSACTION_READ_REPLICA_LAG_THRESHOLD_MS:-3000}
      NOTIFICATION_SSE_MAX_TOTAL_SESSIONS: ${NOTIFICATION_SSE_MAX_TOTAL_SESSIONS:-64}
      JAVA_TOOL_OPTIONS: ${LOADTEST_BACKEND_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=40}
    volumes:
      - ./back/build/libs:/app:ro
    command: ["sh", "-c", "java -jar /app/aquila-bank-0.0.1-SNAPSHOT.jar"]
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ${LOADTEST_PROMETHEUS_CONTAINER_NAME:-aquila-bank-prometheus-loadtest}
    profiles:
      - loadtest
    restart: unless-stopped
    cpus: "${LOADTEST_PROMETHEUS_CPUS:-0.25}"
    mem_limit: "${LOADTEST_PROMETHEUS_MEMORY:-256m}"
    memswap_limit: "${LOADTEST_PROMETHEUS_MEMORY_SWAP:-256m}"
    pids_limit: ${LOADTEST_PROMETHEUS_PIDS_LIMIT:-128}
    ports:
      - "${LOADTEST_PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./ops/prometheus/prometheus.local-loadtest.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/rules/aquila-bank-alerts.yml:/etc/prometheus/rules/aquila-bank-alerts.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-6h}"
    depends_on:
      aquila-bank-backend:
        condition: service_started
      postgres-exporter:
        condition: service_started

  grafana:
    image: grafana/grafana:11.3.0
    container_name: ${LOADTEST_GRAFANA_CONTAINER_NAME:-aquila-bank-grafana-loadtest}
    profiles:
      - loadtest
    restart: unless-stopped
    cpus: "${LOADTEST_GRAFANA_CPUS:-0.20}"
    mem_limit: "${LOADTEST_GRAFANA_MEMORY:-256m}"
    memswap_limit: "${LOADTEST_GRAFANA_MEMORY_SWAP:-256m}"
    pids_limit: ${LOADTEST_GRAFANA_PIDS_LIMIT:-128}
    ports:
      - "${LOADTEST_GRAFANA_PORT:-13001}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./ops/prometheus/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/prometheus/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./ops/prometheus/grafana:/var/lib/grafana/dashboards/aquila-bank:ro
    depends_on:
      prometheus:
        condition: service_started

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ${LOADTEST_ALERTMANAGER_CONTAINER_NAME:-aquila-bank-alertmanager-loadtest}
    profiles:
      - loadtest
    restart: unless-stopped
    cpus: "${LOADTEST_ALERTMANAGER_CPUS:-0.10}"
    mem_limit: "${LOADTEST_ALERTMANAGER_MEMORY:-128m}"
    memswap_limit: "${LOADTEST_ALERTMANAGER_MEMORY_SWAP:-128m}"
    pids_limit: ${LOADTEST_ALERTMANAGER_PIDS_LIMIT:-64}
    ports:
      - "${LOADTEST_ALERTMANAGER_PORT:-19093}:9093"
    volumes:
      - ./ops/prometheus/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: ${LOADTEST_POSTGRES_EXPORTER_CONTAINER_NAME:-aquila-bank-postgres-exporter-loadtest}
    profiles:
      - loadtest
    restart: unless-stopped
    cpus: "${LOADTEST_POSTGRES_EXPORTER_CPUS:-0.10}"
    mem_limit: "${LOADTEST_POSTGRES_EXPORTER_MEMORY:-128m}"
    memswap_limit: "${LOADTEST_POSTGRES_EXPORTER_MEMORY_SWAP:-128m}"
    pids_limit: ${LOADTEST_POSTGRES_EXPORTER_PIDS_LIMIT:-64}
    ports:
      - "${LOADTEST_POSTGRES_EXPORTER_PORT:-19187}:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-aquila_bank}?sslmode=disable"
    command:
      - "--no-collector.stat_bgwriter"
    depends_on:
      postgres:
        condition: service_healthy

  k6-transaction-read-100m:
    image: grafana/k6:0.54.0
    container_name: ${LOADTEST_K6_CONTAINER_NAME:-aquila-bank-k6-transaction-100m-loadtest}
    profiles:
      - loadtest
    environment:
      BASE_URL: ${K6_BASE_URL:-http://aquila-bank-backend:8080}
      K6_PROMETHEUS_RW_SERVER_URL: ${K6_PROMETHEUS_RW_SERVER_URL:-http://prometheus:9090/api/v1/write}
      K6_PROMETHEUS_RW_TREND_STATS: "p(50),p(90),p(95),p(99),p(99.9),min,max,avg"
      K6_REPORT_NAME: ${K6_REPORT_NAME:-transaction-100m}
      K6_HOT_ACCOUNT_ID: ${K6_HOT_ACCOUNT_ID:-}
      K6_HOT_FROM: ${K6_HOT_FROM:-}
      K6_HOT_TO: ${K6_HOT_TO:-}
      K6_COLD_ACCOUNT_ID: ${K6_COLD_ACCOUNT_ID:-}
      K6_COLD_FROM: ${K6_COLD_FROM:-}
      K6_COLD_TO: ${K6_COLD_TO:-}
      K6_AUTH_TOKEN: ${K6_AUTH_TOKEN:-}
      K6_LIMIT: ${K6_LIMIT:-50}
      AQUILA_K6_VUS: ${K6_VUS:-8}
      AQUILA_K6_DURATION: ${K6_DURATION:-1m}
      AQUILA_K6_SCENARIO_MODE: ${K6_SCENARIO_MODE:-constant-vus}
      AQUILA_K6_RATE: ${K6_RATE:-8}
      AQUILA_K6_TIME_UNIT: ${K6_TIME_UNIT:-1s}
      AQUILA_K6_PRE_ALLOCATED_VUS: ${K6_PRE_ALLOCATED_VUS:-${K6_VUS:-8}}
      AQUILA_K6_MAX_VUS: ${K6_MAX_VUS:-${K6_PRE_ALLOCATED_VUS:-${K6_VUS:-8}}}
      AQUILA_K6_BURST_RATE: ${K6_BURST_RATE:-16}
      AQUILA_K6_BURST_DURATION: ${K6_BURST_DURATION:-20s}
      K6_HOT_P95_THRESHOLD_MS: ${K6_HOT_P95_THRESHOLD_MS:-350}
      K6_COLD_P95_THRESHOLD_MS: ${K6_COLD_P95_THRESHOLD_MS:-750}
      K6_HOT_P99_THRESHOLD_MS: ${K6_HOT_P99_THRESHOLD_MS:-750}
      K6_COLD_P99_THRESHOLD_MS: ${K6_COLD_P99_THRESHOLD_MS:-1500}
      K6_HOT_MAX_THRESHOLD_MS: ${K6_HOT_MAX_THRESHOLD_MS:-3000}
      K6_COLD_MAX_THRESHOLD_MS: ${K6_COLD_MAX_THRESHOLD_MS:-5000}
      K6_HTTP_FAILED_RATE: ${K6_HTTP_FAILED_RATE:-0.01}
      K6_OVERLOAD_503_RATE_THRESHOLD: ${K6_OVERLOAD_503_RATE_THRESHOLD:-0}
    volumes:
      - ./ops/k6:/scripts:ro
      - ./build/reports/k6:/reports
    command:
      - "run"
      - "--out"
      - "experimental-prometheus-rw"
      - "/scripts/transaction-read-100m.js"
    depends_on:
      prometheus:
        condition: service_started
      aquila-bank-backend:
        condition: service_started

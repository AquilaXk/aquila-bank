name: "✨ Feature Request"
description: "신규 기능이나 도메인/UI 개선 작업을 등록합니다."
title: "[Feat] "
labels: ["feature"]
body:
  - type: textarea
    id: summary
    attributes:
      label: "배경 및 목표 요약"
      description: "해결하려는 사용자/운영 문제와 달성 목표를 요약합니다."
      placeholder: |
        - 추진 배경:
        - 핵심 목표:
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: "변경 범위 및 설계 방향"
      description: "대상 도메인(Backend/Frontend/Infra)과 핵심 설계 방향을 정리합니다. 상위 Epic 및 Sub-issue 계층을 연결하고, 연관 작업은 하나의 수직 슬라이스 PR로 묶습니다."
      placeholder: |
        - 상위 Epic / Sub-issue:
        - 변경 범위 (포함 / 제외):
        - 설계 및 계약 방향:
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "인수 기준 및 결정론적 검증 게이트"
      description: "구현 완료 조건과 통과해야 할 결정론적 검증 명령어를 체크리스트로 작성합니다."
      placeholder: |
        - [ ] 핵심 기능 및 도메인 불변식 검증 완료
        - [ ] ./back/gradlew -p back check (또는 yarn --cwd front lint && yarn --cwd front test:api-parity && yarn --cwd front test:ui-contract && yarn --cwd front build) 통과
    validations:
      required: true

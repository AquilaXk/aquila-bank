name: "🔧 Task"
description: "리팩터링, 문서, 테스트, 운영, 빌드 작업을 등록합니다."
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🔧 Task Intake
        - 선언형 말투로 작성했다.
        - 완료 조건과 실제 작업 항목을 같이 적었다.

  - type: dropdown
    id: task_type
    attributes:
      label: "🏷️ Task Type"
      options:
        - Refactor
        - Docs
        - Test
        - Build / CI
        - Ops
        - Security
        - Chore
    validations:
      required: true

  - type: input
    id: domain
    attributes:
      label: "🧩 Domain"
      description: 관련 모듈이나 영역을 적었다.
      placeholder: 예) back/auth, front/dashboard, github-actions
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: "📝 Description"
      description: 어떤 작업인지, 왜 필요한지 적었다.
      placeholder: 예) 거래 조회 서비스 책임을 분리해 유지보수성을 높였다.
    validations:
      required: true

  - type: textarea
    id: done_when
    attributes:
      label: "✅ Done When"
      description: 완료 조건을 선언형 체크리스트로 적었다.
      placeholder: |
        - [ ] 조건 A를 반영했다
        - [ ] 조건 B를 검증했다
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: "🛠 Todo"
      description: 실제 작업 항목을 선언형 체크리스트로 적었다.
      placeholder: |
        - [ ] 대상을 파악했다
        - [ ] 변경을 적용했다
        - [ ] 테스트 / 검증했다
        - [ ] 문서를 반영했다
    validations:
      required: true

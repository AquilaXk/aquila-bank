name: "🔧 Task & Maintenance"
description: "리팩터링, 문서 동기화, 테스트 보강, CI/운영 정리 작업을 등록합니다."
title: "[Chore] "
labels: ["task"]
body:
  - type: textarea
    id: summary
    attributes:
      label: "배경 및 목표 요약"
      description: "작업이 필요한 배경과 해결하려는 유지보수 목표를 요약합니다."
      placeholder: |
        - 배경 및 목적:
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: "변경 범위 및 설계 방향"
      description: "대상 모듈/경로와 변경 범위를 정리합니다. 상위 Epic/Sub-issue 연결 여부를 적고, 경미한 변경은 연관 작업군과 하나의 배치 PR로 묶습니다."
      placeholder: |
        - 상위 Epic / Sub-issue:
        - 대상 모듈 및 변경 범위:
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "인수 기준 및 결정론적 검증 게이트"
      description: "완료 조건과 실행할 정적 분석/테스트/빌드 검증 명령어를 체크리스트로 작성합니다."
      placeholder: |
        - [ ] 대상 변경 적용 및 사이드이펙트 점검 완료
        - [ ] 관련 린트/테스트/빌드 검증 게이트 통과
    validations:
      required: true

name: "🐞 Bug Report"
description: "버그, 장애, 정합성 회귀 이슈를 등록합니다."
title: "[Fix] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: "배경 및 문제 요약"
      description: "발생한 문제 현상, 재현 경로, 기대 결과와 실제 결과의 차이를 요약합니다."
      placeholder: |
        - 현상 및 재현 경로:
        - 기대 결과 / 실제 결과:
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: "변경 범위 및 설계 방향"
      description: "영향받는 도메인/파일 경로와 수정 방향을 정리합니다. 상위 Epic이나 연관 Sub-issue가 있으면 함께 연결하고, 연관된 수정은 하나의 수직 슬라이스 PR로 묶어 처리합니다."
      placeholder: |
        - 상위 Epic / Sub-issue:
        - 대상 도메인 및 경로:
        - 수정 방향:
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "인수 기준 및 결정론적 검증 게이트"
      description: "수정 완료 조건과 실행할 검증 명령어를 체크리스트로 작성합니다."
      placeholder: |
        - [ ] 실패 재현 테스트 작성 및 수정 후 통과 확인
        - [ ] ./back/gradlew -p back check (또는 yarn --cwd front lint && yarn --cwd front build) 통과
    validations:
      required: true

name: "🐞 Bug"
description: "버그, 장애, 회귀 이슈를 등록합니다."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🐞 Bug Intake
        - 재현 결과와 영향 범위를 함께 적는다.
        - 비해당 항목은 `없음`으로 적는다.

  - type: dropdown
    id: severity
    attributes:
      label: "🚨 Severity"
      description: 영향도를 선택한다.
      options:
        - Sev 1 - 거래 불가 / 서비스 중단
        - Sev 2 - 핵심 기능 저하
        - Sev 3 - 우회 가능한 문제
        - Sev 4 - 경미한 문제
    validations:
      required: true

  - type: input
    id: domain
    attributes:
      label: "🧩 Domain"
      description: 문제가 발생한 기능/도메인을 적는다.
      placeholder: 예) auth, transaction, notification, admin
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: "📝 Summary"
      description: 문제를 한 줄로 요약한다.
      placeholder: 예) 거래 상세 조회 시 동일 거래가 중복 노출된다.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "🔁 Steps To Reproduce"
      description: 재현 순서를 적는다.
      placeholder: |
        1. ...
        2. ...
        3. 문제가 재현된다
    validations:
      required: true

  - type: textarea
    id: expected_actual
    attributes:
      label: "⚖️ Expected Result / Actual Result"
      description: 기대 결과와 실제 결과를 함께 적는다.
      placeholder: |
        - Expected: 기대한 결과를 적는다
        - Actual: 실제 결과를 적는다
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: "📉 Impact"
      description: 고객, 운영, 데이터 정합성 영향 범위를 적는다.
      placeholder: 예) 고객 문의가 증가하고, 거래 정합성 영향은 없고, 운영 모니터링 경고가 발생한다.
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: "🛠 Todo"
      description: 필요한 작업을 체크리스트로 적는다.
      placeholder: |
        - [ ] 재현했는가?
        - [ ] 원인을 분석했는가?
        - [ ] 수정했는가?
        - [ ] 테스트했는가?
        - [ ] 운영 영향을 확인했는가?
    validations:
      required: true

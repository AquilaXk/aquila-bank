name: "⚡ Performance"
description: "대량 조회, 실시간 알림, 병목 개선 작업을 등록합니다."
labels: ["performance"]
body:
  - type: input
    id: target
    attributes:
      label: Target
      description: 개선 대상 API, 배치, 이벤트 경로를 적어주세요.
      placeholder: 예) GET /api/v1/transactions
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: Scenario
      description: 트래픽, 데이터 규모, 사용 시나리오를 적어주세요.
      placeholder: 예) 계좌당 1억 건 거래 중 최근 3개월 데이터를 필터링 조회
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current Metric
      description: 현재 성능 지표를 적어주세요.
      placeholder: 예) p95 4.8s, timeout rate 2%, DB CPU 80%
    validations:
      required: true

  - type: textarea
    id: target_metric
    attributes:
      label: Target Metric
      description: 목표 성능 기준을 적어주세요.
      placeholder: 예) p95 800ms 이하, timeout rate 0.1% 이하
    validations:
      required: true

  - type: textarea
    id: hypothesis
    attributes:
      label: Bottleneck / Hypothesis
      description: 병목 원인 추정이나 확인해야 할 포인트를 적어주세요.
      placeholder: 예) 인덱스 미활용, 커서 설계 부족, 알림 consumer 지연

  - type: textarea
    id: validation
    attributes:
      label: Validation Plan
      description: 개선 후 어떻게 검증할지 적어주세요.
      placeholder: |
        - [ ] 부하 테스트
        - [ ] 대시보드 비교
        - [ ] 샘플 데이터 리허설
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: Todo
      description: 작업 항목을 체크리스트로 적어주세요.
      placeholder: |
        - [ ] 병목 재현
        - [ ] 프로파일링
        - [ ] 개선 적용
        - [ ] 성능 재측정
        - [ ] 롤백 기준 정리
    validations:
      required: true

name: "⚡ Performance"
description: "대량 조회, 실시간 알림, 병목 개선 작업을 등록합니다."
labels: ["performance"]
body:
  - type: markdown
    attributes:
      value: |
        ## ⚡ Performance Intake
        - 병목과 목표를 선언형으로 적었다.
        - 측정값과 검증 계획을 같이 적었다.

  - type: input
    id: target
    attributes:
      label: "🎯 Target"
      description: 개선 대상 API, 배치, 이벤트 경로를 적었다.
      placeholder: 예) GET /api/v1/transactions
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: "🧪 Scenario"
      description: 트래픽, 데이터 규모, 사용 시나리오를 적었다.
      placeholder: 예) 계좌당 1억 건 거래 중 최근 3개월 데이터를 필터링 조회했다.
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: "📉 Current Metric"
      description: 현재 성능 지표를 적었다.
      placeholder: 예) p95 4.8s, timeout rate 2%, DB CPU 80%
    validations:
      required: true

  - type: textarea
    id: target_metric
    attributes:
      label: "📈 Target Metric"
      description: 목표 성능 기준을 적었다.
      placeholder: 예) p95 800ms 이하, timeout rate 0.1% 이하
    validations:
      required: true

  - type: textarea
    id: hypothesis
    attributes:
      label: "🔍 Bottleneck / Hypothesis"
      description: 병목 원인 추정이나 확인 포인트를 적었다.
      placeholder: 예) 인덱스 미활용, 커서 설계 부족, 알림 consumer 지연을 의심했다.

  - type: textarea
    id: validation
    attributes:
      label: "✅ Validation Plan"
      description: 개선 후 검증 계획을 적었다.
      placeholder: |
        - [ ] 부하 테스트를 수행했다
        - [ ] 대시보드를 비교했다
        - [ ] 샘플 데이터로 리허설했다
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: "🛠 Todo"
      description: 작업 항목을 선언형 체크리스트로 적었다.
      placeholder: |
        - [ ] 병목을 재현했다
        - [ ] 프로파일링했다
        - [ ] 개선을 적용했다
        - [ ] 성능을 재측정했다
        - [ ] 롤백 기준을 정리했다
    validations:
      required: true

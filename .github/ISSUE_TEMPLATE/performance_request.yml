name: "⚡ Performance & Capacity"
description: "대량 조회, 알림 처리량, 쿼리 플랜, 인프라 예산 내 병목 개선 작업을 등록합니다."
title: "[Perf] "
labels: ["performance"]
body:
  - type: textarea
    id: summary
    attributes:
      label: "배경 및 병목 요약"
      description: "대상 API/쿼리 경로, 데이터 규모(예: 1억 건 거래 조회), 현재 측정 수치와 목표 지표를 요약합니다."
      placeholder: |
        - 대상 경로 및 시나리오:
        - 현재 측정 지표 / 목표 지표:
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: "변경 범위 및 설계 방향"
      description: "병목 원인과 개선 범위(인덱스, Keyset 커서, 커넥션 풀, Admission Control 등)를 정리합니다. 상위 Epic/Sub-issue 연결 및 수직 슬라이스 PR 묶음 기준을 함께 명시합니다."
      placeholder: |
        - 상위 Epic / Sub-issue:
        - 병목 가설 및 변경 범위:
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "인수 기준 및 결정론적 검증 게이트"
      description: "쿼리 플랜 회귀 게이트, 부하 테스트, 실측 아티팩트 확인 등 완료 조건을 체크리스트로 작성합니다."
      placeholder: |
        - [ ] bash tools/test/check-transaction-query-plan-regression-gate.sh 통과
        - [ ] OCI A1 또는 프로덕션 준하는 환경의 실측 아티팩트 및 지표 비교 완료
    validations:
      required: true

name: off-host 100m capacity prerequisite

on:
  workflow_dispatch:
    inputs:
      docker_context:
        description: "Remote Docker context name for off-host k6"
        required: false
        type: string
      remote_base_url:
        description: "Backend URL reachable from off-host k6"
        required: false
        type: string
      remote_prometheus_rw_url:
        description: "Prometheus remote-write URL reachable from off-host k6"
        required: false
        type: string
      remote_workdir:
        description: "Repository path on remote Docker context host"
        required: false
        type: string
      host_metrics_tsv:
        description: "Combined host CPU/network TSV evidence ref"
        required: false
        type: string
      host_metrics_timeline_tsv:
        description: "Load-coupled generator/target host CPU/network timeline TSV evidence ref"
        required: false
        type: string
      require_load_coupled_timeline:
        description: "Require load-coupled host metrics timeline instead of fallback snapshot"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      vu16_summary_json:
        description: "VU16 saturation summary JSON evidence ref"
        required: false
        type: string
      burst_matrix_tsv:
        description: "Burst 32/48/64/80/96 matrix TSV evidence ref"
        required: false
        type: string
      source_evidence_tsv:
        description: "Source-level 429/latency/5xx TSV evidence ref"
        required: false
        type: string
      host_metrics_run_id:
        description: "Run id used inside generator/target host metrics TSV"
        required: false
        type: string
      generator_host_metrics_tsv:
        description: "Generator host CPU/network TSV evidence ref"
        required: false
        type: string
      target_host_metrics_tsv:
        description: "Target app/DB host CPU/network TSV evidence ref"
        required: false
        type: string
  pull_request:
    paths:
      - ".github/workflows/offhost-100m-capacity-prerequisite.yml"
      - "tools/test/run-transaction-100m-capacity-gates.sh"
      - "tools/test/run-offhost-capacity-env-doctor.sh"
      - "tools/test/check-offhost-capacity-env-doctor.sh"
      - "tools/test/offhost-capacity.env.example"
      - "tools/test/check-offhost-capacity-prerequisite-required-gate.sh"
      - "tools/test/run-oci-offhost-host-metrics-evidence.sh"
      - "tools/test/check-oci-offhost-host-metrics-evidence.sh"
      - "tools/test/run-oci-offhost-host-metrics-timeline.sh"
      - "tools/test/check-oci-offhost-host-metrics-timeline.sh"
      - "tools/test/run-oci-offhost-host-metrics-load-coupled-timeline.sh"
      - "tools/test/check-oci-offhost-host-metrics-load-coupled-timeline.sh"
      - "tools/test/run-oci-offhost-host-metrics-timeline-fallback.sh"
      - "tools/test/check-oci-offhost-host-metrics-timeline-fallback.sh"
      - "tools/test/run-oci-offhost-host-metrics-snapshot.sh"
      - "tools/test/check-oci-offhost-host-metrics-snapshot.sh"
      - "tools/test/run-transaction-100m-offhost-capacity-baseline-report.sh"
      - "tools/test/run-t3micro-defensive-gates-aggregate-report.sh"

permissions:
  contents: read

jobs:
  contract:
    name: off-host capacity prerequisite contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate workflow contract
        run: tools/test/check-offhost-capacity-prerequisite-required-gate.sh

      - name: Check off-host host metrics timeline
        run: tools/test/check-oci-offhost-host-metrics-timeline.sh

      - name: Check off-host host metrics load-coupled timeline
        run: tools/test/check-oci-offhost-host-metrics-load-coupled-timeline.sh

      - name: Check off-host host metrics timeline fallback
        run: tools/test/check-oci-offhost-host-metrics-timeline-fallback.sh

  prerequisite:
    name: required off-host capacity env
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, oci-a1-staging]
    timeout-minutes: 120
    environment:
      name: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Load off-host capacity env
        env:
          OCI_A1_STAGING_ENV: ${{ secrets.OCI_A1_STAGING_ENV }}
          DOCKER_CONTEXT_INPUT: ${{ inputs.docker_context }}
          REMOTE_BASE_URL_INPUT: ${{ inputs.remote_base_url }}
          REMOTE_PROMETHEUS_RW_URL_INPUT: ${{ inputs.remote_prometheus_rw_url }}
          REMOTE_WORKDIR_INPUT: ${{ inputs.remote_workdir }}
          HOST_METRICS_TSV_INPUT: ${{ inputs.host_metrics_tsv }}
          HOST_METRICS_TIMELINE_TSV_INPUT: ${{ inputs.host_metrics_timeline_tsv }}
          REQUIRE_LOAD_COUPLED_TIMELINE_INPUT: ${{ inputs.require_load_coupled_timeline }}
          VU16_SUMMARY_JSON_INPUT: ${{ inputs.vu16_summary_json }}
          BURST_MATRIX_TSV_INPUT: ${{ inputs.burst_matrix_tsv }}
          SOURCE_EVIDENCE_TSV_INPUT: ${{ inputs.source_evidence_tsv }}
          HOST_METRICS_RUN_ID_INPUT: ${{ inputs.host_metrics_run_id }}
          GENERATOR_HOST_METRICS_TSV_INPUT: ${{ inputs.generator_host_metrics_tsv }}
          TARGET_HOST_METRICS_TSV_INPUT: ${{ inputs.target_host_metrics_tsv }}
          CAPACITY_K6_DOCKER_CONTEXT_VAR: ${{ vars.CAPACITY_K6_DOCKER_CONTEXT }}
          CAPACITY_K6_REMOTE_BASE_URL_VAR: ${{ vars.CAPACITY_K6_REMOTE_BASE_URL }}
          CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL_VAR: ${{ vars.CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL }}
          CAPACITY_K6_REMOTE_WORKDIR_VAR: ${{ vars.CAPACITY_K6_REMOTE_WORKDIR }}
          CAPACITY_K6_HOST_METRICS_TSV_VAR: ${{ vars.CAPACITY_K6_HOST_METRICS_TSV }}
          CAPACITY_K6_HOST_METRICS_TIMELINE_TSV_VAR: ${{ vars.CAPACITY_K6_HOST_METRICS_TIMELINE_TSV }}
          CAPACITY_K6_VU16_SUMMARY_JSON_VAR: ${{ vars.CAPACITY_K6_VU16_SUMMARY_JSON }}
          CAPACITY_K6_BURST_MATRIX_TSV_VAR: ${{ vars.CAPACITY_K6_BURST_MATRIX_TSV }}
          CAPACITY_K6_SOURCE_EVIDENCE_TSV_VAR: ${{ vars.CAPACITY_K6_SOURCE_EVIDENCE_TSV }}
          CAPACITY_K6_GENERATOR_HOST_METRICS_TSV_VAR: ${{ vars.CAPACITY_K6_GENERATOR_HOST_METRICS_TSV }}
          CAPACITY_K6_TARGET_HOST_METRICS_TSV_VAR: ${{ vars.CAPACITY_K6_TARGET_HOST_METRICS_TSV }}
        shell: bash
        run: |
          set -euo pipefail
          report_dir="build/reports/k6/ci-offhost-100m-capacity-prerequisite"
          mkdir -p "${report_dir}"

          if [[ -n "${OCI_A1_STAGING_ENV}" ]]; then
            staging_env_path="${RUNNER_TEMP}/oci-a1-staging-offhost-capacity.env"
            printf '%s\n' "${OCI_A1_STAGING_ENV}" >"${staging_env_path}"
            chmod 600 "${staging_env_path}"

            set -a
            # off-host capacity도 staging-deploy와 같은 unified staging secret contract를 사용한다.
            source "${staging_env_path}"
            set +a
          fi

          CAPACITY_NAME="ci-offhost-100m-capacity-prerequisite"
          CAPACITY_K6_GENERATOR_MODE="docker-context"
          CAPACITY_REMOTE_PREFLIGHT="true"
          CAPACITY_REMOTE_PROMETHEUS_RW_REQUIRED="false"
          CAPACITY_REQUIRE_HOST_METRICS="true"
          CAPACITY_PREREQUISITE_FAILURE_REPORT_PATH="${report_dir}/capacity-prerequisite-failure.env"
          DEFAULT_CAPACITY_K6_DOCKER_CONTEXT="default"
          DEFAULT_CAPACITY_K6_REMOTE_BASE_URL="${STAGING_BASE_URL:-}"
          DEFAULT_CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL="http://172.17.0.2:9090/api/v1/write"
          CAPACITY_K6_REMOTE_WORKDIR_ENV="${CAPACITY_K6_REMOTE_WORKDIR:-}"
          CAPACITY_K6_DOCKER_CONTEXT="${DOCKER_CONTEXT_INPUT:-${CAPACITY_K6_DOCKER_CONTEXT_VAR:-${DEFAULT_CAPACITY_K6_DOCKER_CONTEXT}}}"
          CAPACITY_K6_REMOTE_BASE_URL="${REMOTE_BASE_URL_INPUT:-${CAPACITY_K6_REMOTE_BASE_URL:-${CAPACITY_K6_REMOTE_BASE_URL_VAR:-${DEFAULT_CAPACITY_K6_REMOTE_BASE_URL}}}}"
          CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL="${REMOTE_PROMETHEUS_RW_URL_INPUT:-${CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL:-${CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL_VAR:-${DEFAULT_CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL}}}}"
          CAPACITY_K6_REMOTE_WORKDIR="${REMOTE_WORKDIR_INPUT:-${CAPACITY_K6_REMOTE_WORKDIR_VAR:-}}"
          if [[ -z "${CAPACITY_K6_REMOTE_WORKDIR}" ]]; then
            if [[ "${CAPACITY_K6_DOCKER_CONTEXT}" == "default" ]]; then
              CAPACITY_K6_REMOTE_WORKDIR="${GITHUB_WORKSPACE}"
            else
              CAPACITY_K6_REMOTE_WORKDIR="${CAPACITY_K6_REMOTE_WORKDIR_ENV:-${GITHUB_WORKSPACE}}"
            fi
          fi
          CAPACITY_K6_HOST_METRICS_TSV="${HOST_METRICS_TSV_INPUT:-${CAPACITY_K6_HOST_METRICS_TSV:-${CAPACITY_K6_HOST_METRICS_TSV_VAR:-}}}"
          CAPACITY_K6_HOST_METRICS_TIMELINE_TSV="${HOST_METRICS_TIMELINE_TSV_INPUT:-${CAPACITY_K6_HOST_METRICS_TIMELINE_TSV:-${CAPACITY_K6_HOST_METRICS_TIMELINE_TSV_VAR:-}}}"
          CAPACITY_REQUIRE_LOAD_COUPLED_TIMELINE="${REQUIRE_LOAD_COUPLED_TIMELINE_INPUT:-${CAPACITY_REQUIRE_LOAD_COUPLED_TIMELINE:-true}}"
          CAPACITY_K6_VU16_SUMMARY_JSON="${VU16_SUMMARY_JSON_INPUT:-${CAPACITY_K6_VU16_SUMMARY_JSON:-${CAPACITY_K6_VU16_SUMMARY_JSON_VAR:-}}}"
          CAPACITY_K6_BURST_MATRIX_TSV="${BURST_MATRIX_TSV_INPUT:-${CAPACITY_K6_BURST_MATRIX_TSV:-${CAPACITY_K6_BURST_MATRIX_TSV_VAR:-}}}"
          CAPACITY_K6_SOURCE_EVIDENCE_TSV="${SOURCE_EVIDENCE_TSV_INPUT:-${CAPACITY_K6_SOURCE_EVIDENCE_TSV:-${CAPACITY_K6_SOURCE_EVIDENCE_TSV_VAR:-}}}"
          CAPACITY_K6_HOST_METRICS_RUN_ID="${HOST_METRICS_RUN_ID_INPUT:-${CAPACITY_K6_HOST_METRICS_RUN_ID:-${CAPACITY_NAME}}}"
          CAPACITY_K6_GENERATOR_HOST_METRICS_TSV="${GENERATOR_HOST_METRICS_TSV_INPUT:-${CAPACITY_K6_GENERATOR_HOST_METRICS_TSV:-${CAPACITY_K6_GENERATOR_HOST_METRICS_TSV_VAR:-${CAPACITY_K6_HOST_METRICS_TSV}}}}"
          CAPACITY_K6_TARGET_HOST_METRICS_TSV="${TARGET_HOST_METRICS_TSV_INPUT:-${CAPACITY_K6_TARGET_HOST_METRICS_TSV:-${CAPACITY_K6_TARGET_HOST_METRICS_TSV_VAR:-}}}"
          CAPACITY_K6_HOST_METRICS_TIMELINE_SAMPLE_INTERVAL_SECONDS="${CAPACITY_K6_HOST_METRICS_TIMELINE_SAMPLE_INTERVAL_SECONDS:-5}"
          CAPACITY_K6_TIMELINE_PHASE_DURATION="${CAPACITY_K6_TIMELINE_PHASE_DURATION:-1m}"
          CAPACITY_K6_TIMELINE_BURST_RATES="${CAPACITY_K6_TIMELINE_BURST_RATES:-32,48,64,80,96}"
          CAPACITY_K6_HOT_ACCOUNT_ID="${CAPACITY_K6_HOT_ACCOUNT_ID:-${K6_HOT_ACCOUNT_ID:-910000001}}"
          CAPACITY_K6_HOT_FROM="${CAPACITY_K6_HOT_FROM:-${K6_HOT_FROM:-2026-04-01T00:00:00Z}}"
          CAPACITY_K6_HOT_TO="${CAPACITY_K6_HOT_TO:-${K6_HOT_TO:-2026-04-30T00:00:00Z}}"
          CAPACITY_K6_COLD_ACCOUNT_ID="${CAPACITY_K6_COLD_ACCOUNT_ID:-${K6_COLD_ACCOUNT_ID:-910000002}}"
          CAPACITY_K6_COLD_FROM="${CAPACITY_K6_COLD_FROM:-${K6_COLD_FROM:-2026-01-01T00:00:00Z}}"
          CAPACITY_K6_COLD_TO="${CAPACITY_K6_COLD_TO:-${K6_COLD_TO:-2026-01-31T00:00:00Z}}"
          host_metrics_snapshot_dir="${report_dir}/offhost-host-metrics-snapshot"
          snapshot_generator_tsv="${host_metrics_snapshot_dir}/${CAPACITY_NAME}-generator-host-metrics.tsv"
          snapshot_target_tsv="${host_metrics_snapshot_dir}/${CAPACITY_NAME}-target-host-metrics.tsv"
          host_metrics_timeline_dir="${report_dir}/offhost-host-metrics-timeline"
          generated_timeline_tsv="${host_metrics_timeline_dir}/${CAPACITY_NAME}-host-metrics-timeline.tsv"
          if [[ -z "${CAPACITY_K6_GENERATOR_HOST_METRICS_TSV}" || -z "${CAPACITY_K6_TARGET_HOST_METRICS_TSV}" ]]; then
            mkdir -p "${host_metrics_snapshot_dir}"
            OCI_OFFHOST_HOST_METRICS_SNAPSHOT_NAME="${CAPACITY_NAME}" \
            OCI_OFFHOST_HOST_METRICS_RUN_ID="${CAPACITY_K6_HOST_METRICS_RUN_ID}" \
            OCI_OFFHOST_GENERATOR_DOCKER_CONTEXT="${CAPACITY_K6_DOCKER_CONTEXT}" \
            OCI_OFFHOST_TARGET_DOCKER_CONTEXT="target" \
            OCI_OFFHOST_HOST_METRICS_OUTPUT_DIR="${host_metrics_snapshot_dir}" \
              tools/test/run-oci-offhost-host-metrics-snapshot.sh >"${host_metrics_snapshot_dir}/host-metrics-snapshot.log" 2>&1
            if [[ -z "${CAPACITY_K6_GENERATOR_HOST_METRICS_TSV}" ]]; then
              CAPACITY_K6_GENERATOR_HOST_METRICS_TSV="${snapshot_generator_tsv}"
            fi
            if [[ -z "${CAPACITY_K6_TARGET_HOST_METRICS_TSV}" ]]; then
              CAPACITY_K6_TARGET_HOST_METRICS_TSV="${snapshot_target_tsv}"
            fi
          fi
          case "${CAPACITY_REQUIRE_LOAD_COUPLED_TIMELINE}" in
            true|false) ;;
            *)
              echo "::error::CAPACITY_REQUIRE_LOAD_COUPLED_TIMELINE must be true or false."
              exit 1
              ;;
          esac
          if [[ -z "${CAPACITY_K6_HOST_METRICS_TIMELINE_TSV}" && "${CAPACITY_REQUIRE_LOAD_COUPLED_TIMELINE}" == "true" ]]; then
            mkdir -p "${host_metrics_timeline_dir}"
            arrival16_command='
              arrival16_status=0
              K6_REPORT_NAME="${CAPACITY_NAME}-arrival16" \
              K6_RUN_ID="${CAPACITY_NAME}-arrival16" \
              K6_RUN_PURPOSE=capacity \
              K6_OBSERVABILITY_MODE=prometheus \
              K6_GENERATOR_MODE=docker-context \
              K6_DOCKER_CONTEXT="${CAPACITY_K6_DOCKER_CONTEXT}" \
              K6_REMOTE_BASE_URL="${CAPACITY_K6_REMOTE_BASE_URL}" \
              K6_REMOTE_PROMETHEUS_RW_SERVER_URL="${CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL}" \
              K6_REMOTE_PROMETHEUS_RW_REQUIRED=false \
              K6_REMOTE_WORKDIR="${CAPACITY_K6_REMOTE_WORKDIR}" \
              K6_REMOTE_PREFLIGHT=true \
              K6_AUTH_TOKEN_ENV_NAME=STAGING_REPLAY_TOKEN \
              K6_AUTH_TOKEN_REQUIRED=true \
              K6_AUTH_PREFLIGHT=true \
              K6_AUTH_PREFLIGHT_PATH="api/v1/transactions?accountId=${CAPACITY_K6_HOT_ACCOUNT_ID}&from=${CAPACITY_K6_HOT_FROM}&to=${CAPACITY_K6_HOT_TO}&limit=1" \
              K6_AUTH_PREFLIGHT_EXPECTED_STATUS=200 \
              K6_HOT_ACCOUNT_ID="${CAPACITY_K6_HOT_ACCOUNT_ID}" \
              K6_HOT_FROM="${CAPACITY_K6_HOT_FROM}" \
              K6_HOT_TO="${CAPACITY_K6_HOT_TO}" \
              K6_COLD_ACCOUNT_ID="${CAPACITY_K6_COLD_ACCOUNT_ID}" \
              K6_COLD_FROM="${CAPACITY_K6_COLD_FROM}" \
              K6_COLD_TO="${CAPACITY_K6_COLD_TO}" \
              K6_SCENARIO_MODE=constant-arrival-rate \
              K6_RATE=16 \
              K6_TIME_UNIT=1s \
              K6_VUS=8 \
              K6_PRE_ALLOCATED_VUS=16 \
              K6_MAX_VUS=32 \
              K6_DURATION="${CAPACITY_K6_TIMELINE_PHASE_DURATION}" \
              K6_ARCHIVE_RESULTS=false \
                tools/test/run-k6-transaction-100m-loadtest.sh --no-up --no-deps || arrival16_status="$?"
              arrival16_summary_dir="${OCI_OFFHOST_LOAD_COUPLED_OUTPUT_DIR}/arrival16"
              mkdir -p "${arrival16_summary_dir}"
              if [[ -s "build/reports/k6/${CAPACITY_NAME}-arrival16-summary.json" ]]; then
                cp "build/reports/k6/${CAPACITY_NAME}-arrival16-summary.json" "${arrival16_summary_dir}/${CAPACITY_NAME}-arrival16-summary.json"
              else
                echo "missing arrival16 k6 summary JSON" >&2
                arrival16_status=1
              fi
              if [[ -s "build/reports/k6/${CAPACITY_NAME}-arrival16-summary.md" ]]; then
                cp "build/reports/k6/${CAPACITY_NAME}-arrival16-summary.md" "${arrival16_summary_dir}/${CAPACITY_NAME}-arrival16-summary.md"
              else
                echo "missing arrival16 k6 summary markdown" >&2
                arrival16_status=1
              fi
              exit "${arrival16_status}"
            '
            # VU16 sampler는 promotion gate가 아니라 host timeline 수집용 observation phase다.
            vu16_command='
              vu16_status=0
              K6_REPORT_NAME="${CAPACITY_NAME}-vu16" \
              K6_RUN_ID="${CAPACITY_NAME}-vu16" \
              K6_RUN_PURPOSE=capacity \
              K6_OBSERVABILITY_MODE=prometheus \
              K6_GENERATOR_MODE=docker-context \
              K6_DOCKER_CONTEXT="${CAPACITY_K6_DOCKER_CONTEXT}" \
              K6_REMOTE_BASE_URL="${CAPACITY_K6_REMOTE_BASE_URL}" \
              K6_REMOTE_PROMETHEUS_RW_SERVER_URL="${CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL}" \
              K6_REMOTE_PROMETHEUS_RW_REQUIRED=false \
              K6_REMOTE_WORKDIR="${CAPACITY_K6_REMOTE_WORKDIR}" \
              K6_REMOTE_PREFLIGHT=true \
              K6_AUTH_TOKEN_ENV_NAME=STAGING_REPLAY_TOKEN \
              K6_AUTH_TOKEN_REQUIRED=true \
              K6_AUTH_PREFLIGHT=true \
              K6_AUTH_PREFLIGHT_PATH="api/v1/transactions?accountId=${CAPACITY_K6_HOT_ACCOUNT_ID}&from=${CAPACITY_K6_HOT_FROM}&to=${CAPACITY_K6_HOT_TO}&limit=1" \
              K6_AUTH_PREFLIGHT_EXPECTED_STATUS=200 \
              K6_HOT_ACCOUNT_ID="${CAPACITY_K6_HOT_ACCOUNT_ID}" \
              K6_HOT_FROM="${CAPACITY_K6_HOT_FROM}" \
              K6_HOT_TO="${CAPACITY_K6_HOT_TO}" \
              K6_COLD_ACCOUNT_ID="${CAPACITY_K6_COLD_ACCOUNT_ID}" \
              K6_COLD_FROM="${CAPACITY_K6_COLD_FROM}" \
              K6_COLD_TO="${CAPACITY_K6_COLD_TO}" \
              K6_SCENARIO_MODE=constant-vus \
              K6_VUS=16 \
              K6_PRE_ALLOCATED_VUS=16 \
              K6_MAX_VUS=16 \
              K6_DURATION="${CAPACITY_K6_TIMELINE_PHASE_DURATION}" \
              K6_OVERLOAD_MODE=true \
              K6_OVERLOAD_429_RATE_THRESHOLD=1 \
              K6_ARCHIVE_RESULTS=false \
                tools/test/run-k6-transaction-100m-loadtest.sh --no-up --no-deps || vu16_status="$?"
              vu16_summary_dir="${OCI_OFFHOST_LOAD_COUPLED_OUTPUT_DIR}/vu16"
              mkdir -p "${vu16_summary_dir}"
              if [[ -s "build/reports/k6/${CAPACITY_NAME}-vu16-summary.json" ]]; then
                cp "build/reports/k6/${CAPACITY_NAME}-vu16-summary.json" "${vu16_summary_dir}/${CAPACITY_NAME}-vu16-summary.json"
              else
                echo "missing VU16 k6 summary JSON" >&2
                vu16_status=1
              fi
              if [[ -s "build/reports/k6/${CAPACITY_NAME}-vu16-summary.md" ]]; then
                cp "build/reports/k6/${CAPACITY_NAME}-vu16-summary.md" "${vu16_summary_dir}/${CAPACITY_NAME}-vu16-summary.md"
              else
                echo "missing VU16 k6 summary markdown" >&2
                vu16_status=1
              fi
              exit "${vu16_status}"
            '
            burst_matrix_command='
              matrix_ref="${OCI_OFFHOST_LOAD_COUPLED_OUTPUT_DIR}/${CAPACITY_NAME}-burst-matrix-runs.tsv"
              burst_matrix_summary_dir="${OCI_OFFHOST_LOAD_COUPLED_OUTPUT_DIR}/burst-matrix"
              mkdir -p "${burst_matrix_summary_dir}"
              printf "burst_rate\tk6_run_id\tsummary_json\n" >"${matrix_ref}"
              IFS="," read -r -a burst_rates <<<"${CAPACITY_K6_TIMELINE_BURST_RATES}"
              status=0
              for burst_rate in "${burst_rates[@]}"; do
                burst_rate="${burst_rate//[[:space:]]/}"
                [[ -z "${burst_rate}" ]] && continue
                report_name="${CAPACITY_NAME}-burst${burst_rate}"
                K6_REPORT_NAME="${report_name}" \
                K6_RUN_ID="${report_name}" \
                K6_RUN_PURPOSE=capacity \
                K6_OBSERVABILITY_MODE=prometheus \
                K6_GENERATOR_MODE=docker-context \
                K6_DOCKER_CONTEXT="${CAPACITY_K6_DOCKER_CONTEXT}" \
                K6_REMOTE_BASE_URL="${CAPACITY_K6_REMOTE_BASE_URL}" \
                K6_REMOTE_PROMETHEUS_RW_SERVER_URL="${CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL}" \
                K6_REMOTE_PROMETHEUS_RW_REQUIRED=false \
                K6_REMOTE_WORKDIR="${CAPACITY_K6_REMOTE_WORKDIR}" \
                K6_REMOTE_PREFLIGHT=true \
                K6_AUTH_TOKEN_ENV_NAME=STAGING_REPLAY_TOKEN \
                K6_AUTH_TOKEN_REQUIRED=true \
                K6_AUTH_PREFLIGHT=true \
                K6_AUTH_PREFLIGHT_PATH="api/v1/transactions?accountId=${CAPACITY_K6_HOT_ACCOUNT_ID}&from=${CAPACITY_K6_HOT_FROM}&to=${CAPACITY_K6_HOT_TO}&limit=1" \
                K6_AUTH_PREFLIGHT_EXPECTED_STATUS=200 \
                K6_HOT_ACCOUNT_ID="${CAPACITY_K6_HOT_ACCOUNT_ID}" \
                K6_HOT_FROM="${CAPACITY_K6_HOT_FROM}" \
                K6_HOT_TO="${CAPACITY_K6_HOT_TO}" \
                K6_COLD_ACCOUNT_ID="${CAPACITY_K6_COLD_ACCOUNT_ID}" \
                K6_COLD_FROM="${CAPACITY_K6_COLD_FROM}" \
                K6_COLD_TO="${CAPACITY_K6_COLD_TO}" \
                K6_SCENARIO_MODE=burst \
                K6_BURST_RATE="${burst_rate}" \
                K6_PRE_ALLOCATED_VUS="${burst_rate}" \
                K6_MAX_VUS="$((burst_rate * 2))" \
                K6_DURATION="${CAPACITY_K6_TIMELINE_PHASE_DURATION}" \
                K6_OVERLOAD_MODE=true \
                K6_BURST_429_RATE_THRESHOLD=1 \
                K6_ARCHIVE_RESULTS=false \
                  tools/test/run-k6-transaction-100m-loadtest.sh --no-up --no-deps || status=1
                summary_json="build/reports/k6/${report_name}-summary.json"
                summary_md="build/reports/k6/${report_name}-summary.md"
                if [[ -s "${summary_json}" ]]; then
                  cp "build/reports/k6/${report_name}-summary.json" "${burst_matrix_summary_dir}/${report_name}-summary.json"
                else
                  echo "missing burst matrix k6 summary JSON: ${summary_json}" >&2
                  status=1
                fi
                if [[ -s "${summary_md}" ]]; then
                  cp "build/reports/k6/${report_name}-summary.md" "${burst_matrix_summary_dir}/${report_name}-summary.md"
                else
                  echo "missing burst matrix k6 summary markdown: ${summary_md}" >&2
                  status=1
                fi
                printf "%s\t%s\t%s\n" "${burst_rate}" "${report_name}" "${burst_matrix_summary_dir}/${report_name}-summary.json" >>"${matrix_ref}"
              done
              exit "${status}"
            '
            CAPACITY_NAME="${CAPACITY_NAME}" \
            CAPACITY_K6_DOCKER_CONTEXT="${CAPACITY_K6_DOCKER_CONTEXT}" \
            CAPACITY_K6_REMOTE_BASE_URL="${CAPACITY_K6_REMOTE_BASE_URL}" \
            CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL="${CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL}" \
            CAPACITY_K6_REMOTE_WORKDIR="${CAPACITY_K6_REMOTE_WORKDIR}" \
            CAPACITY_K6_TIMELINE_PHASE_DURATION="${CAPACITY_K6_TIMELINE_PHASE_DURATION}" \
            CAPACITY_K6_TIMELINE_BURST_RATES="${CAPACITY_K6_TIMELINE_BURST_RATES}" \
            CAPACITY_K6_HOT_ACCOUNT_ID="${CAPACITY_K6_HOT_ACCOUNT_ID}" \
            CAPACITY_K6_HOT_FROM="${CAPACITY_K6_HOT_FROM}" \
            CAPACITY_K6_HOT_TO="${CAPACITY_K6_HOT_TO}" \
            CAPACITY_K6_COLD_ACCOUNT_ID="${CAPACITY_K6_COLD_ACCOUNT_ID}" \
            CAPACITY_K6_COLD_FROM="${CAPACITY_K6_COLD_FROM}" \
            CAPACITY_K6_COLD_TO="${CAPACITY_K6_COLD_TO}" \
            OCI_OFFHOST_LOAD_COUPLED_TIMELINE_NAME="${CAPACITY_NAME}" \
            OCI_OFFHOST_LOAD_COUPLED_TIMELINE_RUN_ID="${CAPACITY_K6_HOST_METRICS_RUN_ID}" \
            OCI_OFFHOST_LOAD_COUPLED_SAMPLE_INTERVAL_SECONDS="${CAPACITY_K6_HOST_METRICS_TIMELINE_SAMPLE_INTERVAL_SECONDS}" \
            OCI_OFFHOST_LOAD_COUPLED_GENERATOR_DOCKER_CONTEXT="${CAPACITY_K6_DOCKER_CONTEXT}" \
            OCI_OFFHOST_LOAD_COUPLED_GENERATOR_SAMPLE_CONTEXT="${CAPACITY_K6_DOCKER_CONTEXT}" \
            OCI_OFFHOST_LOAD_COUPLED_TARGET_DOCKER_CONTEXT="target" \
            OCI_OFFHOST_LOAD_COUPLED_TARGET_SAMPLE_CONTEXT="local" \
            OCI_OFFHOST_LOAD_COUPLED_ARTIFACT_PACK_URI="artifact://offhost-capacity-prerequisite/${CAPACITY_NAME}" \
            OCI_OFFHOST_LOAD_COUPLED_OUTPUT_DIR="${host_metrics_timeline_dir}" \
            OCI_OFFHOST_LOAD_COUPLED_ARRIVAL16_SUMMARY_REF="${host_metrics_timeline_dir}/arrival16/${CAPACITY_NAME}-arrival16-summary.json" \
            OCI_OFFHOST_LOAD_COUPLED_VU16_SUMMARY_REF="${host_metrics_timeline_dir}/vu16/${CAPACITY_NAME}-vu16-summary.json" \
            OCI_OFFHOST_LOAD_COUPLED_BURST_MATRIX_SUMMARY_REF="${host_metrics_timeline_dir}/${CAPACITY_NAME}-burst-matrix-runs.tsv" \
            OCI_OFFHOST_LOAD_COUPLED_ARRIVAL16_COMMAND="${arrival16_command}" \
            OCI_OFFHOST_LOAD_COUPLED_VU16_COMMAND="${vu16_command}" \
            OCI_OFFHOST_LOAD_COUPLED_BURST_MATRIX_COMMAND="${burst_matrix_command}" \
              tools/test/run-oci-offhost-host-metrics-load-coupled-timeline.sh >"${host_metrics_timeline_dir}/host-metrics-load-coupled-timeline.log" 2>&1
            CAPACITY_K6_HOST_METRICS_TIMELINE_TSV="${generated_timeline_tsv}"
            CAPACITY_K6_VU16_SUMMARY_JSON="${host_metrics_timeline_dir}/vu16/${CAPACITY_NAME}-vu16-summary.json"
            CAPACITY_K6_BURST_MATRIX_TSV="${host_metrics_timeline_dir}/${CAPACITY_NAME}-burst-matrix-runs.tsv"
          fi
          if [[ -z "${CAPACITY_K6_HOST_METRICS_TIMELINE_TSV}" && "${CAPACITY_REQUIRE_LOAD_COUPLED_TIMELINE}" == "false" ]]; then
            mkdir -p "${host_metrics_timeline_dir}"
            OCI_OFFHOST_HOST_METRICS_TIMELINE_FALLBACK_NAME="${CAPACITY_NAME}" \
            OCI_OFFHOST_HOST_METRICS_RUN_ID="${CAPACITY_K6_HOST_METRICS_RUN_ID}" \
            OCI_OFFHOST_GENERATOR_HOST_METRICS_TSV="${CAPACITY_K6_GENERATOR_HOST_METRICS_TSV}" \
            OCI_OFFHOST_TARGET_HOST_METRICS_TSV="${CAPACITY_K6_TARGET_HOST_METRICS_TSV}" \
            OCI_OFFHOST_HOST_METRICS_TIMELINE_OUTPUT_DIR="${host_metrics_timeline_dir}" \
              tools/test/run-oci-offhost-host-metrics-timeline-fallback.sh >"${host_metrics_timeline_dir}/host-metrics-timeline-fallback.log" 2>&1
            CAPACITY_K6_HOST_METRICS_TIMELINE_TSV="${generated_timeline_tsv}"
          fi
          echo "Validate off-host host metrics timeline artifact"
          mkdir -p "${report_dir}/offhost-host-metrics-timeline-verified"
          OCI_OFFHOST_HOST_METRICS_TIMELINE_NAME="${CAPACITY_NAME}" \
          OCI_OFFHOST_HOST_METRICS_TIMELINE_RUN_ID="${CAPACITY_K6_HOST_METRICS_RUN_ID}" \
          OCI_OFFHOST_HOST_METRICS_TIMELINE_INPUT_TSV="${CAPACITY_K6_HOST_METRICS_TIMELINE_TSV}" \
          OCI_OFFHOST_HOST_METRICS_TIMELINE_REQUIRE_LOAD_COUPLED="${CAPACITY_REQUIRE_LOAD_COUPLED_TIMELINE}" \
          OCI_OFFHOST_HOST_METRICS_TIMELINE_OUTPUT_DIR="${report_dir}/offhost-host-metrics-timeline-verified" \
            tools/test/run-oci-offhost-host-metrics-timeline.sh >"${report_dir}/offhost-host-metrics-timeline-verified/host-metrics-timeline.log" 2>&1

          missing=()
          [[ -z "${CAPACITY_K6_DOCKER_CONTEXT}" ]] && missing+=("CAPACITY_K6_DOCKER_CONTEXT")
          [[ -z "${CAPACITY_K6_REMOTE_BASE_URL}" ]] && missing+=("CAPACITY_K6_REMOTE_BASE_URL")
          [[ -z "${CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL}" ]] && missing+=("CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL")
          [[ -z "${CAPACITY_K6_GENERATOR_HOST_METRICS_TSV}" ]] && missing+=("CAPACITY_K6_GENERATOR_HOST_METRICS_TSV")
          [[ -z "${CAPACITY_K6_TARGET_HOST_METRICS_TSV}" ]] && missing+=("CAPACITY_K6_TARGET_HOST_METRICS_TSV")
          [[ -z "${CAPACITY_K6_HOST_METRICS_TIMELINE_TSV}" ]] && missing+=("CAPACITY_K6_HOST_METRICS_TIMELINE_TSV")
          if (( ${#missing[@]} > 0 )); then
            {
              echo "CAPACITY_PREREQUISITE_STATUS=failed"
              echo "CAPACITY_PREREQUISITE_FAILURE_REASON=missing-required-env"
              printf 'CAPACITY_PREREQUISITE_MISSING=%s\n' "${missing[*]}"
            } >"${CAPACITY_PREREQUISITE_FAILURE_REPORT_PATH}"
            printf '::error::Missing off-host capacity env keys: %s\n' "${missing[*]}"
            exit 1
          fi

          env_names=(
            CAPACITY_NAME
            CAPACITY_K6_GENERATOR_MODE
            CAPACITY_REMOTE_PREFLIGHT
            CAPACITY_REMOTE_PROMETHEUS_RW_REQUIRED
            CAPACITY_REQUIRE_HOST_METRICS
            CAPACITY_PREREQUISITE_FAILURE_REPORT_PATH
            CAPACITY_K6_DOCKER_CONTEXT
            CAPACITY_K6_REMOTE_BASE_URL
            CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL
            CAPACITY_K6_REMOTE_WORKDIR
            CAPACITY_K6_HOST_METRICS_TSV
            CAPACITY_K6_HOST_METRICS_TIMELINE_TSV
            CAPACITY_K6_VU16_SUMMARY_JSON
            CAPACITY_K6_BURST_MATRIX_TSV
            CAPACITY_K6_SOURCE_EVIDENCE_TSV
            CAPACITY_REQUIRE_LOAD_COUPLED_TIMELINE
            CAPACITY_K6_HOST_METRICS_RUN_ID
            CAPACITY_K6_GENERATOR_HOST_METRICS_TSV
            CAPACITY_K6_TARGET_HOST_METRICS_TSV
          )

          for name in "${env_names[@]}"; do
            value="${!name:-}"
            if [[ -n "${value}" ]]; then
              case "${name}" in
                CAPACITY_K6_*|*TOKEN*|*DATABASE_URL|*_ENV_B64)
                  echo "::add-mask::${value}"
                  ;;
              esac
              printf '%s=%s\n' "${name}" "${value}" >>"${GITHUB_ENV}"
            fi
          done

      - name: Run off-host remote preflight
        shell: bash
        run: |
          set -euo pipefail
          report_dir="build/reports/k6/ci-offhost-100m-capacity-prerequisite"
          mkdir -p "${report_dir}"
          tools/test/run-offhost-capacity-env-doctor.sh >"${report_dir}/offhost-capacity-preflight.log" 2>&1

      - name: Build off-host host metrics evidence artifact
        shell: bash
        run: |
          set -euo pipefail
          report_dir="build/reports/k6/ci-offhost-100m-capacity-prerequisite"
          mkdir -p "${report_dir}"
          OCI_OFFHOST_HOST_METRICS_NAME="${CAPACITY_NAME}" \
          OCI_OFFHOST_HOST_METRICS_RUN_ID="${CAPACITY_K6_HOST_METRICS_RUN_ID}" \
          OCI_OFFHOST_GENERATOR_HOST_METRICS_TSV="${CAPACITY_K6_GENERATOR_HOST_METRICS_TSV}" \
          OCI_OFFHOST_TARGET_HOST_METRICS_TSV="${CAPACITY_K6_TARGET_HOST_METRICS_TSV}" \
          OCI_OFFHOST_HOST_METRICS_OUTPUT_DIR="${report_dir}/offhost-host-metrics-evidence" \
            tools/test/run-oci-offhost-host-metrics-evidence.sh

      - name: Required prerequisite check
        shell: bash
        run: |
          set -euo pipefail
          report_dir="build/reports/k6/ci-offhost-100m-capacity-prerequisite"
          mkdir -p "${report_dir}"
          tools/test/run-transaction-100m-capacity-gates.sh --print-plan >"${report_dir}/capacity-prerequisite-plan.log" 2>&1

      - name: Upload prerequisite artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offhost-capacity-prerequisite
          path: build/reports/k6/ci-offhost-100m-capacity-prerequisite/
          if-no-files-found: ignore

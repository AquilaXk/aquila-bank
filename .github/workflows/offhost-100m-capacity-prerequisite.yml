name: off-host 100m capacity prerequisite

on:
  workflow_dispatch:
    inputs:
      docker_context:
        description: "Remote Docker context name for off-host k6"
        required: false
        type: string
      remote_base_url:
        description: "Backend URL reachable from off-host k6"
        required: false
        type: string
      remote_prometheus_rw_url:
        description: "Prometheus remote-write URL reachable from off-host k6"
        required: false
        type: string
      remote_workdir:
        description: "Repository path on remote Docker context host"
        required: false
        type: string
      host_metrics_tsv:
        description: "Combined host CPU/network TSV evidence ref"
        required: false
        type: string
      vu16_summary_json:
        description: "VU16 saturation summary JSON evidence ref"
        required: false
        type: string
      burst_matrix_tsv:
        description: "Burst 32/48/64/80/96 matrix TSV evidence ref"
        required: false
        type: string
      source_evidence_tsv:
        description: "Source-level 429/latency/5xx TSV evidence ref"
        required: false
        type: string
      host_metrics_run_id:
        description: "Run id used inside generator/target host metrics TSV"
        required: false
        type: string
      generator_host_metrics_tsv:
        description: "Generator host CPU/network TSV evidence ref"
        required: false
        type: string
      target_host_metrics_tsv:
        description: "Target app/DB host CPU/network TSV evidence ref"
        required: false
        type: string
  pull_request:
    paths:
      - ".github/workflows/offhost-100m-capacity-prerequisite.yml"
      - "tools/test/run-transaction-100m-capacity-gates.sh"
      - "tools/test/run-offhost-capacity-env-doctor.sh"
      - "tools/test/check-offhost-capacity-env-doctor.sh"
      - "tools/test/offhost-capacity.env.example"
      - "tools/test/check-offhost-capacity-prerequisite-required-gate.sh"
      - "tools/test/run-oci-offhost-host-metrics-evidence.sh"
      - "tools/test/check-oci-offhost-host-metrics-evidence.sh"
      - "tools/test/run-oci-offhost-host-metrics-timeline.sh"
      - "tools/test/check-oci-offhost-host-metrics-timeline.sh"
      - "tools/test/run-oci-offhost-host-metrics-snapshot.sh"
      - "tools/test/check-oci-offhost-host-metrics-snapshot.sh"
      - "tools/test/run-transaction-100m-offhost-capacity-baseline-report.sh"
      - "tools/test/run-t3micro-defensive-gates-aggregate-report.sh"

permissions:
  contents: read

jobs:
  contract:
    name: off-host capacity prerequisite contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate workflow contract
        run: tools/test/check-offhost-capacity-prerequisite-required-gate.sh

      - name: Check off-host host metrics timeline
        run: tools/test/check-oci-offhost-host-metrics-timeline.sh

  prerequisite:
    name: required off-host capacity env
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, oci-a1-staging]
    timeout-minutes: 10
    environment:
      name: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Load off-host capacity env
        env:
          OCI_A1_STAGING_ENV: ${{ secrets.OCI_A1_STAGING_ENV }}
          DOCKER_CONTEXT_INPUT: ${{ inputs.docker_context }}
          REMOTE_BASE_URL_INPUT: ${{ inputs.remote_base_url }}
          REMOTE_PROMETHEUS_RW_URL_INPUT: ${{ inputs.remote_prometheus_rw_url }}
          REMOTE_WORKDIR_INPUT: ${{ inputs.remote_workdir }}
          HOST_METRICS_TSV_INPUT: ${{ inputs.host_metrics_tsv }}
          VU16_SUMMARY_JSON_INPUT: ${{ inputs.vu16_summary_json }}
          BURST_MATRIX_TSV_INPUT: ${{ inputs.burst_matrix_tsv }}
          SOURCE_EVIDENCE_TSV_INPUT: ${{ inputs.source_evidence_tsv }}
          HOST_METRICS_RUN_ID_INPUT: ${{ inputs.host_metrics_run_id }}
          GENERATOR_HOST_METRICS_TSV_INPUT: ${{ inputs.generator_host_metrics_tsv }}
          TARGET_HOST_METRICS_TSV_INPUT: ${{ inputs.target_host_metrics_tsv }}
          CAPACITY_K6_DOCKER_CONTEXT_VAR: ${{ vars.CAPACITY_K6_DOCKER_CONTEXT }}
          CAPACITY_K6_REMOTE_BASE_URL_VAR: ${{ vars.CAPACITY_K6_REMOTE_BASE_URL }}
          CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL_VAR: ${{ vars.CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL }}
          CAPACITY_K6_REMOTE_WORKDIR_VAR: ${{ vars.CAPACITY_K6_REMOTE_WORKDIR }}
          CAPACITY_K6_HOST_METRICS_TSV_VAR: ${{ vars.CAPACITY_K6_HOST_METRICS_TSV }}
          CAPACITY_K6_VU16_SUMMARY_JSON_VAR: ${{ vars.CAPACITY_K6_VU16_SUMMARY_JSON }}
          CAPACITY_K6_BURST_MATRIX_TSV_VAR: ${{ vars.CAPACITY_K6_BURST_MATRIX_TSV }}
          CAPACITY_K6_SOURCE_EVIDENCE_TSV_VAR: ${{ vars.CAPACITY_K6_SOURCE_EVIDENCE_TSV }}
          CAPACITY_K6_GENERATOR_HOST_METRICS_TSV_VAR: ${{ vars.CAPACITY_K6_GENERATOR_HOST_METRICS_TSV }}
          CAPACITY_K6_TARGET_HOST_METRICS_TSV_VAR: ${{ vars.CAPACITY_K6_TARGET_HOST_METRICS_TSV }}
        shell: bash
        run: |
          set -euo pipefail
          report_dir="build/reports/k6/ci-offhost-100m-capacity-prerequisite"
          mkdir -p "${report_dir}"

          if [[ -n "${OCI_A1_STAGING_ENV}" ]]; then
            staging_env_path="${RUNNER_TEMP}/oci-a1-staging-offhost-capacity.env"
            printf '%s\n' "${OCI_A1_STAGING_ENV}" >"${staging_env_path}"
            chmod 600 "${staging_env_path}"

            set -a
            # off-host capacity도 staging-deploy와 같은 unified staging secret contract를 사용한다.
            source "${staging_env_path}"
            set +a
          fi

          CAPACITY_NAME="ci-offhost-100m-capacity-prerequisite"
          CAPACITY_K6_GENERATOR_MODE="docker-context"
          CAPACITY_REMOTE_PREFLIGHT="true"
          CAPACITY_REQUIRE_HOST_METRICS="true"
          CAPACITY_PREREQUISITE_FAILURE_REPORT_PATH="${report_dir}/capacity-prerequisite-failure.env"
          DEFAULT_CAPACITY_K6_DOCKER_CONTEXT="default"
          DEFAULT_CAPACITY_K6_REMOTE_BASE_URL="${STAGING_BASE_URL:-}"
          DEFAULT_CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL="http://172.17.0.2:9090/api/v1/write"
          CAPACITY_K6_REMOTE_WORKDIR_ENV="${CAPACITY_K6_REMOTE_WORKDIR:-}"
          CAPACITY_K6_DOCKER_CONTEXT="${DOCKER_CONTEXT_INPUT:-${CAPACITY_K6_DOCKER_CONTEXT_VAR:-${DEFAULT_CAPACITY_K6_DOCKER_CONTEXT}}}"
          CAPACITY_K6_REMOTE_BASE_URL="${REMOTE_BASE_URL_INPUT:-${CAPACITY_K6_REMOTE_BASE_URL:-${CAPACITY_K6_REMOTE_BASE_URL_VAR:-${DEFAULT_CAPACITY_K6_REMOTE_BASE_URL}}}}"
          CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL="${REMOTE_PROMETHEUS_RW_URL_INPUT:-${CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL:-${CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL_VAR:-${DEFAULT_CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL}}}}"
          CAPACITY_K6_REMOTE_WORKDIR="${REMOTE_WORKDIR_INPUT:-${CAPACITY_K6_REMOTE_WORKDIR_VAR:-}}"
          if [[ -z "${CAPACITY_K6_REMOTE_WORKDIR}" ]]; then
            if [[ "${CAPACITY_K6_DOCKER_CONTEXT}" == "default" ]]; then
              CAPACITY_K6_REMOTE_WORKDIR="${GITHUB_WORKSPACE}"
            else
              CAPACITY_K6_REMOTE_WORKDIR="${CAPACITY_K6_REMOTE_WORKDIR_ENV:-${GITHUB_WORKSPACE}}"
            fi
          fi
          CAPACITY_K6_HOST_METRICS_TSV="${HOST_METRICS_TSV_INPUT:-${CAPACITY_K6_HOST_METRICS_TSV:-${CAPACITY_K6_HOST_METRICS_TSV_VAR:-}}}"
          CAPACITY_K6_VU16_SUMMARY_JSON="${VU16_SUMMARY_JSON_INPUT:-${CAPACITY_K6_VU16_SUMMARY_JSON:-${CAPACITY_K6_VU16_SUMMARY_JSON_VAR:-}}}"
          CAPACITY_K6_BURST_MATRIX_TSV="${BURST_MATRIX_TSV_INPUT:-${CAPACITY_K6_BURST_MATRIX_TSV:-${CAPACITY_K6_BURST_MATRIX_TSV_VAR:-}}}"
          CAPACITY_K6_SOURCE_EVIDENCE_TSV="${SOURCE_EVIDENCE_TSV_INPUT:-${CAPACITY_K6_SOURCE_EVIDENCE_TSV:-${CAPACITY_K6_SOURCE_EVIDENCE_TSV_VAR:-}}}"
          CAPACITY_K6_HOST_METRICS_RUN_ID="${HOST_METRICS_RUN_ID_INPUT:-${CAPACITY_K6_HOST_METRICS_RUN_ID:-${CAPACITY_NAME}}}"
          CAPACITY_K6_GENERATOR_HOST_METRICS_TSV="${GENERATOR_HOST_METRICS_TSV_INPUT:-${CAPACITY_K6_GENERATOR_HOST_METRICS_TSV:-${CAPACITY_K6_GENERATOR_HOST_METRICS_TSV_VAR:-${CAPACITY_K6_HOST_METRICS_TSV}}}}"
          CAPACITY_K6_TARGET_HOST_METRICS_TSV="${TARGET_HOST_METRICS_TSV_INPUT:-${CAPACITY_K6_TARGET_HOST_METRICS_TSV:-${CAPACITY_K6_TARGET_HOST_METRICS_TSV_VAR:-}}}"
          host_metrics_snapshot_dir="${report_dir}/offhost-host-metrics-snapshot"
          snapshot_generator_tsv="${host_metrics_snapshot_dir}/${CAPACITY_NAME}-generator-host-metrics.tsv"
          snapshot_target_tsv="${host_metrics_snapshot_dir}/${CAPACITY_NAME}-target-host-metrics.tsv"
          if [[ -z "${CAPACITY_K6_GENERATOR_HOST_METRICS_TSV}" || -z "${CAPACITY_K6_TARGET_HOST_METRICS_TSV}" ]]; then
            mkdir -p "${host_metrics_snapshot_dir}"
            OCI_OFFHOST_HOST_METRICS_SNAPSHOT_NAME="${CAPACITY_NAME}" \
            OCI_OFFHOST_HOST_METRICS_RUN_ID="${CAPACITY_K6_HOST_METRICS_RUN_ID}" \
            OCI_OFFHOST_GENERATOR_DOCKER_CONTEXT="${CAPACITY_K6_DOCKER_CONTEXT}" \
            OCI_OFFHOST_TARGET_DOCKER_CONTEXT="target" \
            OCI_OFFHOST_HOST_METRICS_OUTPUT_DIR="${host_metrics_snapshot_dir}" \
              tools/test/run-oci-offhost-host-metrics-snapshot.sh >"${host_metrics_snapshot_dir}/host-metrics-snapshot.log" 2>&1
            if [[ -z "${CAPACITY_K6_GENERATOR_HOST_METRICS_TSV}" ]]; then
              CAPACITY_K6_GENERATOR_HOST_METRICS_TSV="${snapshot_generator_tsv}"
            fi
            if [[ -z "${CAPACITY_K6_TARGET_HOST_METRICS_TSV}" ]]; then
              CAPACITY_K6_TARGET_HOST_METRICS_TSV="${snapshot_target_tsv}"
            fi
          fi

          missing=()
          [[ -z "${CAPACITY_K6_DOCKER_CONTEXT}" ]] && missing+=("CAPACITY_K6_DOCKER_CONTEXT")
          [[ -z "${CAPACITY_K6_REMOTE_BASE_URL}" ]] && missing+=("CAPACITY_K6_REMOTE_BASE_URL")
          [[ -z "${CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL}" ]] && missing+=("CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL")
          [[ -z "${CAPACITY_K6_GENERATOR_HOST_METRICS_TSV}" ]] && missing+=("CAPACITY_K6_GENERATOR_HOST_METRICS_TSV")
          [[ -z "${CAPACITY_K6_TARGET_HOST_METRICS_TSV}" ]] && missing+=("CAPACITY_K6_TARGET_HOST_METRICS_TSV")
          if (( ${#missing[@]} > 0 )); then
            {
              echo "CAPACITY_PREREQUISITE_STATUS=failed"
              echo "CAPACITY_PREREQUISITE_FAILURE_REASON=missing-required-env"
              printf 'CAPACITY_PREREQUISITE_MISSING=%s\n' "${missing[*]}"
            } >"${CAPACITY_PREREQUISITE_FAILURE_REPORT_PATH}"
            printf '::error::Missing off-host capacity env keys: %s\n' "${missing[*]}"
            exit 1
          fi

          env_names=(
            CAPACITY_NAME
            CAPACITY_K6_GENERATOR_MODE
            CAPACITY_REMOTE_PREFLIGHT
            CAPACITY_REQUIRE_HOST_METRICS
            CAPACITY_PREREQUISITE_FAILURE_REPORT_PATH
            CAPACITY_K6_DOCKER_CONTEXT
            CAPACITY_K6_REMOTE_BASE_URL
            CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL
            CAPACITY_K6_REMOTE_WORKDIR
            CAPACITY_K6_HOST_METRICS_TSV
            CAPACITY_K6_VU16_SUMMARY_JSON
            CAPACITY_K6_BURST_MATRIX_TSV
            CAPACITY_K6_SOURCE_EVIDENCE_TSV
            CAPACITY_K6_HOST_METRICS_RUN_ID
            CAPACITY_K6_GENERATOR_HOST_METRICS_TSV
            CAPACITY_K6_TARGET_HOST_METRICS_TSV
          )

          for name in "${env_names[@]}"; do
            value="${!name:-}"
            if [[ -n "${value}" ]]; then
              case "${name}" in
                CAPACITY_K6_*|*TOKEN*|*DATABASE_URL|*_ENV_B64)
                  echo "::add-mask::${value}"
                  ;;
              esac
              printf '%s=%s\n' "${name}" "${value}" >>"${GITHUB_ENV}"
            fi
          done

      - name: Run off-host remote preflight
        shell: bash
        run: |
          set -euo pipefail
          report_dir="build/reports/k6/ci-offhost-100m-capacity-prerequisite"
          mkdir -p "${report_dir}"
          tools/test/run-offhost-capacity-env-doctor.sh >"${report_dir}/offhost-capacity-preflight.log" 2>&1

      - name: Build off-host host metrics evidence artifact
        shell: bash
        run: |
          set -euo pipefail
          report_dir="build/reports/k6/ci-offhost-100m-capacity-prerequisite"
          mkdir -p "${report_dir}"
          OCI_OFFHOST_HOST_METRICS_NAME="${CAPACITY_NAME}" \
          OCI_OFFHOST_HOST_METRICS_RUN_ID="${CAPACITY_K6_HOST_METRICS_RUN_ID}" \
          OCI_OFFHOST_GENERATOR_HOST_METRICS_TSV="${CAPACITY_K6_GENERATOR_HOST_METRICS_TSV}" \
          OCI_OFFHOST_TARGET_HOST_METRICS_TSV="${CAPACITY_K6_TARGET_HOST_METRICS_TSV}" \
          OCI_OFFHOST_HOST_METRICS_OUTPUT_DIR="${report_dir}/offhost-host-metrics-evidence" \
            tools/test/run-oci-offhost-host-metrics-evidence.sh

      - name: Required prerequisite check
        shell: bash
        run: |
          set -euo pipefail
          report_dir="build/reports/k6/ci-offhost-100m-capacity-prerequisite"
          mkdir -p "${report_dir}"
          tools/test/run-transaction-100m-capacity-gates.sh --print-plan >"${report_dir}/capacity-prerequisite-plan.log" 2>&1

      - name: Upload prerequisite artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offhost-capacity-prerequisite
          path: build/reports/k6/ci-offhost-100m-capacity-prerequisite/
          if-no-files-found: ignore

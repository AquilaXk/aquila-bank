name: Production Promotion

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Staging success main SHA to promote
        required: true
        type: string
  push:
    tags:
      - prod-*

permissions:
  contents: read
  deployments: write
  packages: read

concurrency:
  group: production-promotion
  cancel-in-progress: false

jobs:
  guard:
    name: Verify Staging Success SHA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve promotion target SHA
        id: resolve
        env:
          DISPATCH_SHA: ${{ inputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin main:refs/remotes/origin/main

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [[ ! "${DISPATCH_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::workflow_dispatch input sha must be a full 40-character commit SHA."
              exit 1
            fi
            target_sha="$(git rev-parse "${DISPATCH_SHA}^{commit}")"
          elif [[ "${GITHUB_REF}" == refs/tags/prod-* ]]; then
            git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
            target_sha="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          else
            echo "::error::Unsupported production promotion trigger ${GITHUB_EVENT_NAME} ${GITHUB_REF}."
            exit 1
          fi

          if [[ ! "${target_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Resolved target ${target_sha} is not a commit SHA."
            exit 1
          fi

          # production은 main 밖 SHA를 받지 않아 staging 검증 우회 배포를 막는다.
          if ! git merge-base --is-ancestor "${target_sha}" origin/main; then
            echo "::error::Target SHA ${target_sha} is not reachable from origin/main."
            exit 1
          fi

          echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${target_sha:0:12}" >> "${GITHUB_OUTPUT}"

      - name: Verify staging deployment success
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          deployment_ids="$(
            gh api --method GET "repos/${GITHUB_REPOSITORY}/deployments" \
              -f environment=staging \
              -f sha="${TARGET_SHA}" \
              --paginate \
              --jq ".[].id"
          )"

          if [ -z "${deployment_ids}" ]; then
            echo "::error::No staging deployment found for ${TARGET_SHA}."
            exit 1
          fi

          found_success=false
          while IFS= read -r deployment_id; do
            if [ -z "${deployment_id}" ]; then
              continue
            fi

            state="$(
              gh api --method GET "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
                --jq ".[0].state // \"\""
            )"
            if [ "${state}" = "success" ]; then
              found_success=true
              break
            fi
          done <<< "${deployment_ids}"

          if [ "${found_success}" != "true" ]; then
            echo "::error::No successful staging deployment status found for ${TARGET_SHA}."
            exit 1
          fi

      - name: Verify staging 100m replay evidence success
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          deployment_ids="$(
            gh api --method GET "repos/${GITHUB_REPOSITORY}/deployments" \
              -f environment=staging-100m-replay \
              -f sha="${TARGET_SHA}" \
              --paginate \
              --jq ".[].id"
          )"

          if [ -z "${deployment_ids}" ]; then
            echo "::error::No staging 100m replay evidence found for ${TARGET_SHA}."
            exit 1
          fi

          found_success=false
          while IFS= read -r deployment_id; do
            if [ -z "${deployment_id}" ]; then
              continue
            fi

            state="$(
              gh api --method GET "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
                --jq ".[0].state // \"\""
            )"
            if [ "${state}" = "success" ]; then
              found_success=true
              break
            fi
          done <<< "${deployment_ids}"

          if [ "${found_success}" != "true" ]; then
            echo "::error::No successful staging 100m replay evidence found for ${TARGET_SHA}."
            exit 1
          fi

  promote:
    name: Promote SHA To Production
    needs:
      - guard
    runs-on: [self-hosted, oci-a1-staging]
    timeout-minutes: 35
    environment:
      name: production
    env:
      TARGET_SHA: ${{ needs.guard.outputs.target_sha }}
      IMAGE_TAG: ${{ needs.guard.outputs.image_tag }}
      PROMOTION_LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout promotion SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Validate checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "${checked_out_sha}" != "${TARGET_SHA}" ]; then
            echo "::error::Checked out ${checked_out_sha}, expected ${TARGET_SHA}."
            exit 1
          fi

      - name: Resolve OCI A1 production image names
        shell: bash
        run: |
          set -euo pipefail
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          printf 'BACKEND_IMAGE=ghcr.io/%s/aquila-bank-backend\n' "${owner_lc}" >>"${GITHUB_ENV}"
          printf 'FRONTEND_IMAGE=ghcr.io/%s/aquila-bank-frontend\n' "${owner_lc}" >>"${GITHUB_ENV}"

      - name: Check OCI self-hosted runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          ops/deploy/oci/check-self-hosted-runner.sh

      - name: Run Alertmanager receiver secret smoke
        env:
          ALERTMANAGER_RECEIVER_SECRET_SMOKE_ENVIRONMENT: production
          ALERTMANAGER_RECEIVER_SLACK_ENABLED: ${{ secrets.ALERTMANAGER_RECEIVER_SLACK_ENABLED }}
          ALERTMANAGER_RECEIVER_SLACK_WEBHOOK_URL: ${{ secrets.ALERTMANAGER_RECEIVER_SLACK_WEBHOOK_URL }}
          ALERTMANAGER_RECEIVER_PAGERDUTY_ENABLED: ${{ secrets.ALERTMANAGER_RECEIVER_PAGERDUTY_ENABLED }}
          ALERTMANAGER_RECEIVER_PAGERDUTY_ROUTING_KEY: ${{ secrets.ALERTMANAGER_RECEIVER_PAGERDUTY_ROUTING_KEY }}
          ALERTMANAGER_RECEIVER_WEBHOOK_ENABLED: ${{ secrets.ALERTMANAGER_RECEIVER_WEBHOOK_ENABLED }}
          ALERTMANAGER_RECEIVER_WEBHOOK_URL: ${{ secrets.ALERTMANAGER_RECEIVER_WEBHOOK_URL }}
          ALERTMANAGER_RECEIVER_TELEGRAM_ENABLED: ${{ secrets.ALERTMANAGER_RECEIVER_TELEGRAM_ENABLED }}
          ALERTMANAGER_RECEIVER_TELEGRAM_BOT_TOKEN: ${{ secrets.ALERTMANAGER_RECEIVER_TELEGRAM_BOT_TOKEN }}
          ALERTMANAGER_RECEIVER_TELEGRAM_CHAT_ID: ${{ secrets.ALERTMANAGER_RECEIVER_TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          tools/ops/validate-alertmanager-receiver-secrets.sh

      - name: Run production high-traffic config gate
        env:
          SECURITY_LOGIN_THROTTLING_STORE: ${{ vars.SECURITY_LOGIN_THROTTLING_STORE }}
          SECURITY_LOGIN_THROTTLING_REQUIRE_REDIS: ${{ vars.SECURITY_LOGIN_THROTTLING_REQUIRE_REDIS }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}
          TRANSACTION_READ_REPLICA_ENABLED: ${{ vars.TRANSACTION_READ_REPLICA_ENABLED }}
          TRANSACTION_READ_REPLICA_URL: ${{ secrets.TRANSACTION_READ_REPLICA_URL }}
          TRANSACTION_READ_REPLICA_USERNAME: ${{ secrets.TRANSACTION_READ_REPLICA_USERNAME }}
          TRANSACTION_READ_REPLICA_PASSWORD: ${{ secrets.TRANSACTION_READ_REPLICA_PASSWORD }}
          TRANSACTION_READ_REPLICA_POOL_MAX_SIZE: ${{ vars.TRANSACTION_READ_REPLICA_POOL_MAX_SIZE }}
          TRANSACTION_READ_REPLICA_LAG_THRESHOLD_MS: ${{ vars.TRANSACTION_READ_REPLICA_LAG_THRESHOLD_MS }}
          OUTBOX_KAFKA_ENABLED: ${{ vars.OUTBOX_KAFKA_ENABLED }}
          OUTBOX_KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.OUTBOX_KAFKA_BOOTSTRAP_SERVERS }}
          OUTBOX_KAFKA_TOPIC_DEFAULT: ${{ vars.OUTBOX_KAFKA_TOPIC_DEFAULT }}
          OUTBOX_KAFKA_TOPIC_TRANSFER_BOOKED: ${{ vars.OUTBOX_KAFKA_TOPIC_TRANSFER_BOOKED }}
          OUTBOX_KAFKA_TOPIC_TRANSFER_REVERSED: ${{ vars.OUTBOX_KAFKA_TOPIC_TRANSFER_REVERSED }}
          OUTBOX_KAFKA_PRODUCER_ACKS: ${{ vars.OUTBOX_KAFKA_PRODUCER_ACKS }}
          OUTBOX_KAFKA_PRODUCER_ENABLE_IDEMPOTENCE: ${{ vars.OUTBOX_KAFKA_PRODUCER_ENABLE_IDEMPOTENCE }}
          OUTBOX_KAFKA_PRODUCER_MAX_IN_FLIGHT: ${{ vars.OUTBOX_KAFKA_PRODUCER_MAX_IN_FLIGHT }}
          NOTIFICATION_INBOX_CONSUMER_ENABLED: ${{ vars.NOTIFICATION_INBOX_CONSUMER_ENABLED }}
          NOTIFICATION_INBOX_CONSUMER_OPS_ENABLED: ${{ vars.NOTIFICATION_INBOX_CONSUMER_OPS_ENABLED }}
          NOTIFICATION_INBOX_CONSUMER_BOOTSTRAP_SERVERS: ${{ secrets.NOTIFICATION_INBOX_CONSUMER_BOOTSTRAP_SERVERS }}
          NOTIFICATION_INBOX_CONSUMER_CONCURRENCY: ${{ vars.NOTIFICATION_INBOX_CONSUMER_CONCURRENCY }}
          NOTIFICATION_INBOX_CONSUMER_TRANSFER_BOOKED_TOPIC: ${{ vars.NOTIFICATION_INBOX_CONSUMER_TRANSFER_BOOKED_TOPIC }}
          NOTIFICATION_INBOX_CONSUMER_TRANSFER_REVERSED_TOPIC: ${{ vars.NOTIFICATION_INBOX_CONSUMER_TRANSFER_REVERSED_TOPIC }}
          NOTIFICATION_INBOX_CONSUMER_DLQ_TOPIC: ${{ vars.NOTIFICATION_INBOX_CONSUMER_DLQ_TOPIC }}
          KAFKA_TOPIC_PROVISIONING_ENABLED: ${{ vars.KAFKA_TOPIC_PROVISIONING_ENABLED }}
          KAFKA_TOPIC_STARTUP_VALIDATION_ENABLED: ${{ vars.KAFKA_TOPIC_STARTUP_VALIDATION_ENABLED }}
          KAFKA_TOPIC_PROVISIONING_PARTITIONS: ${{ vars.KAFKA_TOPIC_PROVISIONING_PARTITIONS }}
          KAFKA_TOPIC_PROVISIONING_REPLICATION_FACTOR: ${{ vars.KAFKA_TOPIC_PROVISIONING_REPLICATION_FACTOR }}
          KAFKA_TOPIC_PROVISIONING_MIN_IN_SYNC_REPLICAS: ${{ vars.KAFKA_TOPIC_PROVISIONING_MIN_IN_SYNC_REPLICAS }}
          OPS_API_ADMISSION_CONTROL_ENABLED: ${{ vars.OPS_API_ADMISSION_CONTROL_ENABLED }}
          OPS_API_ADMISSION_CONTROL_TRANSACTION_READ_MAX: ${{ vars.OPS_API_ADMISSION_CONTROL_TRANSACTION_READ_MAX }}
          OPS_API_ADMISSION_CONTROL_ACCOUNT_READ_MAX: ${{ vars.OPS_API_ADMISSION_CONTROL_ACCOUNT_READ_MAX }}
          OPS_API_ADMISSION_CONTROL_TRANSFER_WRITE_MAX: ${{ vars.OPS_API_ADMISSION_CONTROL_TRANSFER_WRITE_MAX }}
          OPS_API_ADMISSION_CONTROL_NOTIFICATION_STREAM_MAX: ${{ vars.OPS_API_ADMISSION_CONTROL_NOTIFICATION_STREAM_MAX }}
          OPS_API_ADMISSION_CONTROL_NOTIFICATION_READ_MAX: ${{ vars.OPS_API_ADMISSION_CONTROL_NOTIFICATION_READ_MAX }}
          OPS_API_ADMISSION_CONTROL_INTERNAL_OPS_MAX: ${{ vars.OPS_API_ADMISSION_CONTROL_INTERNAL_OPS_MAX }}
          OPS_T3MICRO_SATURATION_GUARD_ENABLED: ${{ vars.OPS_T3MICRO_SATURATION_GUARD_ENABLED }}
          OPS_T3MICRO_SATURATION_GUARD_POOL_ACTIVE_THRESHOLD_PERCENT: ${{ vars.OPS_T3MICRO_SATURATION_GUARD_POOL_ACTIVE_THRESHOLD_PERCENT }}
          OPS_T3MICRO_SATURATION_GUARD_THREADS_BUSY_THRESHOLD_PERCENT: ${{ vars.OPS_T3MICRO_SATURATION_GUARD_THREADS_BUSY_THRESHOLD_PERCENT }}
          OPS_T3MICRO_SATURATION_GUARD_QUERY_TIMEOUT_THRESHOLD: ${{ vars.OPS_T3MICRO_SATURATION_GUARD_QUERY_TIMEOUT_THRESHOLD }}
          DB_POOL_MAX_SIZE: ${{ vars.DB_POOL_MAX_SIZE }}
          SERVER_THREADS_MAX: ${{ vars.SERVER_THREADS_MAX }}
          NOTIFICATION_SSE_MAX_TOTAL_SESSIONS: ${{ vars.NOTIFICATION_SSE_MAX_TOTAL_SESSIONS }}
        shell: bash
        run: |
          set -euo pipefail
          tools/ops/validate-production-high-traffic-config.sh

      - name: Create production deployment
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(
            jq -n \
              --arg ref "${TARGET_SHA}" \
              --arg description "Promote staging success SHA ${TARGET_SHA} to production" \
              '{
                ref: $ref,
                environment: "production",
                description: $description,
                auto_merge: false,
                required_contexts: [],
                production_environment: true,
                transient_environment: false
              }'
          )"
          deployment_id="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments" --input - --jq ".id" <<< "${payload}")"

          if [ -z "${deployment_id}" ]; then
            echo "::error::Failed to create production deployment."
            exit 1
          fi

          echo "deployment_id=${deployment_id}" >> "${GITHUB_OUTPUT}"

      - name: Load OCI A1 production env
        env:
          OCI_A1_PRODUCTION_ENV: ${{ secrets.OCI_A1_PRODUCTION_ENV }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OCI_A1_PRODUCTION_ENV}" ]]; then
            echo "::error::Missing OCI_A1_PRODUCTION_ENV environment secret."
            exit 1
          fi

          production_env_path="${RUNNER_TEMP}/oci-a1-production.env"
          printf '%s\n' "${OCI_A1_PRODUCTION_ENV}" >"${production_env_path}"
          chmod 600 "${production_env_path}"

          set -a
          # production 배포 설정은 Environment secret 하나에 shell env 파일 형식으로 격리한다.
          source "${production_env_path}"
          set +a

          OCI_A1_CAPACITY_PROFILE_ENABLED="${OCI_A1_CAPACITY_PROFILE_ENABLED:-true}"
          PRODUCTION_BASE_URL="${PRODUCTION_BASE_URL:-${STAGING_BASE_URL:-}}"
          PRODUCTION_SMOKE_SHA_PATH="${PRODUCTION_SMOKE_SHA_PATH:-${STAGING_SMOKE_SHA_PATH:-/actuator/info}}"
          PRODUCTION_SMOKE_HEALTH_PATH="${PRODUCTION_SMOKE_HEALTH_PATH:-${STAGING_SMOKE_HEALTH_PATH:-/actuator/health}}"
          PRODUCTION_SMOKE_READ_PATH="${PRODUCTION_SMOKE_READ_PATH:-${STAGING_SMOKE_READ_PATH:-}}"
          PRODUCTION_SMOKE_WRITE_PATH="${PRODUCTION_SMOKE_WRITE_PATH:-${STAGING_SMOKE_WRITE_PATH:-}}"
          PRODUCTION_SMOKE_WRITE_METHOD="${PRODUCTION_SMOKE_WRITE_METHOD:-${STAGING_SMOKE_WRITE_METHOD:-POST}}"
          PRODUCTION_SMOKE_WRITE_BODY="${PRODUCTION_SMOKE_WRITE_BODY:-${STAGING_SMOKE_WRITE_BODY:-{}}}"
          PRODUCTION_SMOKE_AUTH_HEADER_NAME="${PRODUCTION_SMOKE_AUTH_HEADER_NAME:-${STAGING_SMOKE_AUTH_HEADER_NAME:-}}"
          PRODUCTION_SMOKE_AUTH_HEADER_VALUE="${PRODUCTION_SMOKE_AUTH_HEADER_VALUE:-${STAGING_SMOKE_AUTH_HEADER_VALUE:-}}"
          PRODUCTION_SMOKE_TIMEOUT_SECONDS="${PRODUCTION_SMOKE_TIMEOUT_SECONDS:-${STAGING_SMOKE_TIMEOUT_SECONDS:-5}}"

          missing=()
          [[ -z "${OCI_A1_BACKEND_ENV_B64:-}" ]] && missing+=("OCI_A1_BACKEND_ENV_B64")
          [[ -z "${PRODUCTION_BASE_URL:-}" ]] && missing+=("PRODUCTION_BASE_URL")
          [[ -z "${PRODUCTION_SMOKE_READ_PATH:-}" ]] && missing+=("PRODUCTION_SMOKE_READ_PATH")
          [[ -z "${PRODUCTION_SMOKE_WRITE_PATH:-}" ]] && missing+=("PRODUCTION_SMOKE_WRITE_PATH")

          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing OCI A1 production env keys: %s\n' "${missing[*]}"
            exit 1
          fi

          env_names=(
            OCI_A1_BACKEND_ENV_B64
            OCI_A1_FRONTEND_ENV_B64
            OCI_A1_CAPACITY_PROFILE_ENABLED
            PRODUCTION_BASE_URL
            PRODUCTION_SMOKE_SHA_PATH
            PRODUCTION_SMOKE_HEALTH_PATH
            PRODUCTION_SMOKE_READ_PATH
            PRODUCTION_SMOKE_WRITE_PATH
            PRODUCTION_SMOKE_WRITE_METHOD
            PRODUCTION_SMOKE_WRITE_BODY
            PRODUCTION_SMOKE_AUTH_HEADER_NAME
            PRODUCTION_SMOKE_AUTH_HEADER_VALUE
            PRODUCTION_SMOKE_TIMEOUT_SECONDS
            PRODUCTION_ROLLBACK_WEBHOOK_URL
            PRODUCTION_ROLLBACK_TOKEN
            PRODUCTION_ROLLBACK_TARGET_SHA
          )

          for name in "${env_names[@]}"; do
            value="${!name:-}"
            if [[ -n "${value}" ]]; then
              echo "::add-mask::${value}"
            fi
            if [[ "${value}" == *$'\n'* ]]; then
              delimiter="AQUILA_${name}_EOF_$(date +%s%N)"
              {
                printf '%s<<%s\n' "${name}" "${delimiter}"
                printf '%s\n' "${value}"
                printf '%s\n' "${delimiter}"
              } >>"${GITHUB_ENV}"
            else
              printf '%s=%s\n' "${name}" "${value}" >>"${GITHUB_ENV}"
            fi
          done

      - name: Mark production deployment in progress
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(
            jq -n \
              --arg log_url "${PROMOTION_LOG_URL}" \
              '{
                state: "in_progress",
                environment: "production",
                log_url: $log_url,
                auto_inactive: false
              }'
          )"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" --input - <<< "${payload}"

      - name: Run OCI A1 production blue-green deploy locally
        env:
          GITHUB_ACTOR_VALUE: ${{ github.actor }}
          GITHUB_TOKEN_VALUE: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          github_token_b64="$(printf '%s' "${GITHUB_TOKEN_VALUE}" | base64 -w0)"

          export GITHUB_ACTOR="${GITHUB_ACTOR_VALUE}"
          export GITHUB_TOKEN_B64="${github_token_b64}"
          export BACKEND_ENV_B64="${OCI_A1_BACKEND_ENV_B64}"
          export FRONTEND_ENV_B64="${OCI_A1_FRONTEND_ENV_B64:-}"
          export OCI_A1_CAPACITY_PROFILE_ENABLED="${OCI_A1_CAPACITY_PROFILE_ENABLED}"

          ops/deploy/oci/bluegreen-deploy.sh

      - name: Run production post-deploy smoke
        shell: bash
        run: tools/ops/production-postdeploy-smoke.sh

      - name: Dispatch production rollback guard
        if: failure() && steps.deployment.outputs.deployment_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          PRODUCTION_ROLLBACK_WEBHOOK_URL: ${{ secrets.PRODUCTION_ROLLBACK_WEBHOOK_URL }}
          PRODUCTION_ROLLBACK_TOKEN: ${{ secrets.PRODUCTION_ROLLBACK_TOKEN }}
          PRODUCTION_ROLLBACK_TARGET_SHA: ${{ secrets.PRODUCTION_ROLLBACK_TARGET_SHA }}
        shell: bash
        run: tools/ops/production-rollback-guard.sh

      - name: Mark production deployment success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(
            jq -n \
              --arg log_url "${PROMOTION_LOG_URL}" \
              '{
                state: "success",
                environment: "production",
                log_url: $log_url,
                auto_inactive: false
              }'
          )"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" --input - <<< "${payload}"

      - name: Mark production deployment failure
        if: failure() && steps.deployment.outputs.deployment_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(
            jq -n \
              --arg log_url "${PROMOTION_LOG_URL}" \
              '{
                state: "failure",
                environment: "production",
                log_url: $log_url,
                auto_inactive: false
              }'
          )"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" --input - <<< "${payload}"

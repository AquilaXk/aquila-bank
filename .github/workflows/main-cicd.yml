name: Main CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-cicd
  cancel-in-progress: false

jobs:
  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: back
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Run backend check
        run: ./gradlew check --no-daemon --stacktrace

  frontend-lint-build:
    name: Frontend Lint And Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: front/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Run frontend lint
        run: yarn lint

      - name: Run frontend build
        run: yarn build

  deploy:
    name: Deploy Main
    runs-on: ubuntu-latest
    needs:
      - backend-check
      - frontend-lint-build
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate deploy webhook configuration
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [[ -z "${DEPLOY_WEBHOOK_URL}" ]]; then
            echo "::error::repository Actions secret DEPLOY_WEBHOOK_URL을 설정하세요." >&2
            exit 1
          fi

      - name: Trigger deploy
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          auth_headers=()
          if [[ -n "${DEPLOY_WEBHOOK_TOKEN}" ]]; then
            auth_headers=(-H "Authorization: Bearer ${DEPLOY_WEBHOOK_TOKEN}")
          fi

          payload="$(jq -n \
            --arg sha "${TARGET_SHA}" \
            --arg ref "${TARGET_REF}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            '{sha: $sha, ref: $ref, repository: $repository}')"

          curl --fail --show-error --silent --location \
            -H "Content-Type: application/json" \
            "${auth_headers[@]}" \
            -d "${payload}" \
            "${DEPLOY_WEBHOOK_URL}"

name: Staging Deploy

on:
  workflow_run:
    workflows:
      - Main CI
    types:
      - completed

permissions:
  contents: read
  deployments: write
  packages: write

concurrency:
  group: staging-deploy
  cancel-in-progress: true

env:
  DEPLOY_TARGET_RUNTIME: oci-a1
  DEPLOY_DATABASE_BASELINE: oci-a1-postgres-100m
  BACKEND_IMAGE_NAME: aquila-bank-backend
  FRONTEND_IMAGE_NAME: aquila-bank-frontend

jobs:
  prepare:
    name: Resolve Main Deploy SHA
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_deploy: ${{ steps.validate.outputs.should_deploy }}
      deploy_sha: ${{ steps.validate.outputs.deploy_sha }}
      image_tag: ${{ steps.validate.outputs.image_tag }}
    steps:
      - name: Checkout deploy SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Validate main SHA
        id: validate
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "should_deploy=false" >> "${GITHUB_OUTPUT}"
          git fetch --no-tags --depth=1 origin main

          checked_out_sha="$(git rev-parse HEAD)"
          current_main_sha="$(git rev-parse origin/main)"

          if [ "${checked_out_sha}" != "${DEPLOY_SHA}" ]; then
            echo "::error::Checked out ${checked_out_sha}, expected ${DEPLOY_SHA}."
            exit 1
          fi

          # staging은 main 최신 SHA만 자동 배포하고, 오래된 CI 완료는 정상 race로 skip한다.
          if [ "${current_main_sha}" != "${DEPLOY_SHA}" ]; then
            echo "::notice::Skipping stale deploy SHA ${DEPLOY_SHA}; current origin/main is ${current_main_sha}."
            exit 0
          fi

          echo "should_deploy=true" >> "${GITHUB_OUTPUT}"
          echo "deploy_sha=${DEPLOY_SHA}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${DEPLOY_SHA:0:12}" >> "${GITHUB_OUTPUT}"

  record-noop:
    name: Record No-Op Staging Deploy
    needs:
      - prepare
    if: >-
      always() &&
      (
        needs.prepare.result == 'skipped' ||
        (
          needs.prepare.result == 'success' &&
          needs.prepare.outputs.should_deploy != 'true'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record no-op staging deploy
        env:
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          PREPARE_SHOULD_DEPLOY: ${{ needs.prepare.outputs.should_deploy }}
        shell: bash
        run: |
          set -euo pipefail
          reason="not-main-push-success"
          if [[ "${PREPARE_RESULT}" == "success" && "${PREPARE_SHOULD_DEPLOY}" != "true" ]]; then
            reason="stale-main-sha"
          fi

          {
            echo "## Staging Deploy No-Op"
            echo "- status: skipped"
            echo "- reason: ${reason}"
            echo "- prepare_result: ${PREPARE_RESULT}"
            echo "- prepare_should_deploy: ${PREPARE_SHOULD_DEPLOY:-unset}"
            echo "- workflow_run_conclusion: ${WORKFLOW_RUN_CONCLUSION}"
            echo "- workflow_run_head_branch: ${WORKFLOW_RUN_HEAD_BRANCH}"
            echo "- workflow_run_event: ${WORKFLOW_RUN_EVENT}"
            echo "- deployment_created: false"
            echo "- staging_success_recorded: false"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::notice::Staging deploy no-op reason=${reason}"

  create-deployment:
    name: Create Staging Deployment
    needs:
      - prepare
    if: needs.prepare.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deployment_id: ${{ steps.deployment.outputs.deployment_id }}
    steps:
      - name: Create staging deployment
        id: deployment
        env:
          DEPLOY_SHA: ${{ needs.prepare.outputs.deploy_sha }}
          DEPLOY_LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(
            jq -n \
              --arg ref "${DEPLOY_SHA}" \
              --arg description "Deploy main SHA ${DEPLOY_SHA} to staging" \
              '{
                ref: $ref,
                environment: "staging",
                description: $description,
                auto_merge: false,
                required_contexts: [],
                production_environment: false,
                transient_environment: false
              }'
          )"
          deployment_id="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments" --input - --jq ".id" <<< "${payload}")"

          if [ -z "${deployment_id}" ]; then
            echo "::error::Failed to create staging deployment."
            exit 1
          fi

          echo "deployment_id=${deployment_id}" >> "${GITHUB_OUTPUT}"

          status_payload="$(
            jq -n \
              --arg log_url "${DEPLOY_LOG_URL}" \
              '{
                state: "in_progress",
                environment: "staging",
                log_url: $log_url,
                auto_inactive: false
              }'
          )"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" --input - <<< "${status_payload}"

  backend-image:
    name: Build And Push Backend Image
    needs:
      - prepare
    if: needs.prepare.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
    steps:
      - name: Checkout deploy SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.deploy_sha }}
          fetch-depth: 0

      - name: Set up backend Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up backend Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build backend bootJar
        working-directory: back
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew bootJar --no-daemon --stacktrace

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve image names
        id: images
        shell: bash
        run: |
          set -euo pipefail
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          backend_image="ghcr.io/${owner_lc}/${BACKEND_IMAGE_NAME}"

          echo "BACKEND_IMAGE=${backend_image}" >> "${GITHUB_ENV}"
          echo "backend_image=${backend_image}" >> "${GITHUB_OUTPUT}"

      - name: Build and push backend image
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build ./back \
            --file ./back/Dockerfile.runtime \
            --platform linux/arm64 \
            --push \
            --tag "${BACKEND_IMAGE}:${IMAGE_TAG}" \
            --tag "${BACKEND_IMAGE}:main-latest" \
            --cache-from type=gha,scope=aquila-bank-backend \
            --cache-to type=gha,mode=max,scope=aquila-bank-backend

  frontend-image:
    name: Build And Push Frontend Image
    needs:
      - prepare
    if: needs.prepare.outputs.should_deploy == 'true'
    runs-on: [self-hosted, oci-a1-staging]
    timeout-minutes: 25
    environment:
      name: staging
    outputs:
      frontend_image: ${{ steps.images.outputs.frontend_image }}
    steps:
      - name: Checkout deploy SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.deploy_sha }}
          fetch-depth: 0

      - name: Resolve frontend staging public API URL
        env:
          OCI_A1_STAGING_ENV: ${{ secrets.OCI_A1_STAGING_ENV }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OCI_A1_STAGING_ENV}" ]]; then
            echo "::error::Missing OCI_A1_STAGING_ENV environment secret."
            exit 1
          fi

          staging_env_path="${RUNNER_TEMP}/oci-a1-staging-build.env"
          printf '%s\n' "${OCI_A1_STAGING_ENV}" >"${staging_env_path}"
          chmod 600 "${staging_env_path}"

          set -a
          source "${staging_env_path}"
          set +a

          NGINX_SERVER_NAME="${NGINX_SERVER_NAME:-bank.aquilaxk.site}"
          STAGING_BASE_URL="${STAGING_BASE_URL:-https://${NGINX_SERVER_NAME}}"
          STAGING_PUBLIC_API_BASE_URL="${STAGING_PUBLIC_API_BASE_URL:-${STAGING_BASE_URL:-}}"
          if [[ -z "${STAGING_PUBLIC_API_BASE_URL}" ]]; then
            echo "::error::STAGING_PUBLIC_API_BASE_URL or STAGING_BASE_URL is required."
            exit 1
          fi

          echo "::add-mask::${STAGING_PUBLIC_API_BASE_URL}"
          printf 'STAGING_PUBLIC_API_BASE_URL=%s\n' "${STAGING_PUBLIC_API_BASE_URL}" >>"${GITHUB_ENV}"

      - name: Check OCI self-hosted runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          ops/deploy/oci/check-self-hosted-runner.sh

      - name: Prepare frontend Docker config
        shell: bash
        run: |
          set -euo pipefail
          # self-hosted runner home의 .docker 권한 드리프트와 분리된 job-local Docker config.
          docker_config="${RUNNER_TEMP}/docker-config"
          mkdir -p "${docker_config}"
          chmod 700 "${docker_config}"
          printf 'DOCKER_CONFIG=%s\n' "${docker_config}" >>"${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve image names
        id: images
        shell: bash
        run: |
          set -euo pipefail
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          frontend_image="ghcr.io/${owner_lc}/${FRONTEND_IMAGE_NAME}"

          echo "FRONTEND_IMAGE=${frontend_image}" >> "${GITHUB_ENV}"
          echo "frontend_image=${frontend_image}" >> "${GITHUB_OUTPUT}"

      - name: Build and push frontend image
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build ./front \
            --platform linux/arm64 \
            --push \
            --build-arg "NEXT_PUBLIC_API_BASE_URL=${STAGING_PUBLIC_API_BASE_URL}" \
            --tag "${FRONTEND_IMAGE}:${IMAGE_TAG}" \
            --tag "${FRONTEND_IMAGE}:main-latest" \
            --cache-from type=gha,scope=aquila-bank-frontend \
            --cache-to type=gha,mode=max,scope=aquila-bank-frontend

  validate-latest-before-deploy:
    name: Validate Latest Main Before Deploy
    needs:
      - prepare
      - backend-image
      - frontend-image
    if: needs.prepare.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_deploy: ${{ steps.validate.outputs.should_deploy }}
    steps:
      - name: Checkout deploy SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.deploy_sha }}
          fetch-depth: 0

      - name: Validate latest main before deploy
        id: validate
        env:
          DEPLOY_SHA: ${{ needs.prepare.outputs.deploy_sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "should_deploy=false" >> "${GITHUB_OUTPUT}"
          git fetch --no-tags --depth=1 origin main

          current_main_sha="$(git rev-parse origin/main)"
          if [[ "${current_main_sha}" != "${DEPLOY_SHA}" ]]; then
            echo "::notice::Skipping stale deploy SHA ${DEPLOY_SHA}; current origin/main is ${current_main_sha}."
            exit 0
          fi

          echo "should_deploy=true" >> "${GITHUB_OUTPUT}"

  deploy-and-verify:
    name: Deploy And Verify On OCI A1
    needs:
      - prepare
      - create-deployment
      - backend-image
      - frontend-image
      - validate-latest-before-deploy
    if: needs.validate-latest-before-deploy.outputs.should_deploy == 'true'
    runs-on: [self-hosted, oci-a1-staging]
    timeout-minutes: 35
    environment:
      name: staging
    env:
      DEPLOY_SHA: ${{ needs.prepare.outputs.deploy_sha }}
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
      DEPLOY_LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BACKEND_IMAGE: ${{ needs.backend-image.outputs.backend_image }}
      FRONTEND_IMAGE: ${{ needs.frontend-image.outputs.frontend_image }}
    outputs:
      transaction_replay_result: ${{ steps.resolve-transaction-replay-result.outputs.result }}
      transaction_replay_required: ${{ steps.load-oci-a1-staging-env.outputs.transaction_replay_required }}
    steps:
      - name: Checkout deploy SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      - name: Load OCI A1 staging env
        id: load-oci-a1-staging-env
        env:
          OCI_A1_STAGING_ENV: ${{ secrets.OCI_A1_STAGING_ENV }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OCI_A1_STAGING_ENV}" ]]; then
            echo "::error::Missing OCI_A1_STAGING_ENV environment secret."
            exit 1
          fi

          staging_env_path="${RUNNER_TEMP}/oci-a1-staging.env"
          printf '%s\n' "${OCI_A1_STAGING_ENV}" >"${staging_env_path}"
          chmod 600 "${staging_env_path}"

          set -a
          # staging 설정은 GitHub Environment secret 하나에 shell env 파일 형식으로 보관한다.
          source "${staging_env_path}"
          set +a

          STAGING_PUBLIC_API_BASE_URL="${STAGING_PUBLIC_API_BASE_URL:-${STAGING_BASE_URL:-}}"
          STAGING_SMOKE_BASE_URL="${STAGING_SMOKE_BASE_URL:-${STAGING_LOCAL_BASE_URL:-http://127.0.0.1}}"
          STAGING_SMOKE_HEALTH_PATH="${STAGING_SMOKE_HEALTH_PATH:-/actuator/health}"
          STAGING_SMOKE_WRITE_METHOD="${STAGING_SMOKE_WRITE_METHOD:-POST}"
          STAGING_SMOKE_WRITE_BODY="${STAGING_SMOKE_WRITE_BODY:-{}}"
          STAGING_REPLAY_REQUIRED="${STAGING_REPLAY_REQUIRED:-false}"
          ALERTMANAGER_RECEIVER_SECRET_SMOKE_ENVIRONMENT=staging
          POSTGRES_CONTAINER_NAME="${POSTGRES_CONTAINER_NAME:-aquila-postgres}"
          POSTGRES_NETWORK_ALIAS="${POSTGRES_NETWORK_ALIAS:-aquila-postgres}"
          POSTGRES_HOST_BIND="${POSTGRES_HOST_BIND:-127.0.0.1:5432}"
          OCI_A1_STORAGE_MOUNT_PATH="${OCI_A1_STORAGE_MOUNT_PATH:-/var/lib/aquila-data}"
          OCI_A1_STORAGE_MIN_USABLE_GIB="${OCI_A1_STORAGE_MIN_USABLE_GIB:-140}"
          OCI_A1_CAPACITY_PROFILE_ENABLED="${OCI_A1_CAPACITY_PROFILE_ENABLED:-true}"
          NGINX_SERVER_NAME="${NGINX_SERVER_NAME:-bank.aquilaxk.site}"
          NGINX_ENABLE_HTTPS="${NGINX_ENABLE_HTTPS:-auto}"
          NGINX_SSL_CERTIFICATE_PATH="${NGINX_SSL_CERTIFICATE_PATH:-/etc/letsencrypt/live/${NGINX_SERVER_NAME}/fullchain.pem}"
          NGINX_SSL_CERTIFICATE_KEY_PATH="${NGINX_SSL_CERTIFICATE_KEY_PATH:-/etc/letsencrypt/live/${NGINX_SERVER_NAME}/privkey.pem}"
          NGINX_SSL_MOUNT_PATH="${NGINX_SSL_MOUNT_PATH:-/etc/letsencrypt}"
          NGINX_ACME_CHALLENGE_ROOT="${NGINX_ACME_CHALLENGE_ROOT:-/var/www/certbot}"
          NGINX_HSTS_MAX_AGE_SECONDS="${NGINX_HSTS_MAX_AGE_SECONDS:-31536000}"
          STAGING_BASE_URL="${STAGING_BASE_URL:-https://${NGINX_SERVER_NAME}}"
          STAGING_PUBLIC_API_BASE_URL="${STAGING_PUBLIC_API_BASE_URL:-${STAGING_BASE_URL}}"
          STAGING_PUBLIC_BASE_URL="${STAGING_PUBLIC_BASE_URL:-https://${NGINX_SERVER_NAME}}"
          STAGING_PUBLIC_EDGE_SMOKE_ENABLED="${STAGING_PUBLIC_EDGE_SMOKE_ENABLED:-true}"
          STAGING_PUBLIC_FRONTEND_SMOKE_ENABLED="${STAGING_PUBLIC_FRONTEND_SMOKE_ENABLED:-true}"

          HOT_ACCOUNT_ID="${STAGING_REPLAY_HOT_ACCOUNT_ID:-${HOT_ACCOUNT_ID:-}}"
          HOT_FROM="${STAGING_REPLAY_HOT_FROM:-${HOT_FROM:-}}"
          HOT_TO="${STAGING_REPLAY_HOT_TO:-${HOT_TO:-}}"
          COLD_ACCOUNT_ID="${STAGING_REPLAY_COLD_ACCOUNT_ID:-${COLD_ACCOUNT_ID:-}}"
          COLD_FROM="${STAGING_REPLAY_COLD_FROM:-${COLD_FROM:-}}"
          COLD_TO="${STAGING_REPLAY_COLD_TO:-${COLD_TO:-}}"
          ITERATIONS="${STAGING_REPLAY_ITERATIONS:-${ITERATIONS:-}}"
          PAGE_LIMIT="${STAGING_REPLAY_PAGE_LIMIT:-${PAGE_LIMIT:-}}"
          REQUEST_TIMEOUT_SECONDS="${STAGING_REPLAY_REQUEST_TIMEOUT_SECONDS:-${REQUEST_TIMEOUT_SECONDS:-}}"
          EXPECTED_TOTAL_ROWS="${STAGING_REPLAY_EXPECTED_TOTAL_ROWS:-${EXPECTED_TOTAL_ROWS:-}}"
          HOT_P95_THRESHOLD_MS="${STAGING_REPLAY_HOT_P95_THRESHOLD_MS:-${HOT_P95_THRESHOLD_MS:-}}"
          COLD_P95_THRESHOLD_MS="${STAGING_REPLAY_COLD_P95_THRESHOLD_MS:-${COLD_P95_THRESHOLD_MS:-}}"
          PLANNER_STATS_MAX_AGE_HOURS="${STAGING_REPLAY_STATS_MAX_AGE_HOURS:-${PLANNER_STATS_MAX_AGE_HOURS:-}}"
          PLANNER_STATS_MAX_MODIFIED_RATIO="${STAGING_REPLAY_STATS_MAX_MODIFIED_RATIO:-${PLANNER_STATS_MAX_MODIFIED_RATIO:-}}"

          case "${STAGING_REPLAY_REQUIRED}" in
            true|false) ;;
            *) echo "::error::STAGING_REPLAY_REQUIRED must be true or false."; exit 1 ;;
          esac
          printf 'transaction_replay_required=%s\n' "${STAGING_REPLAY_REQUIRED}" >>"${GITHUB_OUTPUT}"

          replay_missing=()
          [[ -z "${STAGING_REPLAY_TOKEN:-}" ]] && replay_missing+=("STAGING_REPLAY_TOKEN")
          [[ -z "${STAGING_OCI_A1_DATABASE_URL:-}" && -z "${OCI_A1_BACKEND_ENV_B64:-}" ]] && replay_missing+=("STAGING_OCI_A1_DATABASE_URL")
          [[ -z "${HOT_ACCOUNT_ID}" ]] && replay_missing+=("STAGING_REPLAY_HOT_ACCOUNT_ID")
          [[ -z "${HOT_FROM}" ]] && replay_missing+=("STAGING_REPLAY_HOT_FROM")
          [[ -z "${HOT_TO}" ]] && replay_missing+=("STAGING_REPLAY_HOT_TO")
          [[ -z "${COLD_ACCOUNT_ID}" ]] && replay_missing+=("STAGING_REPLAY_COLD_ACCOUNT_ID")
          [[ -z "${COLD_FROM}" ]] && replay_missing+=("STAGING_REPLAY_COLD_FROM")
          [[ -z "${COLD_TO}" ]] && replay_missing+=("STAGING_REPLAY_COLD_TO")

          STAGING_REPLAY_ENABLED="${STAGING_REPLAY_ENABLED:-}"
          if [[ -z "${STAGING_REPLAY_ENABLED}" ]]; then
            if (( ${#replay_missing[@]} == 0 )); then
              STAGING_REPLAY_ENABLED=true
            else
              STAGING_REPLAY_ENABLED=false
            fi
          fi
          case "${STAGING_REPLAY_ENABLED}" in
            true|false) ;;
            *) echo "::error::STAGING_REPLAY_ENABLED must be true or false."; exit 1 ;;
          esac
          if [[ "${STAGING_REPLAY_REQUIRED}" == "true" && "${STAGING_REPLAY_ENABLED}" != "true" ]]; then
            printf '::error::Missing required staging replay keys: %s\n' "${replay_missing[*]}"
            exit 1
          fi
          if [[ "${STAGING_REPLAY_ENABLED}" != "true" && ${#replay_missing[@]} -gt 0 ]]; then
            printf '::notice::Staging replay disabled; missing keys: %s\n' "${replay_missing[*]}"
          fi

          missing=()
          [[ -z "${OCI_A1_BACKEND_ENV_B64:-}" ]] && missing+=("OCI_A1_BACKEND_ENV_B64")
          [[ -z "${STAGING_BASE_URL:-}" ]] && missing+=("STAGING_BASE_URL")
          [[ -z "${STAGING_SMOKE_READ_PATH:-}" ]] && missing+=("STAGING_SMOKE_READ_PATH")
          [[ -z "${STAGING_SMOKE_WRITE_PATH:-}" ]] && missing+=("STAGING_SMOKE_WRITE_PATH")

          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing OCI A1 staging env keys: %s\n' "${missing[*]}"
            exit 1
          fi

          env_names=(
            OCI_A1_BACKEND_ENV_B64
            OCI_A1_FRONTEND_ENV_B64
            STAGING_PUBLIC_API_BASE_URL
            STAGING_PUBLIC_BASE_URL
            STAGING_PUBLIC_EDGE_SMOKE_ENABLED
            STAGING_PUBLIC_FRONTEND_SMOKE_ENABLED
            STAGING_BASE_URL
            STAGING_SMOKE_BASE_URL
            STAGING_SMOKE_HEALTH_PATH
            STAGING_SMOKE_READ_PATH
            STAGING_SMOKE_WRITE_PATH
            STAGING_SMOKE_WRITE_METHOD
            STAGING_SMOKE_WRITE_BODY
            STAGING_SMOKE_AUTH_HEADER_NAME
            STAGING_SMOKE_AUTH_HEADER_VALUE
            STAGING_REPLAY_ENABLED
            STAGING_REPLAY_REQUIRED
            STAGING_REPLAY_TOKEN
            STAGING_OCI_A1_DATABASE_URL
            STAGING_RDS_DATABASE_URL
            HOT_ACCOUNT_ID
            HOT_FROM
            HOT_TO
            COLD_ACCOUNT_ID
            COLD_FROM
            COLD_TO
            STAGING_REPLAY_USER_ID
            STAGING_REPLAY_LOGIN_ID
            STAGING_REPLAY_USER_PASSWORD_HASH
            STAGING_REPLAY_USER_DISPLAY_NAME
            STAGING_REPLAY_HOT_ACCOUNT_NUMBER
            STAGING_REPLAY_COLD_ACCOUNT_NUMBER
            POSTGRES_CONTAINER_NAME
            POSTGRES_NETWORK_ALIAS
            POSTGRES_HOST_BIND
            OCI_A1_STORAGE_MOUNT_PATH
            OCI_A1_STORAGE_MIN_USABLE_GIB
            OCI_A1_CAPACITY_PROFILE_ENABLED
            NGINX_ENABLE_HTTPS
            NGINX_SERVER_NAME
            NGINX_SSL_CERTIFICATE_PATH
            NGINX_SSL_CERTIFICATE_KEY_PATH
            NGINX_SSL_MOUNT_PATH
            NGINX_ACME_CHALLENGE_ROOT
            NGINX_HSTS_MAX_AGE_SECONDS
            ITERATIONS
            PAGE_LIMIT
            REQUEST_TIMEOUT_SECONDS
            EXPECTED_TOTAL_ROWS
            HOT_P95_THRESHOLD_MS
            COLD_P95_THRESHOLD_MS
            PLANNER_STATS_MAX_AGE_HOURS
            PLANNER_STATS_MAX_MODIFIED_RATIO
            ALERTMANAGER_RECEIVER_SECRET_SMOKE_ENVIRONMENT
            ALERTMANAGER_RECEIVER_SLACK_ENABLED
            ALERTMANAGER_RECEIVER_SLACK_WEBHOOK_URL
            ALERTMANAGER_RECEIVER_PAGERDUTY_ENABLED
            ALERTMANAGER_RECEIVER_PAGERDUTY_ROUTING_KEY
            ALERTMANAGER_RECEIVER_WEBHOOK_ENABLED
            ALERTMANAGER_RECEIVER_WEBHOOK_URL
            ALERTMANAGER_RECEIVER_TELEGRAM_ENABLED
            ALERTMANAGER_RECEIVER_TELEGRAM_BOT_TOKEN
            ALERTMANAGER_RECEIVER_TELEGRAM_CHAT_ID
            STAGING_ROLLBACK_WEBHOOK_URL
            STAGING_ROLLBACK_TOKEN
          )

          for name in "${env_names[@]}"; do
            value="${!name:-}"
            if [[ -n "${value}" ]]; then
              echo "::add-mask::${value}"
            fi
            if [[ "${value}" == *$'\n'* ]]; then
              delimiter="AQUILA_${name}_EOF_$(date +%s%N)"
              {
                printf '%s<<%s\n' "${name}" "${delimiter}"
                printf '%s\n' "${value}"
                printf '%s\n' "${delimiter}"
              } >>"${GITHUB_ENV}"
            else
              printf '%s=%s\n' "${name}" "${value}" >>"${GITHUB_ENV}"
            fi
          done

      - name: Check OCI self-hosted runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          ops/deploy/oci/check-self-hosted-runner.sh

      - name: Resolve OCI A1 staging database URL
        shell: bash
        run: |
          set -euo pipefail
          # backend env가 Docker alias DB를 쓰면 host psql용 URL은 배포 시점에 재산출한다.
          if [[ "${STAGING_REPLAY_ENABLED}" != "true" ]]; then
            echo "::notice::Staging replay disabled; skip staging database URL resolution."
            exit 0
          fi
          if ! resolved_database_url="$(tools/ops/resolve-oci-a1-staging-database-url.sh)"; then
            if [[ "${STAGING_REPLAY_REQUIRED}" == "true" ]]; then
              echo "::error::Failed to resolve required staging replay database URL."
              exit 1
            fi
            echo "::notice::Failed to resolve staging replay database URL; optional replay will be skipped."
            printf 'STAGING_REPLAY_ENABLED=false\n' >>"${GITHUB_ENV}"
            exit 0
          fi
          echo "::add-mask::${resolved_database_url}"
          printf 'STAGING_OCI_A1_DATABASE_URL=%s\n' "${resolved_database_url}" >>"${GITHUB_ENV}"

      - name: Run Alertmanager receiver secret smoke
        shell: bash
        run: |
          set -euo pipefail
          tools/ops/validate-alertmanager-receiver-secrets.sh

      - name: Run OCI A1 blue-green deploy locally
        env:
          GITHUB_ACTOR_VALUE: ${{ github.actor }}
          GITHUB_TOKEN_VALUE: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          github_token_b64="$(printf '%s' "${GITHUB_TOKEN_VALUE}" | base64 -w0)"

          export GITHUB_ACTOR="${GITHUB_ACTOR_VALUE}"
          export GITHUB_TOKEN_B64="${github_token_b64}"
          export BACKEND_ENV_B64="${OCI_A1_BACKEND_ENV_B64}"
          export FRONTEND_ENV_B64="${OCI_A1_FRONTEND_ENV_B64:-}"
          export OCI_A1_CAPACITY_PROFILE_ENABLED="${OCI_A1_CAPACITY_PROFILE_ENABLED}"

          ops/deploy/oci/bluegreen-deploy.sh

      - name: Ensure staging fixture principal
        if: env.STAGING_REPLAY_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tools/ops/staging-fixture-principal-bootstrap.sh

      - name: Run staging post-deploy smoke
        shell: bash
        run: |
          set -euo pipefail
          tools/ops/staging-postdeploy-smoke.sh

      - name: Run public edge bot guard smoke
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${STAGING_PUBLIC_EDGE_SMOKE_ENABLED}" != "true" ]]; then
            echo "::notice::Public edge bot guard smoke skipped."
            exit 0
          fi
          PUBLIC_EDGE_BASE_URL="${STAGING_PUBLIC_BASE_URL}" \
            PUBLIC_EDGE_EXPECT_HSTS=true \
            tools/test/check-public-edge-bot-guard-live.sh

      - name: Run public frontend live smoke
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${STAGING_PUBLIC_FRONTEND_SMOKE_ENABLED}" != "true" ]]; then
            echo "::notice::Public frontend live smoke skipped."
            exit 0
          fi
          PUBLIC_FRONTEND_BASE_URL="${STAGING_PUBLIC_BASE_URL}" \
            PUBLIC_FRONTEND_EXPECT_HSTS=true \
            tools/test/check-public-frontend-live-smoke.sh

      - name: Validate OCI A1 storage baseline
        shell: bash
        run: |
          set -euo pipefail
          tools/ops/validate-oci-a1-storage-baseline.sh

      - name: Run transaction replay regression gate
        id: transaction_replay
        if: env.STAGING_REPLAY_ENABLED == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          tools/ops/transaction-read-model-staging-replay.sh

      - name: Resolve transaction replay result
        id: resolve-transaction-replay-result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${STAGING_REPLAY_ENABLED}" != "true" ]]; then
            result=skipped
          elif [[ "${{ steps.transaction_replay.outcome }}" == "success" ]]; then
            result=success
          else
            result=failure
          fi
          echo "::notice::Transaction replay result=${result}"
          printf 'result=%s\n' "${result}" >>"${GITHUB_OUTPUT}"

      - name: Append transaction replay summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary_path="build/reports/transaction-staging-replay/summary.md"
          if [[ -f "${summary_path}" ]]; then
            cat "${summary_path}" >>"${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload transaction replay report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: transaction-read-model-staging-replay
          path: build/reports/transaction-staging-replay/
          if-no-files-found: ignore

  finalize-deployment:
    name: Finalize Staging Deployment
    needs:
      - prepare
      - create-deployment
      - backend-image
      - frontend-image
      - validate-latest-before-deploy
      - deploy-and-verify
    if: >-
      always() &&
      needs.prepare.outputs.should_deploy == 'true' &&
      needs.create-deployment.outputs.deployment_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
    env:
      DEPLOY_SHA: ${{ needs.prepare.outputs.deploy_sha }}
      DEPLOY_LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DEPLOYMENT_ID: ${{ needs.create-deployment.outputs.deployment_id }}
      DEPLOY_RESULT: ${{ needs.deploy-and-verify.result }}
      TRANSACTION_REPLAY_RESULT: ${{ needs.deploy-and-verify.outputs.transaction_replay_result }}
      TRANSACTION_REPLAY_REQUIRED: ${{ needs.deploy-and-verify.outputs.transaction_replay_required }}
      BACKEND_IMAGE_RESULT: ${{ needs.backend-image.result }}
      FRONTEND_IMAGE_RESULT: ${{ needs.frontend-image.result }}
      LATEST_MAIN_RESULT: ${{ needs.validate-latest-before-deploy.result }}
      LATEST_MAIN_SHOULD_DEPLOY: ${{ needs.validate-latest-before-deploy.outputs.should_deploy }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout deploy SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      - name: Load OCI A1 rollback env
        if: needs.validate-latest-before-deploy.outputs.should_deploy == 'true' && needs.deploy-and-verify.result == 'failure'
        env:
          OCI_A1_STAGING_ENV: ${{ secrets.OCI_A1_STAGING_ENV }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OCI_A1_STAGING_ENV}" ]]; then
            echo "::warning::Missing OCI_A1_STAGING_ENV; rollback hook cannot be loaded."
            exit 0
          fi

          staging_env_path="${RUNNER_TEMP}/oci-a1-staging-finalize.env"
          printf '%s\n' "${OCI_A1_STAGING_ENV}" >"${staging_env_path}"
          chmod 600 "${staging_env_path}"

          set -a
          source "${staging_env_path}"
          set +a

          for name in STAGING_ROLLBACK_WEBHOOK_URL STAGING_ROLLBACK_TOKEN; do
            value="${!name:-}"
            if [[ -n "${value}" ]]; then
              echo "::add-mask::${value}"
            fi
            printf '%s=%s\n' "${name}" "${value}" >>"${GITHUB_ENV}"
          done

      - name: Dispatch staging rollback guard
        if: always() && needs.validate-latest-before-deploy.outputs.should_deploy == 'true' && needs.deploy-and-verify.result == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          tools/ops/staging-rollback-guard.sh

      - name: Record staging 100m replay evidence
        if: always() && needs.validate-latest-before-deploy.outputs.should_deploy == 'true' && needs.deploy-and-verify.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          replay_result="${TRANSACTION_REPLAY_RESULT:-skipped}"
          replay_state=failure
          if [[ "${replay_result}" == "success" ]]; then
            replay_state=success
          fi

          payload="$(
            jq -n \
              --arg ref "${DEPLOY_SHA}" \
              --arg description "Record staging 100m replay evidence for ${DEPLOY_SHA}" \
              '{
                ref: $ref,
                environment: "staging-100m-replay",
                description: $description,
                auto_merge: false,
                required_contexts: [],
                production_environment: false,
                transient_environment: false
              }'
          )"
          if ! replay_deployment_id="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments" --input - --jq ".id" <<< "${payload}")"; then
            echo "::warning::Failed to create staging 100m replay evidence deployment."
            exit 0
          fi

          status_payload="$(
            jq -n \
              --arg state "${replay_state}" \
              --arg log_url "${DEPLOY_LOG_URL}" \
              --arg description "transaction replay ${replay_result}" \
              '{
                state: $state,
                environment: "staging-100m-replay",
                log_url: $log_url,
                description: $description,
                auto_inactive: false
              }'
          )"
          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${replay_deployment_id}/statuses" --input - <<< "${status_payload}"; then
            echo "::warning::Failed to record staging 100m replay evidence status."
          fi

      - name: Mark staging deployment success
        if: >-
          always() &&
          needs.validate-latest-before-deploy.outputs.should_deploy == 'true' &&
          needs.deploy-and-verify.result == 'success' &&
          (
            needs.deploy-and-verify.outputs.transaction_replay_result != 'failure' ||
            needs.deploy-and-verify.outputs.transaction_replay_required != 'true'
          )
        shell: bash
        run: |
          set -euo pipefail
          payload="$(
            jq -n \
              --arg log_url "${DEPLOY_LOG_URL}" \
              '{
                state: "success",
                environment: "staging",
                log_url: $log_url,
                auto_inactive: false
              }'
          )"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" --input - <<< "${payload}"

      - name: Mark stale staging deployment inactive
        if: >-
          always() &&
          needs.backend-image.result == 'success' &&
          needs.frontend-image.result == 'success' &&
          needs.validate-latest-before-deploy.outputs.should_deploy == 'false'
        shell: bash
        run: |
          set -euo pipefail
          payload="$(
            jq -n \
              --arg log_url "${DEPLOY_LOG_URL}" \
              '{
                state: "inactive",
                environment: "staging",
                log_url: $log_url,
                auto_inactive: false
              }'
          )"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" --input - <<< "${payload}"

      - name: Mark staging deployment failure
        if: >-
          always() &&
          (
            needs.backend-image.result != 'success' ||
            needs.frontend-image.result != 'success' ||
            (
              needs.deploy-and-verify.outputs.transaction_replay_required == 'true' &&
              needs.deploy-and-verify.outputs.transaction_replay_result == 'failure'
            ) ||
            (
              needs.validate-latest-before-deploy.outputs.should_deploy == 'true' &&
              needs.deploy-and-verify.result != 'success'
            )
          )
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Staging deployment failed. backend_image=${BACKEND_IMAGE_RESULT} frontend_image=${FRONTEND_IMAGE_RESULT} latest_main=${LATEST_MAIN_RESULT}/${LATEST_MAIN_SHOULD_DEPLOY} deploy=${DEPLOY_RESULT} replay=${TRANSACTION_REPLAY_RESULT} replay_required=${TRANSACTION_REPLAY_REQUIRED}"
          payload="$(
            jq -n \
              --arg log_url "${DEPLOY_LOG_URL}" \
              '{
                state: "failure",
                environment: "staging",
                log_url: $log_url,
                auto_inactive: false
              }'
          )"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" --input - <<< "${payload}"
          exit 1

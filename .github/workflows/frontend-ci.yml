name: Frontend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "front/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-lint-build:
    name: Frontend Lint And Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: front/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Run frontend lint
        run: yarn lint

      - name: Run frontend API parity contract
        run: yarn test:api-parity

      - name: Run frontend build
        run: yarn build

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      - name: Run live artifact smoke
        run: yarn test:e2e:live-artifacts

      - name: Upload frontend visual artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-live-visual-artifacts
          path: |
            front/test-results/**/*.png
            front/test-results/**/error-context.md
            front/playwright-report/**
          retention-days: 14

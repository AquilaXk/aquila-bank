name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "back/**"
      - "tools/ci/**"
      - "tools/test/**"
      - ".github/workflows/**"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: back
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Run backend check
        run: ./gradlew test jacocoFullTestReport check --no-daemon --stacktrace

      - name: Comment Jacoco coverage summary
        if: always() && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('back/build/reports/jacoco/full/jacocoFullTestReport.xml') != ''
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          summary_file="${RUNNER_TEMP}/jacoco-summary.md"
          comments_file="${RUNNER_TEMP}/pr-comments.json"
          changed_files="${RUNNER_TEMP}/changed-files.txt"

          git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" > "${changed_files}"

          python3 tools/ci/comment-jacoco-summary.py \
            back/build/reports/jacoco/full/jacocoFullTestReport.xml \
            back/config/jacoco-coverage-baseline-excludes.txt \
            --changed-files "${changed_files}" \
            > "${summary_file}"

          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate > "${comments_file}"
          comment_id="$(
            python3 -c 'import json, sys; marker = "<!-- aquila-bank:jacoco-coverage-summary -->"; comments = json.load(open(sys.argv[1], encoding="utf-8")); print(next((item["id"] for item in comments if marker in item.get("body", "")), ""))' "${comments_file}"
          )"

          body="$(cat "${summary_file}")"
          if [[ -n "${comment_id}" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --field body="${body}"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --field body="${body}"
          fi

          cat "${summary_file}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Jacoco full report
        if: always() && hashFiles('back/build/reports/jacoco/full/jacocoFullTestReport.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-full-report
          path: |
            back/build/reports/jacoco/full/jacocoFullTestReport.xml
            back/build/reports/jacoco/full/html
          if-no-files-found: error

      - name: Run transaction query plan regression gate
        working-directory: ${{ github.workspace }}
        run: tools/test/run-transaction-query-plan-regression-gate.sh

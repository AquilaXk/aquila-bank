name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "back/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "back/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: back
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Run backend check
        run: ./gradlew check --no-daemon --stacktrace

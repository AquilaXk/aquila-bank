name: Transaction Read Mixed Workload Live Evidence

on:
  workflow_dispatch:
    inputs:
      evidence_manifest_tsv:
        description: "OCI mixed-workload-30m evidence manifest TSV path on the self-hosted runner"
        required: false
        type: string
      report_name:
        description: "Optional mixed workload evidence report name"
        required: false
        type: string
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/transaction-read-mixed-workload-live-evidence.yml"
      - "ops/k6/transaction-read-mixed-workload-100m.js"
      - "tools/ops/staging-fixture-principal-bootstrap.sh"
      - "tools/ops/issue-staging-replay-token.py"
      - "tools/ops/resolve-oci-a1-staging-database-url.sh"
      - "tools/test/check-issue-staging-replay-token.py"
      - "tools/test/run-staging-fixture-principal-bootstrap-contract.sh"
      - "tools/test/run-transaction-read-mixed-workload-oci-k6.sh"
      - "tools/test/check-transaction-read-mixed-workload-oci-k6.sh"
      - "tools/test/check-transaction-read-mixed-workload-live-evidence-workflow.sh"
      - "tools/test/run-transaction-read-mixed-workload-live-evidence-autogen.sh"
      - "tools/test/check-transaction-read-mixed-workload-live-evidence-autogen.sh"
      - "tools/test/run-transaction-read-mixed-workload-30m-timeline.sh"
      - "tools/test/check-transaction-read-mixed-workload-30m-timeline.sh"
      - "tools/test/run-transaction-read-oci-evidence-execution-gate.sh"
      - "tools/test/check-transaction-read-oci-evidence-execution-gate.sh"
      - "tools/test/run-transaction-read-evidence-completeness-gate.sh"
      - "tools/test/check-transaction-read-evidence-completeness-gate.sh"

permissions:
  contents: read

concurrency:
  group: transaction-read-mixed-workload-live-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: mixed workload live evidence contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check mixed workload live evidence workflow
        run: bash tools/test/check-transaction-read-mixed-workload-live-evidence-workflow.sh

      - name: Check staging fixture principal contract
        run: bash tools/test/run-staging-fixture-principal-bootstrap-contract.sh

      - name: Check staging replay token issuer contract
        run: python3 tools/test/check-issue-staging-replay-token.py

      - name: Check OCI mixed workload k6 runner contract
        run: bash tools/test/check-transaction-read-mixed-workload-oci-k6.sh

      - name: Check mixed workload live evidence autogen contract
        run: bash tools/test/check-transaction-read-mixed-workload-live-evidence-autogen.sh

      - name: Check mixed workload 30m timeline contract
        run: bash tools/test/check-transaction-read-mixed-workload-30m-timeline.sh

      - name: Check OCI evidence execution gate contract
        run: bash tools/test/check-transaction-read-oci-evidence-execution-gate.sh

      - name: Check evidence completeness gate contract
        run: bash tools/test/check-transaction-read-evidence-completeness-gate.sh

  live-evidence:
    name: Mixed Workload Live Evidence Gate
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, oci-a1-staging]
    timeout-minutes: 45
    environment:
      name: staging
    env:
      OCI_A1_STAGING_ENV: ${{ secrets.OCI_A1_STAGING_ENV }}
      MIXED_WORKLOAD_LIVE_NAME: ${{ inputs.report_name || format('transaction-read-mixed-workload-live-evidence-{0}', github.run_id) }}
      MIXED_WORKLOAD_EVIDENCE_MANIFEST_TSV_INPUT: ${{ inputs.evidence_manifest_tsv }}
      MIXED_WORKLOAD_EVIDENCE_MANIFEST_TSV_VAR: ${{ vars.OCI_MIXED_WORKLOAD_EVIDENCE_MANIFEST_TSV }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve mixed workload evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${MIXED_WORKLOAD_LIVE_NAME}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::MIXED_WORKLOAD_LIVE_NAME must contain only letters, numbers, dot, underscore, or hyphen."
            exit 1
          fi

          report_dir="build/reports/k6/${MIXED_WORKLOAD_LIVE_NAME}"
          mkdir -p "${report_dir}"

          if [[ -n "${OCI_A1_STAGING_ENV}" ]]; then
            staging_env_path="${RUNNER_TEMP}/oci-mixed-workload-live-evidence.env"
            printf '%s\n' "${OCI_A1_STAGING_ENV}" >"${staging_env_path}"
            chmod 600 "${staging_env_path}"

            set -a
            # 기존 live evidence와 같은 staging env contract만 사용하고 secret 값은 artifact에 남기지 않는다.
            source "${staging_env_path}"
            set +a
          fi

          staging_db_env_names=(
            OCI_A1_BACKEND_ENV_B64
            STAGING_OCI_A1_DATABASE_URL
            POSTGRES_CONTAINER_NAME
            POSTGRES_NETWORK_ALIAS
            POSTGRES_HOST_BIND
          )
          for name in "${staging_db_env_names[@]}"; do
            value="${!name:-}"
            if [[ -n "${value}" ]]; then
              case "${name}" in
                *_ENV_B64|*DATABASE_URL)
                  echo "::add-mask::${value}"
                  ;;
              esac
              printf '%s=%s\n' "${name}" "${value}" >>"${GITHUB_ENV}"
            fi
          done

          MIXED_WORKLOAD_EVIDENCE_MANIFEST_TSV="${MIXED_WORKLOAD_EVIDENCE_MANIFEST_TSV_INPUT:-${MIXED_WORKLOAD_EVIDENCE_MANIFEST_TSV:-${MIXED_WORKLOAD_EVIDENCE_MANIFEST_TSV_VAR:-}}}"
          MIXED_WORKLOAD_EVIDENCE_READY=true
          if [[ -z "${MIXED_WORKLOAD_EVIDENCE_MANIFEST_TSV}" ]]; then
            MIXED_WORKLOAD_EVIDENCE_READY=false
          fi
          MIXED_WORKLOAD_OCI_DOCKER_CONTEXT="${MIXED_WORKLOAD_OCI_DOCKER_CONTEXT:-${K6_DOCKER_CONTEXT:-${CAPACITY_K6_DOCKER_CONTEXT:-default}}}"
          MIXED_WORKLOAD_OCI_BASE_URL="${MIXED_WORKLOAD_OCI_BASE_URL:-${K6_REMOTE_BASE_URL:-${CAPACITY_K6_REMOTE_BASE_URL:-${STAGING_BASE_URL:-}}}}"
          MIXED_WORKLOAD_OCI_REMOTE_WORKDIR="${MIXED_WORKLOAD_OCI_REMOTE_WORKDIR:-${K6_REMOTE_WORKDIR:-${CAPACITY_K6_REMOTE_WORKDIR:-${GITHUB_WORKSPACE}}}}"
          MIXED_WORKLOAD_OCI_HOT_ACCOUNT_ID="${MIXED_WORKLOAD_OCI_HOT_ACCOUNT_ID:-${K6_HOT_ACCOUNT_ID:-910000001}}"
          MIXED_WORKLOAD_OCI_HOT_FROM="${MIXED_WORKLOAD_OCI_HOT_FROM:-${K6_HOT_FROM:-2026-04-01T00:00:00Z}}"
          MIXED_WORKLOAD_OCI_HOT_TO="${MIXED_WORKLOAD_OCI_HOT_TO:-${K6_HOT_TO:-2026-04-30T00:00:00Z}}"
          MIXED_WORKLOAD_OCI_COLD_ACCOUNT_ID="${MIXED_WORKLOAD_OCI_COLD_ACCOUNT_ID:-${K6_COLD_ACCOUNT_ID:-910000002}}"
          MIXED_WORKLOAD_OCI_COLD_FROM="${MIXED_WORKLOAD_OCI_COLD_FROM:-${K6_COLD_FROM:-2026-01-01T00:00:00Z}}"
          MIXED_WORKLOAD_OCI_COLD_TO="${MIXED_WORKLOAD_OCI_COLD_TO:-${K6_COLD_TO:-2026-01-31T00:00:00Z}}"
          MIXED_WORKLOAD_OCI_WRITE_SOURCE_ACCOUNT_ID="${MIXED_WORKLOAD_OCI_WRITE_SOURCE_ACCOUNT_ID:-${K6_WRITE_SOURCE_ACCOUNT_ID:-920000001}}"
          MIXED_WORKLOAD_OCI_WRITE_TARGET_ACCOUNT_ID="${MIXED_WORKLOAD_OCI_WRITE_TARGET_ACCOUNT_ID:-${K6_WRITE_TARGET_ACCOUNT_ID:-920000002}}"

          mixed_workload_auth_token_file="${RUNNER_TEMP}/mixed-workload-live-auth-token"
          if [[ -n "${OCI_A1_BACKEND_ENV_B64:-}" ]]; then
            STAGING_REPLAY_TOKEN_OUTPUT_FILE="${mixed_workload_auth_token_file}" \
            STAGING_REPLAY_TOKEN_TTL_SECONDS="${MIXED_WORKLOAD_REPLAY_TOKEN_TTL_SECONDS:-7200}" \
              python3 tools/ops/issue-staging-replay-token.py
            mixed_workload_auth_token="$(<"${mixed_workload_auth_token_file}")"
            printf '::add-mask::%s\n' "${mixed_workload_auth_token}"
            printf 'MIXED_WORKLOAD_OCI_AUTH_TOKEN_FILE=%s\n' "${mixed_workload_auth_token_file}" >>"${GITHUB_ENV}"
          elif [[ -n "${STAGING_REPLAY_TOKEN:-}" ]]; then
            printf '::add-mask::%s\n' "${STAGING_REPLAY_TOKEN}"
            printf '%s' "${STAGING_REPLAY_TOKEN}" >"${mixed_workload_auth_token_file}"
            chmod 600 "${mixed_workload_auth_token_file}"
            printf 'MIXED_WORKLOAD_OCI_AUTH_TOKEN_FILE=%s\n' "${mixed_workload_auth_token_file}" >>"${GITHUB_ENV}"
          fi

          printf 'MIXED_WORKLOAD_LIVE_OUTPUT_DIR=%s\n' "${report_dir}" >>"${GITHUB_ENV}"
          printf 'MIXED_WORKLOAD_EVIDENCE_MANIFEST_TSV=%s\n' "${MIXED_WORKLOAD_EVIDENCE_MANIFEST_TSV}" >>"${GITHUB_ENV}"
          printf 'MIXED_WORKLOAD_EVIDENCE_READY=%s\n' "${MIXED_WORKLOAD_EVIDENCE_READY}" >>"${GITHUB_ENV}"
          printf 'MIXED_WORKLOAD_OCI_NAME=%s\n' "${MIXED_WORKLOAD_LIVE_NAME}" >>"${GITHUB_ENV}"
          printf 'MIXED_WORKLOAD_OCI_RUN_ID=%s\n' "${MIXED_WORKLOAD_LIVE_NAME}" >>"${GITHUB_ENV}"
          printf 'MIXED_WORKLOAD_OCI_OUTPUT_DIR=%s\n' "${report_dir}" >>"${GITHUB_ENV}"
          printf 'MIXED_WORKLOAD_OCI_DURATION=30m\n' >>"${GITHUB_ENV}"
          printf 'MIXED_WORKLOAD_OCI_DOCKER_CONTEXT=%s\n' "${MIXED_WORKLOAD_OCI_DOCKER_CONTEXT}" >>"${GITHUB_ENV}"
          printf 'MIXED_WORKLOAD_OCI_BASE_URL=%s\n' "${MIXED_WORKLOAD_OCI_BASE_URL}" >>"${GITHUB_ENV}"
          printf 'MIXED_WORKLOAD_OCI_REMOTE_WORKDIR=%s\n' "${MIXED_WORKLOAD_OCI_REMOTE_WORKDIR}" >>"${GITHUB_ENV}"
          printf 'MIXED_WORKLOAD_OCI_HOT_ACCOUNT_ID=%s\n' "${MIXED_WORKLOAD_OCI_HOT_ACCOUNT_ID}" >>"${GITHUB_ENV}"
          printf 'MIXED_WORKLOAD_OCI_HOT_FROM=%s\n' "${MIXED_WORKLOAD_OCI_HOT_FROM}" >>"${GITHUB_ENV}"
          printf 'MIXED_WORKLOAD_OCI_HOT_TO=%s\n' "${MIXED_WORKLOAD_OCI_HOT_TO}" >>"${GITHUB_ENV}"
          printf 'MIXED_WORKLOAD_OCI_COLD_ACCOUNT_ID=%s\n' "${MIXED_WORKLOAD_OCI_COLD_ACCOUNT_ID}" >>"${GITHUB_ENV}"
          printf 'MIXED_WORKLOAD_OCI_COLD_FROM=%s\n' "${MIXED_WORKLOAD_OCI_COLD_FROM}" >>"${GITHUB_ENV}"
          printf 'MIXED_WORKLOAD_OCI_COLD_TO=%s\n' "${MIXED_WORKLOAD_OCI_COLD_TO}" >>"${GITHUB_ENV}"
          printf 'MIXED_WORKLOAD_OCI_WRITE_SOURCE_ACCOUNT_ID=%s\n' "${MIXED_WORKLOAD_OCI_WRITE_SOURCE_ACCOUNT_ID}" >>"${GITHUB_ENV}"
          printf 'MIXED_WORKLOAD_OCI_WRITE_TARGET_ACCOUNT_ID=%s\n' "${MIXED_WORKLOAD_OCI_WRITE_TARGET_ACCOUNT_ID}" >>"${GITHUB_ENV}"

      - name: Resolve mixed workload staging database URL
        if: env.MIXED_WORKLOAD_EVIDENCE_READY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! resolved_database_url="$(tools/ops/resolve-oci-a1-staging-database-url.sh)"; then
            echo "::error::Failed to resolve mixed workload staging database URL."
            exit 1
          fi
          echo "::add-mask::${resolved_database_url}"
          printf 'STAGING_OCI_A1_DATABASE_URL=%s\n' "${resolved_database_url}" >>"${GITHUB_ENV}"

      - name: Ensure mixed workload fixture principal
        if: env.MIXED_WORKLOAD_EVIDENCE_READY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          HOT_ACCOUNT_ID="${MIXED_WORKLOAD_OCI_HOT_ACCOUNT_ID}" \
          COLD_ACCOUNT_ID="${MIXED_WORKLOAD_OCI_COLD_ACCOUNT_ID}" \
          STAGING_MIXED_WORKLOAD_WRITE_SOURCE_ACCOUNT_ID="${MIXED_WORKLOAD_OCI_WRITE_SOURCE_ACCOUNT_ID}" \
          STAGING_MIXED_WORKLOAD_WRITE_TARGET_ACCOUNT_ID="${MIXED_WORKLOAD_OCI_WRITE_TARGET_ACCOUNT_ID}" \
          STAGING_REPLAY_TOKEN_FILE="${MIXED_WORKLOAD_OCI_AUTH_TOKEN_FILE:-}" \
            tools/ops/staging-fixture-principal-bootstrap.sh

      - name: Generate mixed workload live evidence manifest artifacts
        if: env.MIXED_WORKLOAD_EVIDENCE_READY != 'true'
        env:
          MIXED_WORKLOAD_AUTOGEN_MODE: live
        shell: bash
        run: |
          set -euo pipefail
          generated_env="${MIXED_WORKLOAD_LIVE_OUTPUT_DIR}/${MIXED_WORKLOAD_LIVE_NAME}-generated-evidence.env"
          bash tools/test/run-transaction-read-mixed-workload-live-evidence-autogen.sh
          test -f "${generated_env}"
          # Generated mixed workload evidence manifest.
          source "${generated_env}"
          for name in \
            MIXED_WORKLOAD_LIVE_OUTPUT_DIR \
            MIXED_WORKLOAD_EVIDENCE_MANIFEST_TSV; do
            value="${!name:-}"
            printf '%s=%s\n' "${name}" "${value}" >>"${GITHUB_ENV}"
          done

      - name: Validate mixed workload evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s "${MIXED_WORKLOAD_EVIDENCE_MANIFEST_TSV}" ]]; then
            mkdir -p "${MIXED_WORKLOAD_LIVE_OUTPUT_DIR}"
            failure_env="${MIXED_WORKLOAD_LIVE_OUTPUT_DIR}/${MIXED_WORKLOAD_LIVE_NAME}-missing-evidence.env"
            failure_md="${MIXED_WORKLOAD_LIVE_OUTPUT_DIR}/${MIXED_WORKLOAD_LIVE_NAME}-missing-evidence.md"
            {
              printf "run_id=%s\n" "${MIXED_WORKLOAD_LIVE_NAME}"
              printf "failure_reason=missing-mixed-workload-evidence-manifest\n"
              printf "manifest_tsv=%s\n" "${MIXED_WORKLOAD_EVIDENCE_MANIFEST_TSV:-missing}"
            } >"${failure_env}"
            {
              echo "# Mixed Workload Evidence Missing Manifest"
              echo
              echo "- run_id=${MIXED_WORKLOAD_LIVE_NAME}"
              echo "- failure_reason=missing-mixed-workload-evidence-manifest"
              echo "- manifest_tsv=${MIXED_WORKLOAD_EVIDENCE_MANIFEST_TSV:-missing}"
            } >"${failure_md}"
            echo "::error::Mixed workload evidence manifest must be a non-empty runner-local TSV: ${MIXED_WORKLOAD_EVIDENCE_MANIFEST_TSV:-missing}"
            exit 1
          fi

      - name: Run mixed workload live evidence gate
        shell: bash
        run: |
          set -euo pipefail
          gate_output="$(
            MIXED_30M_TIMELINE_NAME="${MIXED_WORKLOAD_LIVE_NAME}" \
            MIXED_30M_TIMELINE_INPUT_TSV="${MIXED_WORKLOAD_EVIDENCE_MANIFEST_TSV}" \
            MIXED_30M_TIMELINE_OUTPUT_DIR="${MIXED_WORKLOAD_LIVE_OUTPUT_DIR}" \
              tools/test/run-transaction-read-mixed-workload-30m-timeline.sh
          )"
          echo "${gate_output}"

          report_md="$(tail -1 <<<"${gate_output}")"
          {
            echo "## Transaction Read Mixed Workload Live Evidence"
            echo
            cat "${report_md}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Upload mixed workload live evidence artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: transaction-read-mixed-workload-live-evidence-${{ github.run_id }}
          path: build/reports/k6/${{ env.MIXED_WORKLOAD_LIVE_NAME }}/
          if-no-files-found: ignore

name: OCI k6 service auth token

on:
  workflow_dispatch:
    inputs:
      hot_account_id:
        description: "Hot account id for authenticated transaction read"
        required: true
        default: "910000001"
        type: string
      hot_from:
        description: "Hot account from timestamp"
        required: true
        default: "2026-04-01T00:00:00Z"
        type: string
      hot_to:
        description: "Hot account to timestamp"
        required: true
        default: "2026-04-30T00:00:00Z"
        type: string
      cold_account_id:
        description: "Cold account id for authenticated transaction read"
        required: true
        default: "910000002"
        type: string
      cold_from:
        description: "Cold account from timestamp"
        required: true
        default: "2026-01-01T00:00:00Z"
        type: string
      cold_to:
        description: "Cold account to timestamp"
        required: true
        default: "2026-01-31T00:00:00Z"
        type: string
      vus:
        description: "k6 virtual users"
        required: false
        default: "8"
        type: string
      duration:
        description: "k6 duration"
        required: false
        default: "1m"
        type: string
      arrival_rate:
        description: "k6 constant-arrival-rate iterations per time unit"
        required: false
        default: "16"
        type: string
      time_unit:
        description: "k6 constant-arrival-rate time unit"
        required: false
        default: "1s"
        type: string
      scenario_mode:
        description: "k6 scenario mode"
        required: false
        default: "constant-vus"
        type: choice
        options:
          - constant-vus
          - constant-arrival-rate
          - burst
      burst_rate:
        description: "k6 burst arrival rate per second"
        required: false
        default: "16"
        type: string
      pre_allocated_vus:
        description: "k6 pre-allocated VUs"
        required: false
        type: string
      max_vus:
        description: "k6 max VUs"
        required: false
        type: string
      preemptive_pacing:
        description: "Enable request-before token pacing"
        required: false
        default: false
        type: boolean
      preemptive_pacing_rps:
        description: "Global preemptive pacing RPS budget"
        required: false
        default: "16"
        type: string
      preemptive_pacing_max_sleep_ms:
        description: "Max preemptive pacing sleep per request"
        required: false
        default: "250"
        type: string
      preemptive_pacing_jitter_ms:
        description: "Preemptive pacing jitter"
        required: false
        default: "25"
        type: string
      overload_mode:
        description: "Treat 429 as capacity rejection; empty auto-enables for burst"
        required: false
        type: string
      burst_429_rate_threshold:
        description: "Max total 429 rate for burst overload mode"
        required: false
        default: "0.10"
        type: string
      backend_429_rate_threshold:
        description: "Max backend 429 rate for overload mode"
        required: false
        default: "0.005"
        type: string
      overload_503_rate_threshold:
        description: "Max 503 rate for overload mode"
        required: false
        default: "0"
        type: string
      docker_context:
        description: "Remote Docker context name for off-host k6"
        required: false
        type: string
      remote_base_url:
        description: "Backend URL reachable from off-host k6"
        required: false
        type: string
      remote_prometheus_rw_url:
        description: "Prometheus remote-write URL reachable from off-host k6"
        required: false
        type: string
      remote_workdir:
        description: "Repository path on remote Docker context host"
        required: false
        type: string
      nginx_access_log:
        description: "Nginx JSON access log path for aggregate artifact"
        required: false
        type: string
      report_name:
        description: "Optional k6 report name"
        required: false
        type: string
  pull_request:
    paths:
      - ".github/workflows/oci-k6-service-auth-token.yml"
      - "tools/test/check-oci-k6-service-auth-token-workflow.sh"
      - "tools/test/run-k6-transaction-100m-loadtest.sh"
      - "tools/test/run-transaction-read-nginx-access-aggregate-artifact.sh"
      - "tools/test/check-transaction-read-nginx-access-aggregate-artifact.sh"

permissions:
  contents: read

jobs:
  contract:
    name: OCI k6 service auth token contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate workflow contract
        run: bash tools/test/check-oci-k6-service-auth-token-workflow.sh

  authenticated-k6:
    name: Authenticated OCI k6 capacity
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, oci-a1-staging]
    timeout-minutes: 45
    environment:
      name: staging
    env:
      K6_REPORT_NAME: ${{ inputs.report_name || format('oci-k6-service-auth-token-{0}', github.run_id) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Load OCI k6 service auth env
        env:
          OCI_A1_STAGING_ENV: ${{ secrets.OCI_A1_STAGING_ENV }}
          HOT_ACCOUNT_ID_INPUT: ${{ inputs.hot_account_id }}
          HOT_FROM_INPUT: ${{ inputs.hot_from }}
          HOT_TO_INPUT: ${{ inputs.hot_to }}
          COLD_ACCOUNT_ID_INPUT: ${{ inputs.cold_account_id }}
          COLD_FROM_INPUT: ${{ inputs.cold_from }}
          COLD_TO_INPUT: ${{ inputs.cold_to }}
          VUS_INPUT: ${{ inputs.vus }}
          DURATION_INPUT: ${{ inputs.duration }}
          ARRIVAL_RATE_INPUT: ${{ inputs.arrival_rate }}
          TIME_UNIT_INPUT: ${{ inputs.time_unit }}
          SCENARIO_MODE_INPUT: ${{ inputs.scenario_mode }}
          BURST_RATE_INPUT: ${{ inputs.burst_rate }}
          PRE_ALLOCATED_VUS_INPUT: ${{ inputs.pre_allocated_vus }}
          MAX_VUS_INPUT: ${{ inputs.max_vus }}
          PREEMPTIVE_PACING_INPUT: ${{ inputs.preemptive_pacing }}
          PREEMPTIVE_PACING_RPS_INPUT: ${{ inputs.preemptive_pacing_rps }}
          PREEMPTIVE_PACING_MAX_SLEEP_MS_INPUT: ${{ inputs.preemptive_pacing_max_sleep_ms }}
          PREEMPTIVE_PACING_JITTER_MS_INPUT: ${{ inputs.preemptive_pacing_jitter_ms }}
          OVERLOAD_MODE_INPUT: ${{ inputs.overload_mode }}
          BURST_429_RATE_THRESHOLD_INPUT: ${{ inputs.burst_429_rate_threshold }}
          BACKEND_429_RATE_THRESHOLD_INPUT: ${{ inputs.backend_429_rate_threshold }}
          OVERLOAD_503_RATE_THRESHOLD_INPUT: ${{ inputs.overload_503_rate_threshold }}
          NGINX_ACCESS_LOG_INPUT: ${{ inputs.nginx_access_log }}
          DOCKER_CONTEXT_INPUT: ${{ inputs.docker_context }}
          REMOTE_BASE_URL_INPUT: ${{ inputs.remote_base_url }}
          REMOTE_PROMETHEUS_RW_URL_INPUT: ${{ inputs.remote_prometheus_rw_url }}
          REMOTE_WORKDIR_INPUT: ${{ inputs.remote_workdir }}
          CAPACITY_K6_DOCKER_CONTEXT_VAR: ${{ vars.CAPACITY_K6_DOCKER_CONTEXT }}
          CAPACITY_K6_REMOTE_BASE_URL_VAR: ${{ vars.CAPACITY_K6_REMOTE_BASE_URL }}
          CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL_VAR: ${{ vars.CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL }}
          CAPACITY_K6_REMOTE_WORKDIR_VAR: ${{ vars.CAPACITY_K6_REMOTE_WORKDIR }}
          CAPACITY_K6_NGINX_ACCESS_LOG_VAR: ${{ vars.CAPACITY_K6_NGINX_ACCESS_LOG }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OCI_A1_STAGING_ENV}" ]]; then
            echo "::error::Missing OCI_A1_STAGING_ENV environment secret."
            exit 1
          fi

          staging_env_path="${RUNNER_TEMP}/oci-a1-staging-k6-service-auth.env"
          printf '%s\n' "${OCI_A1_STAGING_ENV}" >"${staging_env_path}"
          chmod 600 "${staging_env_path}"

          set -a
          # k6 capacity도 staging replay와 같은 unified staging secret contract를 사용한다.
          source "${staging_env_path}"
          set +a

          K6_RUN_ID="${K6_REPORT_NAME}"
          K6_RUN_PURPOSE="capacity"
          K6_OBSERVABILITY_MODE="prometheus"
          K6_GENERATOR_MODE="docker-context"
          DEFAULT_K6_DOCKER_CONTEXT="default"
          DEFAULT_K6_REMOTE_BASE_URL="${STAGING_BASE_URL:-}"
          DEFAULT_K6_REMOTE_PROMETHEUS_RW_SERVER_URL="http://172.17.0.2:9090/api/v1/write"
          DEFAULT_K6_NGINX_ACCESS_LOG="/var/log/nginx/access.log"
          K6_DOCKER_CONTEXT="${DOCKER_CONTEXT_INPUT:-${CAPACITY_K6_DOCKER_CONTEXT_VAR:-${DEFAULT_K6_DOCKER_CONTEXT}}}"
          K6_REMOTE_BASE_URL="${REMOTE_BASE_URL_INPUT:-${CAPACITY_K6_REMOTE_BASE_URL:-${CAPACITY_K6_REMOTE_BASE_URL_VAR:-${DEFAULT_K6_REMOTE_BASE_URL}}}}"
          K6_REMOTE_PROMETHEUS_RW_SERVER_URL="${REMOTE_PROMETHEUS_RW_URL_INPUT:-${CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL:-${CAPACITY_K6_REMOTE_PROMETHEUS_RW_SERVER_URL_VAR:-${DEFAULT_K6_REMOTE_PROMETHEUS_RW_SERVER_URL}}}}"
          K6_REMOTE_WORKDIR="${REMOTE_WORKDIR_INPUT:-${CAPACITY_K6_REMOTE_WORKDIR_VAR:-}}"
          if [[ -z "${K6_REMOTE_WORKDIR}" ]]; then
            if [[ "${K6_DOCKER_CONTEXT}" == "default" ]]; then
              K6_REMOTE_WORKDIR="${GITHUB_WORKSPACE}"
            else
              K6_REMOTE_WORKDIR="${CAPACITY_K6_REMOTE_WORKDIR:-${GITHUB_WORKSPACE}}"
            fi
          fi
          K6_REMOTE_PREFLIGHT="true"
          K6_AUTH_TOKEN_ENV_NAME="STAGING_REPLAY_TOKEN"
          K6_AUTH_TOKEN_REQUIRED="true"
          K6_AUTH_PREFLIGHT="true"
          K6_AUTH_PREFLIGHT_PATH="api/v1/transactions?accountId=${HOT_ACCOUNT_ID_INPUT}&from=${HOT_FROM_INPUT}&to=${HOT_TO_INPUT}&limit=1"
          K6_AUTH_PREFLIGHT_EXPECTED_STATUS="200"
          K6_HOT_ACCOUNT_ID="${HOT_ACCOUNT_ID_INPUT}"
          K6_HOT_FROM="${HOT_FROM_INPUT}"
          K6_HOT_TO="${HOT_TO_INPUT}"
          K6_COLD_ACCOUNT_ID="${COLD_ACCOUNT_ID_INPUT}"
          K6_COLD_FROM="${COLD_FROM_INPUT}"
          K6_COLD_TO="${COLD_TO_INPUT}"
          K6_VUS="${VUS_INPUT}"
          K6_DURATION="${DURATION_INPUT}"
          K6_SCENARIO_MODE="${SCENARIO_MODE_INPUT}"
          K6_RATE="${ARRIVAL_RATE_INPUT}"
          K6_TIME_UNIT="${TIME_UNIT_INPUT}"
          K6_OVERLOAD_MODE="${OVERLOAD_MODE_INPUT}"
          if [[ -z "${K6_OVERLOAD_MODE}" && "${K6_SCENARIO_MODE}" == "burst" ]]; then
            K6_OVERLOAD_MODE="true"
          fi
          K6_OVERLOAD_MODE="${K6_OVERLOAD_MODE:-false}"
          K6_BURST_RATE="${BURST_RATE_INPUT}"
          K6_PRE_ALLOCATED_VUS="${PRE_ALLOCATED_VUS_INPUT}"
          K6_MAX_VUS="${MAX_VUS_INPUT}"
          K6_PREEMPTIVE_PACING="${PREEMPTIVE_PACING_INPUT}"
          K6_PREEMPTIVE_PACING_RPS="${PREEMPTIVE_PACING_RPS_INPUT}"
          K6_PREEMPTIVE_PACING_MAX_SLEEP_MS="${PREEMPTIVE_PACING_MAX_SLEEP_MS_INPUT}"
          K6_PREEMPTIVE_PACING_JITTER_MS="${PREEMPTIVE_PACING_JITTER_MS_INPUT}"
          K6_BURST_429_RATE_THRESHOLD="${BURST_429_RATE_THRESHOLD_INPUT}"
          K6_BACKEND_429_RATE_THRESHOLD="${BACKEND_429_RATE_THRESHOLD_INPUT}"
          K6_OVERLOAD_503_RATE_THRESHOLD="${OVERLOAD_503_RATE_THRESHOLD_INPUT}"
          K6_NGINX_ACCESS_LOG="${NGINX_ACCESS_LOG_INPUT:-${K6_NGINX_ACCESS_LOG:-${NGINX_ACCESS_LOG:-${CAPACITY_K6_NGINX_ACCESS_LOG:-${CAPACITY_K6_NGINX_ACCESS_LOG_VAR:-${DEFAULT_K6_NGINX_ACCESS_LOG}}}}}}"

          if ! [[ "${K6_REPORT_NAME}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::K6 report name must contain only letters, numbers, dot, underscore, or hyphen."
            exit 1
          fi

          missing=()
          [[ -z "${STAGING_REPLAY_TOKEN:-}" ]] && missing+=("STAGING_REPLAY_TOKEN")
          [[ -z "${K6_DOCKER_CONTEXT}" ]] && missing+=("K6_DOCKER_CONTEXT")
          [[ -z "${K6_REMOTE_BASE_URL}" ]] && missing+=("K6_REMOTE_BASE_URL")
          [[ -z "${K6_REMOTE_PROMETHEUS_RW_SERVER_URL}" ]] && missing+=("K6_REMOTE_PROMETHEUS_RW_SERVER_URL")
          [[ -z "${K6_HOT_ACCOUNT_ID}" ]] && missing+=("K6_HOT_ACCOUNT_ID")
          [[ -z "${K6_HOT_FROM}" ]] && missing+=("K6_HOT_FROM")
          [[ -z "${K6_HOT_TO}" ]] && missing+=("K6_HOT_TO")
          [[ -z "${K6_COLD_ACCOUNT_ID}" ]] && missing+=("K6_COLD_ACCOUNT_ID")
          [[ -z "${K6_COLD_FROM}" ]] && missing+=("K6_COLD_FROM")
          [[ -z "${K6_COLD_TO}" ]] && missing+=("K6_COLD_TO")
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing OCI k6 service auth env keys: %s\n' "${missing[*]}"
            exit 1
          fi

          env_names=(
            STAGING_REPLAY_TOKEN
            K6_REPORT_NAME
            K6_RUN_ID
            K6_RUN_PURPOSE
            K6_OBSERVABILITY_MODE
            K6_GENERATOR_MODE
            K6_DOCKER_CONTEXT
            K6_REMOTE_BASE_URL
            K6_REMOTE_PROMETHEUS_RW_SERVER_URL
            K6_REMOTE_WORKDIR
            K6_REMOTE_PREFLIGHT
            K6_AUTH_TOKEN_ENV_NAME
            K6_AUTH_TOKEN_REQUIRED
            K6_AUTH_PREFLIGHT
            K6_AUTH_PREFLIGHT_PATH
            K6_AUTH_PREFLIGHT_EXPECTED_STATUS
            K6_HOT_ACCOUNT_ID
            K6_HOT_FROM
            K6_HOT_TO
            K6_COLD_ACCOUNT_ID
            K6_COLD_FROM
            K6_COLD_TO
            K6_VUS
            K6_DURATION
            K6_SCENARIO_MODE
            K6_RATE
            K6_TIME_UNIT
            K6_OVERLOAD_MODE
            K6_BURST_RATE
            K6_PRE_ALLOCATED_VUS
            K6_MAX_VUS
            K6_PREEMPTIVE_PACING
            K6_PREEMPTIVE_PACING_RPS
            K6_PREEMPTIVE_PACING_MAX_SLEEP_MS
            K6_PREEMPTIVE_PACING_JITTER_MS
            K6_BURST_429_RATE_THRESHOLD
            K6_BACKEND_429_RATE_THRESHOLD
            K6_OVERLOAD_503_RATE_THRESHOLD
            K6_NGINX_ACCESS_LOG
          )

          for name in "${env_names[@]}"; do
            value="${!name:-}"
            if [[ -n "${value}" ]]; then
              case "${name}" in
                STAGING_REPLAY_TOKEN|K6_REMOTE_*|*TOKEN*|*DATABASE_URL|*_ENV_B64)
                  echo "::add-mask::${value}"
                  ;;
              esac
              printf '%s=%s\n' "${name}" "${value}" >>"${GITHUB_ENV}"
            fi
          done

      - name: Write k6 pacing evidence artifact
        shell: bash
        run: |
          set -euo pipefail
          report_dir="build/reports/k6/${K6_REPORT_NAME}"
          mkdir -p "${report_dir}"
          pacing_input="${report_dir}/k6-pacing-input.json"
          pacing_summary="${report_dir}/k6-pacing-summary.md"
          cat >"${pacing_input}" <<JSON
          {
            "k6_run_id": "${K6_RUN_ID}",
            "scenario_mode": "${K6_SCENARIO_MODE}",
            "constant_arrival_rate": {
              "rate": "${K6_RATE}",
              "time_unit": "${K6_TIME_UNIT}",
              "gate_role": "strict"
            },
            "constant_vus": {
              "vus": "${K6_VUS}",
              "duration": "${K6_DURATION}",
              "gate_role": "saturation_probe"
            },
            "burst": {
              "rate": "${K6_BURST_RATE}",
              "pre_allocated_vus": "${K6_PRE_ALLOCATED_VUS:-}",
              "max_vus": "${K6_MAX_VUS:-}",
              "overload_mode": "${K6_OVERLOAD_MODE}"
            },
            "preemptive_pacing": {
              "enabled": ${K6_PREEMPTIVE_PACING},
              "rps": "${K6_PREEMPTIVE_PACING_RPS}",
              "max_sleep_ms": "${K6_PREEMPTIVE_PACING_MAX_SLEEP_MS}",
              "jitter_ms": "${K6_PREEMPTIVE_PACING_JITTER_MS}"
            }
          }
          JSON
          cat >"${pacing_summary}" <<SUMMARY
          # k6 Pacing Evidence

          - k6_run_id=${K6_RUN_ID}
          - scenario_mode=${K6_SCENARIO_MODE}
          - arrival-rate gate: ${K6_RATE}/${K6_TIME_UNIT}
          - constant-vus saturation probe: vus=${K6_VUS}, duration=${K6_DURATION}
          - burst probe: rate=${K6_BURST_RATE}, preAllocatedVUs=${K6_PRE_ALLOCATED_VUS:-}, maxVUs=${K6_MAX_VUS:-}
          - preemptive pacing: enabled=${K6_PREEMPTIVE_PACING}, rps=${K6_PREEMPTIVE_PACING_RPS}, maxSleepMs=${K6_PREEMPTIVE_PACING_MAX_SLEEP_MS}, jitterMs=${K6_PREEMPTIVE_PACING_JITTER_MS}
          SUMMARY
          printf 'K6_PACING_INPUT_REF=%s\n' "${pacing_input}" >>"${GITHUB_ENV}"
          printf 'K6_PACING_SUMMARY_REF=%s\n' "${pacing_summary}" >>"${GITHUB_ENV}"

      - name: Run auth preflight
        shell: bash
        run: |
          set -euo pipefail
          report_dir="build/reports/k6/${K6_REPORT_NAME}"
          mkdir -p "${report_dir}"
          tools/test/run-k6-transaction-100m-loadtest.sh --auth-preflight-only >"${report_dir}/auth-preflight.log" 2>&1

      - name: Run authenticated k6 capacity
        shell: bash
        run: |
          set -euo pipefail
          report_dir="build/reports/k6/${K6_REPORT_NAME}"
          mkdir -p "${report_dir}"
          tools/test/run-k6-transaction-100m-loadtest.sh --no-up --no-deps >"${report_dir}/k6-capacity.log" 2>&1

      - name: Build transaction read Nginx aggregate artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report_dir="build/reports/k6/${K6_REPORT_NAME}"
          mkdir -p "${report_dir}"
          if [[ -z "${K6_NGINX_ACCESS_LOG:-}" || ! -s "${K6_NGINX_ACCESS_LOG:-}" ]]; then
            echo "::notice::K6_NGINX_ACCESS_LOG is missing or empty; transaction-read-nginx-access-aggregate artifact skipped."
            exit 0
          fi
          NGINX_ACCESS_AGGREGATE_NAME="${K6_REPORT_NAME}" \
          NGINX_ACCESS_AGGREGATE_LOG="${K6_NGINX_ACCESS_LOG}" \
          NGINX_ACCESS_AGGREGATE_OUTPUT_DIR="${report_dir}/transaction-read-nginx-access-aggregate" \
            tools/test/run-transaction-read-nginx-access-aggregate-artifact.sh

      - name: Upload OCI k6 auth artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oci-k6-service-auth-token-${{ github.run_id }}
          path: |
            build/reports/k6/${{ env.K6_REPORT_NAME }}/
            build/reports/k6/${{ env.K6_REPORT_NAME }}*
          if-no-files-found: ignore

name: CI Workflow Contract

on:
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "LICENSE"
      - "NOTICE"
      - "THIRD_PARTY_NOTICES.md"
      - "tools/ci/check-repo-hygiene.mjs"
      - "tools/test/check-ci-runtime-optimization-contract.sh"
      - "tools/test/check-flyway-backward-compatible-migrations.sh"
      - "tools/test/check-transaction-read-model-staging-replay.sh"
      - "tools/ops/transaction-read-model-staging-replay.sh"
      - "tools/test/run-transaction-query-plan-regression-gate.sh"
  pull_request:
    branches:
      - main
    paths:
      - ".github/**"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "LICENSE"
      - "NOTICE"
      - "THIRD_PARTY_NOTICES.md"
      - "tools/ci/check-repo-hygiene.mjs"
      - "tools/test/check-ci-runtime-optimization-contract.sh"
      - "tools/test/check-flyway-backward-compatible-migrations.sh"
      - "tools/test/check-transaction-read-model-staging-replay.sh"
      - "tools/ops/transaction-read-model-staging-replay.sh"
      - "tools/test/run-transaction-query-plan-regression-gate.sh"

permissions:
  contents: read

concurrency:
  group: workflow-contract-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: CI Runtime Optimization Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Check repository hygiene guard
        run: node tools/ci/check-repo-hygiene.mjs

      - name: Check CI runtime optimization contract
        run: bash tools/test/check-ci-runtime-optimization-contract.sh

      - name: Check transaction staging replay contract
        run: bash tools/test/check-transaction-read-model-staging-replay.sh

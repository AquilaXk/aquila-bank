name: CI Workflow Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "tools/test/check-ci-runtime-optimization-contract.sh"
      - "tools/test/check-flyway-backward-compatible-migrations.sh"
      - "tools/test/run-transaction-query-plan-regression-gate.sh"

permissions:
  contents: read

concurrency:
  group: workflow-contract-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: CI Runtime Optimization Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check CI runtime optimization contract
        run: bash tools/test/check-ci-runtime-optimization-contract.sh

changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
      - chore
      - ci
  categories:
    - title: "✨ 주요 기능 (Features)"
      labels:
        - enhancement
        - feature
    - title: "🐛 결함 수정 (Bug Fixes)"
      labels:
        - bug
    - title: "🔒 보안 및 안정성 (Security & Hardening)"
      labels:
        - security
    - title: "⚡ 성능 및 용량 검증 (Performance & Capacity)"
      labels:
        - performance
    - title: "🔧 기타 개선 (Other Changes)"
      labels:
        - "*"
